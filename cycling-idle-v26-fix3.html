<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cycling Idle Manager</title>
<meta name="theme-color" content="#1a6b38">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cycling IM">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#fff;--bg2:#f5f5f4;--bg3:#ebebea;
  --txt:#1a1a18;--txt2:#6b6b67;--txt3:#9a9a96;
  --border:rgba(0,0,0,.12);--border2:rgba(0,0,0,.22);
  --green-bg:#eaf3de;--green-txt:#3b6d11;--green-bd:rgba(59,109,17,.3);
  --red-bg:#fcebeb;--red-txt:#a32d2d;--red-bd:rgba(163,45,45,.3);
  --blue-bg:#e6f1fb;--blue-txt:#185fa5;--blue-bd:rgba(24,95,165,.3);
  --amber-bg:#faeeda;--amber-txt:#854f0b;--amber-bd:rgba(133,79,11,.3);
  --teal-bg:#e1f5ee;--teal-txt:#0f6e56;--teal-bd:rgba(15,110,86,.3);
  --purple-bg:#EEEDFE;--purple-txt:#3C3489;--purple-bd:rgba(83,74,183,.3);
  --gold:#b8860b;--silver:#888;--bronze:#8b4513;
  --radius:8px;--radius-lg:12px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1e1e1c;--bg2:#2a2a27;--bg3:#333330;
  --txt:#e8e8e4;--txt2:#9a9a96;--txt3:#6b6b67;
  --border:rgba(255,255,255,.1);--border2:rgba(255,255,255,.2);
  --green-bg:#173404;--green-txt:#c0dd97;--green-bd:rgba(192,221,151,.3);
  --red-bg:#501313;--red-txt:#f09595;--red-bd:rgba(240,149,149,.3);
  --blue-bg:#042c53;--blue-txt:#85b7eb;--blue-bd:rgba(133,183,235,.3);
  --amber-bg:#412402;--amber-txt:#fac775;--amber-bd:rgba(250,199,117,.3);
  --teal-bg:#04342c;--teal-txt:#5dcaa5;--teal-bd:rgba(93,202,165,.3);
  --purple-bg:#26215C;--purple-txt:#AFA9EC;--purple-bd:rgba(175,169,236,.3);
  --gold:#d4a017;--silver:#aaa;--bronze:#cd853f;
}}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg3);color:var(--txt);min-height:100vh;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);}
#app{max-width:600px;margin:0 auto;padding:1rem 1rem 5rem;}
button{font-family:inherit;cursor:pointer;}
.game-header{background:var(--bg);border:.5px solid var(--border);border-radius:var(--radius-lg);
  padding:1rem 1.25rem;margin-bottom:.75rem;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.game-title{font-size:18px;font-weight:700;margin-bottom:.75rem;}
.game-title .accent{color:#1a6b38;}
.stat-row{display:flex;gap:.75rem;flex-wrap:wrap;}
.stat-item{flex:1;min-width:60px;}
.stat-val{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1;}
.stat-lbl{font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.04em;margin-top:3px;}
.stat-sublbl{font-size:10px;color:var(--blue-txt);margin-top:2px;font-weight:600;}
.main-tabs{display:flex;background:var(--bg);border:.5px solid var(--border);border-radius:var(--radius-lg);
  padding:4px;gap:3px;margin-bottom:.75rem;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.main-tab{flex:1;border:none;border-radius:8px;background:none;padding:9px 2px;
  font-size:11px;font-weight:500;color:var(--txt2);transition:background .15s,color .15s;position:relative;}
.main-tab.active{background:var(--green-bg);color:var(--green-txt);font-weight:700;}
.main-tab:hover:not(.active){background:var(--bg2);}
.main-tab.session-active::after,.main-tab.race-active::after{
  content:'';position:absolute;top:5px;right:6px;width:6px;height:6px;
  border-radius:50%;animation:pulse-dot 1s ease-in-out infinite alternate;}
.main-tab.session-active::after{background:var(--blue-txt);}
.main-tab.race-active::after{background:var(--red-txt);}
.main-tab.growth-ready::after{background:var(--amber-txt);}
.main-tab.sponsor-ready::after{background:var(--green-txt);}
.main-tab.calendar-ready::after{background:var(--purple-txt);}
@keyframes pulse-dot{from{opacity:.3}to{opacity:1}}
.section-lbl{font-size:11px;font-weight:600;color:var(--txt3);
  text-transform:uppercase;letter-spacing:.08em;margin-bottom:.5rem;padding:0 2px;}
.energy-card{background:var(--bg);border:.5px solid var(--border);border-radius:var(--radius-lg);
  padding:1rem 1.25rem;margin-bottom:.75rem;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.energy-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:.5rem;}
.energy-label{font-size:13px;font-weight:600;}
.energy-amount{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--green-txt);}
.energy-bar-outer{height:10px;background:var(--bg3);border-radius:5px;overflow:hidden;margin-bottom:.4rem;}
.energy-bar-inner{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--green-txt),#4caf50);transition:width .3s;}
.energy-bar-inner.low{background:linear-gradient(90deg,var(--amber-txt),#f59e0b);}
.energy-bar-inner.critical{background:linear-gradient(90deg,var(--red-txt),#ef4444);}
.energy-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--txt3);}
.energy-hint{font-size:11px;color:var(--amber-txt);margin-top:.3rem;font-weight:500;}
.attr-row{display:flex;gap:5px;margin-bottom:.75rem;flex-wrap:wrap;}
.attr-pill{flex:1;min-width:0;display:flex;align-items:center;gap:4px;
  padding:6px 8px;border-radius:99px;border:.5px solid var(--border);background:var(--bg);}
.attr-pill-icon{font-size:14px;flex-shrink:0;}
.attr-pill-body{flex:1;min-width:0;}
.attr-pill-top{display:flex;justify-content:space-between;font-size:10px;font-weight:700;}
.attr-pill-bar{height:2px;background:var(--bg3);border-radius:1px;margin-top:3px;}
.attr-pill-fill{height:100%;border-radius:1px;transition:width .3s;}
.session-card{background:var(--bg);border:.5px solid var(--border);border-radius:var(--radius);
  padding:12px 14px;margin-bottom:8px;transition:opacity .2s;}
.session-card.available{cursor:pointer;border-color:var(--border2);}
.session-card.available:active{opacity:.75;}
.session-card-head{display:flex;align-items:center;gap:8px;}
.zone-badge{font-size:10px;font-weight:800;padding:3px 7px;border-radius:99px;color:#fff;flex-shrink:0;}
.session-card-text{flex:1;min-width:0;}
.session-card-name{font-size:14px;font-weight:600;}
.session-card-sub{font-size:11px;color:var(--txt3);margin-top:1px;}
.session-status{font-size:12px;font-weight:600;white-space:nowrap;flex-shrink:0;}
.session-gains{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px;}
.gain-badge{font-size:10px;padding:2px 7px;border-radius:99px;background:var(--bg3);color:var(--txt2);font-weight:500;}
.energy-cost-badge{font-size:10px;padding:2px 7px;border-radius:99px;
  background:var(--green-bg);color:var(--green-txt);font-weight:600;border:.5px solid var(--green-bd);}
.energy-cost-badge.unaffordable{background:var(--red-bg);color:var(--red-txt);border-color:var(--red-bd);}
.cooldown-bar-wrap{height:2px;background:var(--bg3);border-radius:1px;margin-top:6px;overflow:hidden;}
.cooldown-bar{height:100%;border-radius:1px;background:var(--amber-txt);transition:width .5s linear;}
.active-session{border-radius:var(--radius-lg);padding:16px 14px;margin-bottom:.75rem;}
.active-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.active-name{flex:1;font-size:17px;font-weight:700;}
.active-timer{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;}
.active-bar-wrap{height:10px;border-radius:5px;background:rgba(0,0,0,.18);margin-bottom:12px;overflow:hidden;}
.active-bar{height:100%;border-radius:5px;transition:width .2s linear;}
.active-flavour{font-size:12px;font-weight:500;opacity:.7;margin-bottom:8px;}
.active-gains-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;opacity:.6;margin-bottom:5px;}
.active-gains{display:flex;gap:5px;flex-wrap:wrap;}
.active-gain-pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;background:rgba(0,0,0,.12);}
.race-setup-card{background:var(--bg);border:.5px solid var(--border);border-radius:var(--radius-lg);
  padding:1rem 1.25rem;margin-bottom:.75rem;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.race-setup-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:.6rem;}
.race-setup-title{font-size:13px;font-weight:700;}
.race-setup-hint{font-size:11px;color:var(--txt3);}
.race-setup-row{display:flex;align-items:center;gap:8px;padding:5px 0;
  border-bottom:.5px solid var(--border);}
.race-setup-row:last-child{border-bottom:none;padding-bottom:0;}
.race-setup-icon{font-size:15px;width:22px;flex-shrink:0;text-align:center;}
.race-setup-label{flex:1;font-size:12px;color:var(--txt2);}
.race-setup-name{font-size:12px;font-weight:600;text-align:right;}
.cat-card{background:var(--bg);border:.5px solid var(--border);border-radius:var(--radius-lg);
  padding:1rem 1.25rem;margin-bottom:.75rem;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.cat-head{display:flex;align-items:center;gap:10px;margin-bottom:.75rem;}
.cat-icon{font-size:28px;}
.cat-body{flex:1;}
.cat-name{font-size:17px;font-weight:700;}
.cat-desc{font-size:12px;color:var(--txt2);margin-top:2px;}
.cat-pts-row{display:flex;justify-content:space-between;font-size:12px;color:var(--txt2);margin-bottom:.4rem;}
.cat-pts-val{font-weight:700;color:var(--txt);}
.cat-bar-outer{height:8px;background:var(--bg3);border-radius:4px;overflow:hidden;}
.cat-bar-inner{height:100%;background:var(--amber-txt);border-radius:4px;transition:width .4s;}
.cat-promo{font-size:12px;font-weight:600;color:var(--amber-txt);margin-top:.4rem;}
.race-card{background:var(--bg);border:.5px solid var(--border);border-radius:var(--radius);
  padding:12px 14px;margin-bottom:8px;transition:opacity .2s;}
.race-card.available{cursor:pointer;border-color:var(--border2);}
.race-card.available:active{opacity:.75;}
.race-card-head{display:flex;align-items:center;gap:8px;}
.race-type-icon{font-size:20px;width:28px;text-align:center;flex-shrink:0;}
.race-card-text{flex:1;min-width:0;}
.race-card-name{font-size:14px;font-weight:600;}
.race-card-desc{font-size:11px;color:var(--txt3);margin-top:1px;}
.race-status{font-size:12px;font-weight:600;white-space:nowrap;flex-shrink:0;}
.race-meta{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px;}
.race-meta-badge{font-size:10px;padding:2px 7px;border-radius:99px;background:var(--bg3);color:var(--txt2);font-weight:500;}
.race-prize-badge{background:var(--green-bg);color:var(--green-txt);border:.5px solid var(--green-bd);}
.race-energy-badge{font-size:10px;padding:2px 7px;border-radius:99px;
  background:var(--blue-bg);color:var(--blue-txt);font-weight:600;border:.5px solid var(--blue-bd);}
.race-energy-badge.unaffordable{background:var(--red-bg);color:var(--red-txt);border-color:var(--red-bd);}
.race-equip-bonus{font-size:10px;padding:2px 7px;border-radius:99px;font-weight:700;}
.active-race{border-radius:var(--radius-lg);padding:16px 14px;margin-bottom:.75rem;
  border:1.5px solid var(--red-bd);background:var(--red-bg);}
.race-run-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.race-run-name{flex:1;font-size:16px;font-weight:700;color:var(--red-txt);}
.race-run-timer{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--red-txt);}
.race-progress-wrap{height:8px;border-radius:4px;background:rgba(0,0,0,.18);margin-bottom:10px;overflow:hidden;}
.race-progress-bar{height:100%;border-radius:4px;background:var(--red-txt);transition:width .1s linear;}
.race-commentary{font-size:13px;font-weight:600;color:var(--red-txt);text-align:center;margin-bottom:10px;min-height:18px;}
.race-pos-row{display:flex;justify-content:space-between;font-size:12px;color:var(--red-txt);opacity:.85;}
.race-result-card{background:var(--bg);border:.5px solid var(--border);border-radius:var(--radius-lg);
  padding:1.25rem;margin-bottom:.75rem;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.result-head{display:flex;align-items:center;gap:16px;margin-bottom:1rem;}
.result-pos-badge{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:22px;font-weight:800;flex-shrink:0;font-variant-numeric:tabular-nums;}
.result-pos-badge.pos-1{background:#FFD70033;color:var(--gold);border:2px solid var(--gold);}
.result-pos-badge.pos-2{background:#C0C0C033;color:var(--silver);border:2px solid var(--silver);}
.result-pos-badge.pos-3{background:#CD7F3233;color:var(--bronze);border:2px solid var(--bronze);}
.result-pos-badge.pos-other{background:var(--bg3);color:var(--txt);border:2px solid var(--border);}
.result-info{flex:1;}
.result-title{font-size:16px;font-weight:700;margin-bottom:4px;}
.result-sub{font-size:12px;color:var(--txt2);}
.result-rewards{display:flex;gap:.5rem;flex-wrap:wrap;}
.result-reward-pill{padding:6px 12px;border-radius:99px;font-size:13px;font-weight:600;}
.result-reward-money{background:var(--green-bg);color:var(--green-txt);}
.result-reward-pts{background:var(--amber-bg);color:var(--amber-txt);}
.result-reward-none{background:var(--bg3);color:var(--txt3);}
.result-cat-progress{margin-top:.75rem;font-size:12px;color:var(--txt2);}
.history-row{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--bg);
  border:.5px solid var(--border);border-radius:var(--radius);margin-bottom:6px;}
.history-pos{font-size:13px;font-weight:800;width:40px;font-variant-numeric:tabular-nums;flex-shrink:0;}
.history-pos.top3{color:var(--amber-txt);}
.history-detail{flex:1;font-size:12px;color:var(--txt2);}
.history-detail strong{color:var(--txt);font-size:13px;}
.history-prize{font-size:13px;font-weight:700;color:var(--green-txt);white-space:nowrap;}
.rider-stats-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem;margin-bottom:.75rem;}
.rider-stat-card{background:var(--bg);border:.5px solid var(--border);border-radius:var(--radius);padding:12px 8px;text-align:center;}
.rsc-icon{font-size:20px;margin-bottom:3px;}
.rsc-val{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;}
.rsc-unit{font-size:11px;font-weight:500;margin-left:1px;}
.rsc-label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--txt3);margin:4px 0 6px;}
.rsc-bar-wrap{height:4px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-bottom:4px;}
.rsc-bar{height:100%;border-radius:2px;transition:width .4s;}
.rsc-sublabel{font-size:9px;color:var(--txt3);}
.rsc-ftp-hero{grid-column:1/-1;display:flex;align-items:center;background:var(--amber-bg);
  border:.5px solid var(--amber-bd);border-radius:var(--radius);padding:14px 16px;gap:12px;margin-bottom:.5rem;}
.rsc-ftp-icon{font-size:32px;}
.rsc-ftp-body{flex:1;}
.rsc-ftp-num{font-size:36px;font-weight:800;color:var(--amber-txt);font-variant-numeric:tabular-nums;line-height:1;}
.rsc-ftp-sub{font-size:11px;color:var(--amber-txt);opacity:.7;margin-top:2px;}
.rsc-ftp-bar-wrap{height:6px;background:rgba(0,0,0,.12);border-radius:3px;margin-top:8px;overflow:hidden;}
.rsc-ftp-bar{height:100%;background:var(--amber-txt);border-radius:3px;transition:width .4s;}
.pw-hero{display:flex;align-items:center;background:var(--teal-bg);border:.5px solid var(--teal-bd);
  border-radius:var(--radius);padding:10px 14px;gap:10px;margin-bottom:.5rem;}
.pw-hero-icon{font-size:24px;flex-shrink:0;}
.pw-hero-body{flex:1;min-width:0;}
.pw-hero-num{font-size:22px;font-weight:800;color:var(--teal-txt);font-variant-numeric:tabular-nums;line-height:1;}
.pw-hero-sub{font-size:11px;color:var(--teal-txt);opacity:.85;margin-top:2px;}
.ftp-contrib-wrap{background:var(--bg);border:.5px solid var(--border);border-radius:var(--radius);padding:10px 12px;margin-bottom:.5rem;}
.ftp-contrib-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--txt3);margin-bottom:7px;}
.ftp-contrib-item{display:flex;align-items:center;gap:8px;padding:4px 0;}
.ftp-contrib-icon{font-size:14px;width:20px;text-align:center;flex-shrink:0;}
.ftp-contrib-label{font-size:11px;font-weight:600;width:76px;flex-shrink:0;}
.ftp-contrib-bar-wrap{flex:1;height:5px;background:var(--bg3);border-radius:3px;overflow:hidden;}
.ftp-contrib-bar{height:100%;border-radius:3px;transition:width .3s;}
.ftp-contrib-gain{font-size:10px;font-weight:700;flex-shrink:0;width:50px;text-align:right;}
.attr-card{background:var(--bg);border:.5px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:8px;}
.attr-card-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.attr-card-icon{font-size:24px;}
.attr-card-info{flex:1;}
.attr-card-name{font-size:15px;font-weight:700;}
.attr-card-desc{font-size:12px;color:var(--txt2);margin-top:2px;}
.attr-level-pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;}
.attr-xp-row{display:flex;align-items:center;gap:8px;}
.attr-xp-bar-wrap{flex:1;height:7px;border-radius:4px;background:var(--bg3);overflow:hidden;}
.attr-xp-bar{height:100%;border-radius:4px;transition:width .3s;}
.attr-xp-label{font-size:11px;color:var(--txt3);white-space:nowrap;}
.attr-bonus-row{margin-top:8px;font-size:12px;font-weight:600;}
.gear-nav{display:flex;gap:5px;margin-bottom:.75rem;overflow-x:auto;padding-bottom:3px;-webkit-overflow-scrolling:touch;}
.gear-nav-btn{flex-shrink:0;padding:7px 13px;border:1.5px solid var(--border);border-radius:99px;
  background:var(--bg);color:var(--txt2);font-size:11px;font-weight:500;cursor:pointer;white-space:nowrap;}
.gear-nav-btn.active{border-color:var(--green-bd);background:var(--green-bg);color:var(--green-txt);font-weight:700;}
.equip-card{background:var(--bg);border:.5px solid var(--border);border-radius:var(--radius);
  padding:13px 14px;margin-bottom:8px;transition:border-color .15s,background .15s,opacity .2s;}
.equip-card.equipped{border-color:var(--green-bd);}
.equip-card.cant-afford{opacity:.55;}
.equip-head{display:flex;align-items:flex-start;gap:10px;}
.equip-main{flex:1;min-width:0;}
.equip-brand{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--txt3);margin-bottom:2px;}
.equip-model{font-size:14px;font-weight:700;line-height:1.2;}
.equip-desc{font-size:11px;color:var(--txt2);margin-top:3px;line-height:1.35;}
.equip-badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px;align-items:center;}
.tier-badge{font-size:9px;font-weight:800;padding:2px 6px;border-radius:99px;text-transform:uppercase;letter-spacing:.05em;}
.tier-1{background:var(--bg3);color:var(--txt3);}
.tier-2{background:var(--blue-bg);color:var(--blue-txt);}
.tier-3{background:var(--amber-bg);color:var(--amber-txt);}
.tier-4{background:var(--red-bg);color:var(--red-txt);}
.tier-5{background:var(--purple-bg);color:var(--purple-txt);}
.type-badge{font-size:10px;padding:2px 7px;border-radius:99px;background:var(--bg3);color:var(--txt2);font-weight:500;}
.stat-bars{margin-top:8px;display:flex;flex-direction:column;gap:4px;}
.stat-bar-row{display:flex;align-items:center;gap:6px;}
.stat-bar-lbl{font-size:10px;color:var(--txt3);width:36px;flex-shrink:0;}
.stat-bar-outer{flex:1;height:4px;background:var(--bg3);border-radius:2px;overflow:hidden;}
.stat-bar-inner{height:100%;border-radius:2px;transition:width .3s;}
.stat-bar-val{font-size:10px;font-weight:700;width:28px;text-align:right;flex-shrink:0;}
.equip-action-col{flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
.equip-price{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--txt2);}
.equip-price.affordable{color:var(--green-txt);}
.equip-price.owned{color:var(--green-txt);}
.equip-btn{font-size:11px;font-weight:700;padding:6px 11px;border-radius:var(--radius);border:none;cursor:pointer;white-space:nowrap;}
.btn-buy{background:var(--green-bg);color:var(--green-txt);border:.5px solid var(--green-bd);}
.btn-equip{background:var(--blue-bg);color:var(--blue-txt);border:.5px solid var(--blue-bd);}
.btn-equipped{background:var(--green-txt);color:#fff;}
.btn-locked{background:var(--bg3);color:var(--txt3);border:.5px solid var(--border);cursor:default;}
.upgrade-card,.energy-item-card{display:flex;align-items:center;gap:12px;
  padding:12px 14px;border:.5px solid var(--border);border-radius:var(--radius);
  background:var(--bg);margin-bottom:8px;transition:border-color .2s,background .2s,opacity .2s;}
.upgrade-card.affordable,.energy-item-card.affordable{border-color:var(--green-bd);background:var(--green-bg);cursor:pointer;}
.upgrade-card.affordable:active,.energy-item-card.affordable:active{opacity:.8;}
.upgrade-card.bought{opacity:.35;}
.upgrade-card.locked,.energy-item-card.cant-afford{opacity:.55;}
.energy-item-card.full{opacity:.35;}
.upgrade-icon,.energy-item-icon{font-size:24px;flex-shrink:0;width:34px;text-align:center;}
.upgrade-info,.energy-item-info{flex:1;min-width:0;}
.upgrade-name,.energy-item-name{font-size:14px;font-weight:600;}
.upgrade-desc,.energy-item-desc{font-size:12px;color:var(--txt2);margin-top:2px;line-height:1.35;}
.upgrade-benefit{font-size:11px;color:var(--green-txt);margin-top:4px;font-weight:500;}
.energy-item-gain{font-size:11px;color:var(--blue-txt);margin-top:4px;font-weight:600;}
.upgrade-cost-col,.energy-item-cost{text-align:right;flex-shrink:0;}
.upgrade-cost-val,.energy-item-cost-val{font-size:13px;font-weight:600;color:var(--txt2);white-space:nowrap;}
.upgrade-cost-val.affordable,.energy-item-cost-val.affordable{color:var(--green-txt);}
.upgrade-cost-val.done{color:var(--green-txt);}
.upg-bar-wrap{height:3px;background:var(--bg3);border-radius:2px;margin-top:5px;width:56px;margin-left:auto;}
.upg-bar{height:100%;background:var(--green-bd);border-radius:2px;}
.prestige-card{background:var(--amber-bg);border:.5px solid var(--amber-bd);border-radius:var(--radius);padding:14px;margin-bottom:.75rem;}
.prestige-btn{background:var(--amber-txt);color:#fff;border:none;border-radius:var(--radius);
  padding:10px 20px;font-size:14px;font-weight:600;display:block;width:100%;margin-bottom:6px;}
.prestige-btn:active{opacity:.85;}
.prestige-info{font-size:12px;color:var(--amber-txt);line-height:1.4;}
.prestige-prog-wrap{height:5px;background:rgba(0,0,0,.12);border-radius:3px;margin-top:8px;overflow:hidden;}
.prestige-prog-bar{height:100%;background:var(--amber-txt);border-radius:3px;transition:width .2s;}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;}
.stat-card{background:var(--bg);border:.5px solid var(--border);border-radius:var(--radius);padding:14px;}
.stat-card.span-full{grid-column:1/-1;}
.stat-card-val{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;}
.stat-card-lbl{font-size:11px;color:var(--txt3);margin-top:4px;text-transform:uppercase;letter-spacing:.04em;}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
  background:var(--txt);color:var(--bg);padding:10px 20px;border-radius:99px;
  font-size:13px;font-weight:600;white-space:nowrap;pointer-events:none;
  opacity:0;transition:opacity .25s;z-index:999;}
.toast.show{opacity:1;}
.danger-btn{background:var(--red-bg);color:var(--red-txt);border:.5px solid var(--red-bd);
  border-radius:var(--radius);padding:9px 18px;font-size:13px;}
/* ACHIEVEMENTS */
.ach-grid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:.75rem;}
.ach-card{background:var(--bg);border:.5px solid var(--border);border-radius:var(--radius);
  padding:11px 12px;position:relative;transition:border-color .2s,background .2s;}
.ach-card.earned{border-color:var(--amber-bd);background:var(--amber-bg);}
.ach-card.locked{opacity:.45;}
.ach-icon{font-size:20px;margin-bottom:3px;}
.ach-name{font-size:12px;font-weight:700;line-height:1.2;margin-bottom:2px;}
.ach-desc{font-size:10px;color:var(--txt2);line-height:1.3;}
.ach-reward{font-size:10px;font-weight:600;margin-top:5px;color:var(--green-txt);}
.ach-check{position:absolute;top:7px;right:8px;font-size:13px;}
.ach-prog{font-size:10px;color:var(--txt3);margin-top:3px;font-weight:500;}
/* SPECIALISATION */
.spec-banner{display:flex;align-items:center;gap:12px;border-radius:var(--radius-lg);
  padding:14px 16px;margin-bottom:.75rem;border:1.5px solid;}
.spec-banner-icon{font-size:36px;flex-shrink:0;}
.spec-banner-body{flex:1;}
.spec-banner-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;opacity:.7;margin-bottom:2px;}
.spec-banner-name{font-size:18px;font-weight:800;line-height:1.1;}
.spec-banner-desc{font-size:12px;opacity:.8;margin-top:3px;}
.spec-passives{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;}
.spec-passive-pill{font-size:10px;font-weight:600;padding:3px 8px;border-radius:99px;background:rgba(0,0,0,.1);}
.spec-choice-grid{display:grid;grid-template-columns:1fr;gap:.6rem;margin-bottom:.75rem;}
.spec-choice-card{background:var(--bg);border:.5px solid var(--border);border-radius:var(--radius);
  padding:13px 14px;transition:border-color .15s,opacity .2s;}
.spec-choice-card.unlocked{border-color:var(--border2);cursor:default;}
.spec-choice-card.locked-spec{opacity:.5;}
.spec-choice-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.spec-choice-icon{font-size:26px;flex-shrink:0;}
.spec-choice-info{flex:1;}
.spec-choice-name{font-size:15px;font-weight:700;}
.spec-choice-desc{font-size:11px;color:var(--txt2);margin-top:2px;}
.spec-req{font-size:10px;font-weight:600;margin-top:6px;}
.spec-req-met{color:var(--green-txt);}
.spec-req-unmet{color:var(--txt3);}
.spec-btn{font-size:12px;font-weight:700;padding:8px 16px;border:none;border-radius:var(--radius);cursor:pointer;margin-top:8px;width:100%;}
.spec-btn-active{background:var(--green-txt);color:#fff;}
.spec-btn-unlock{background:var(--blue-bg);color:var(--blue-txt);border:.5px solid var(--blue-bd);}
.spec-btn-locked{background:var(--bg3);color:var(--txt3);cursor:default;}
/* KIT COLORS */
.color-picker-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 0 4px;}
.color-swatch{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;
  transition:transform .15s,border-color .15s;flex-shrink:0;}
.color-swatch.active{border-color:var(--txt);transform:scale(1.15);}
.color-swatch.locked-color{opacity:.3;cursor:default;}
.kit-color-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-left:4px;vertical-align:middle;}
/* GROWTH TAB — DAILY TASKS */
.growth-summary{display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--bg);border:.5px solid var(--border);border-radius:var(--radius-lg);
  padding:14px 16px;margin-bottom:.75rem;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.growth-summary-label{font-size:14px;font-weight:700;}
.growth-summary-sub{font-size:11px;color:var(--txt3);margin-top:2px;}
.claim-all-btn{background:var(--green-txt);color:#fff;border:none;border-radius:var(--radius);
  padding:9px 16px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.claim-all-btn:disabled{background:var(--bg3);color:var(--txt3);cursor:default;}
.task-card{display:flex;align-items:center;gap:12px;padding:13px 14px;border:.5px solid var(--border);
  border-radius:var(--radius);background:var(--bg);margin-bottom:8px;transition:border-color .2s,background .2s,opacity .2s;}
.task-card.done-unclaimed{border-color:var(--amber-bd);background:var(--amber-bg);}
.task-card.claimed{opacity:.5;}
.task-icon{font-size:24px;flex-shrink:0;width:34px;text-align:center;}
.task-info{flex:1;min-width:0;}
.task-name{font-size:14px;font-weight:600;}
.task-desc{font-size:11px;color:var(--txt2);margin-top:2px;}
.task-reward{font-size:11px;color:var(--green-txt);margin-top:3px;font-weight:600;}
.task-status{flex-shrink:0;}
.task-check{font-size:20px;}
.task-claim-btn{font-size:12px;font-weight:700;padding:7px 14px;border-radius:var(--radius);
  border:none;cursor:pointer;background:var(--amber-txt);color:#fff;white-space:nowrap;}
.lifetime-placeholder{text-align:center;padding:2.5rem 1rem;color:var(--txt3);font-size:13px;line-height:1.5;}
.lifetime-placeholder-icon{font-size:40px;margin-bottom:.5rem;}
/* SPONSORSHIP TAB — reuses spec-banner / spec-choice-card / lifetime-placeholder / cat-bar / task-card / growth-summary patterns */
.alert-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--amber-bg);border:.5px solid var(--amber-bd);border-radius:var(--radius);
  padding:10px 14px;margin-bottom:.75rem;}
.alert-banner-text{font-size:12px;font-weight:600;color:var(--amber-txt);}
.sponsor-obj-preview{font-size:11px;color:var(--txt2);padding:3px 0;border-bottom:.5px solid var(--border);}
.sponsor-obj-preview:last-child{border-bottom:none;}
.sponsor-bonus-preview{font-size:11px;color:var(--txt2);margin:7px 0 9px;font-weight:600;}
.sponsor-week-remaining{text-align:right;font-size:11px;color:var(--txt3);margin-bottom:.5rem;}
/* WEATHER SYSTEM */
.wx-banner{border:.5px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:.5rem;}
.wx-banner-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px;}
.wx-icon{font-size:26px;flex-shrink:0;line-height:1;}
.wx-name{font-size:14px;font-weight:700;line-height:1.2;}
.wx-desc{font-size:11px;color:var(--txt2);margin-top:2px;}
.wx-badges-row{display:flex;gap:5px;flex-wrap:wrap;}
.wx-badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:99px;border:.5px solid var(--border);background:var(--bg3);color:var(--txt2);}
.wx-neutral{color:var(--txt3);background:var(--bg2);}
.wx-energy-note{font-size:10px;color:var(--amber-txt);margin-top:7px;font-weight:600;}
/* INTERACTIVE RACE EVENTS */
.race-legs-row{display:flex;align-items:center;gap:8px;margin-top:.5rem;}
.race-legs-label{font-size:11px;font-weight:700;color:var(--txt2);white-space:nowrap;}
.race-legs-track{flex:1;height:8px;background:var(--bg3);border-radius:4px;overflow:hidden;}
.race-legs-fill{height:100%;border-radius:4px;transition:width .3s;}
.race-legs-val{font-size:11px;font-weight:700;width:30px;text-align:right;flex-shrink:0;}
.race-stage-row{display:flex;align-items:center;gap:0;position:relative;margin-bottom:2px;}
.race-stage-pip{position:absolute;top:50%;transform:translate(-50%,-50%);
  width:10px;height:10px;border-radius:50%;border:2px solid var(--bg);
  z-index:2;pointer-events:none;}
.decision-card{background:var(--bg);border:1.5px solid var(--amber-bd);border-radius:var(--radius-lg);
  padding:14px;margin-top:.6rem;animation:decision-pulse .8s ease-in-out infinite alternate;}
@keyframes decision-pulse{from{border-color:var(--amber-bd)}to{border-color:var(--amber-txt)}}
.decision-headline{font-size:14px;font-weight:800;color:var(--amber-txt);margin-bottom:3px;}
.decision-situation{font-size:12px;color:var(--txt2);line-height:1.4;margin-bottom:10px;}
.decision-choices{display:flex;flex-direction:column;gap:7px;}
.decision-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);
  border-radius:var(--radius);background:var(--bg2);cursor:pointer;text-align:left;
  transition:border-color .15s,background .15s;}
.decision-btn:active{background:var(--bg3);}
.decision-btn-label{font-size:13px;font-weight:700;flex:1;}
.decision-btn-detail{font-size:10px;color:var(--txt3);margin-top:2px;line-height:1.3;}
.decision-btn-cost{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex-shrink:0;}
.decision-btn-legs{font-size:10px;font-weight:700;white-space:nowrap;}
.decision-timer{display:flex;align-items:center;gap:6px;margin-top:8px;}
.decision-timer-bar{flex:1;height:4px;background:var(--bg3);border-radius:2px;overflow:hidden;}
.decision-timer-fill{height:100%;background:var(--amber-txt);border-radius:2px;transition:width .5s linear;}
.decision-timer-text{font-size:10px;color:var(--txt3);white-space:nowrap;}
.decision-result{background:var(--bg);border:.5px solid var(--border);border-radius:var(--radius);
  padding:10px 12px;margin-top:.6rem;font-size:12px;line-height:1.5;}
/* CALENDAR TAB — Major Events */
.cal-season-header{display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--bg);border:.5px solid var(--border);border-radius:var(--radius-lg);
  padding:14px 16px;margin-bottom:.75rem;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.cal-season-title{font-size:14px;font-weight:700;}
.cal-season-sub{font-size:11px;color:var(--txt3);margin-top:2px;}
.cal-slots-badge{font-size:13px;font-weight:700;padding:6px 12px;border-radius:99px;
  background:var(--purple-bg);color:var(--purple-txt);border:.5px solid var(--purple-bd);white-space:nowrap;}
.cal-event-card{padding:13px 14px;border:.5px solid var(--border);border-radius:var(--radius);
  background:var(--bg);margin-bottom:8px;}
.cal-event-head{display:flex;align-items:center;gap:10px;}
.cal-event-icon{font-size:26px;flex-shrink:0;width:36px;text-align:center;}
.cal-event-info{flex:1;min-width:0;}
.cal-event-name{font-size:14px;font-weight:700;}
.cal-event-desc{font-size:11px;color:var(--txt2);margin-top:2px;line-height:1.4;}
.cal-event-tierbadge{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;
  padding:2px 7px;border-radius:99px;margin-left:6px;vertical-align:middle;}
.cal-event-meta{display:flex;gap:14px;margin-top:9px;flex-wrap:wrap;}
.cal-event-meta-item{font-size:11px;color:var(--txt2);}
.cal-event-meta-val{font-weight:700;color:var(--txt);}
.cal-event-prizes{font-size:10px;color:var(--txt3);margin-top:6px;}
.cal-signup-btn{width:100%;margin-top:10px;padding:9px;border-radius:var(--radius);border:none;
  font-size:12px;font-weight:700;cursor:pointer;background:var(--purple-bg);color:var(--purple-txt);
  border:.5px solid var(--purple-bd);}
.cal-signup-btn:disabled{background:var(--bg3);color:var(--txt3);border-color:var(--border);cursor:default;}
/* Two-tap confirm state — amber pulse replaces native confirm() dialog */
.cal-signup-confirm{background:var(--amber-txt)!important;color:#fff!important;
  border-color:transparent!important;animation:cal-confirm-pulse .55s ease-in-out infinite alternate;}
@keyframes cal-confirm-pulse{from{opacity:.82}to{opacity:1}}
.cal-start-btn{width:100%;margin-top:10px;padding:9px;border-radius:var(--radius);border:none;
  font-size:12px;font-weight:700;cursor:pointer;background:var(--green-txt);color:#fff;}
.cal-result-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:.5px solid var(--border);
  border-radius:var(--radius);background:var(--bg);margin-bottom:6px;}
.cal-result-pos{font-size:16px;font-weight:800;width:30px;text-align:center;flex-shrink:0;}
/* ── Session collect-reward card (used by training collect + morning streak collect) ── */
@keyframes collect-pulse{
  0%  {box-shadow:0 0 0 0   rgba(59,109,17,.55)}
  70% {box-shadow:0 0 0 14px rgba(59,109,17,0)}
  100%{box-shadow:0 0 0 0   rgba(59,109,17,0)}
}
.collect-ready{animation:collect-pulse 1.4s ease-out infinite;border-radius:var(--radius-lg)!important;}
.collect-ready:active{transform:scale(.97);transition:transform .1s;}
/* ── Critical Session: rare gold variant of the collect card ── */
@keyframes critical-glow{
  0%  {box-shadow:0 0 0 0 var(--amber-bd), inset 0 0 0 0 var(--amber-bd)}
  50% {box-shadow:0 0 0 12px transparent, inset 0 0 26px 2px var(--amber-bd)}
  100%{box-shadow:0 0 0 20px transparent, inset 0 0 0 0 var(--amber-bd)}
}
@keyframes critical-shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.collect-critical{
  border-radius:var(--radius-lg)!important;
  background:linear-gradient(120deg,var(--amber-bg) 30%,var(--gold) 50%,var(--amber-bg) 70%)!important;
  background-size:300% 100%;
  animation:critical-glow 1s ease-in-out infinite, critical-shimmer 2.2s linear infinite!important;
  border:2px solid var(--gold)!important;
}
.collect-critical:active{transform:scale(.97);transition:transform .1s;}
@keyframes critical-badge-spin{0%{transform:rotate(-8deg) scale(1)}50%{transform:rotate(8deg) scale(1.12)}100%{transform:rotate(-8deg) scale(1)}}
.critical-badge{display:inline-block;animation:critical-badge-spin .9s ease-in-out infinite;}

/* ── Win / Promotion full-screen ceremony ── */
.ceremony-overlay{
  position:fixed;inset:0;z-index:2000;
  background:rgba(0,0,0,.72);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:1.25rem;
  animation:ceremony-fade-in .25s ease-out;overflow:hidden;
}
@keyframes ceremony-fade-in{from{opacity:0}to{opacity:1}}
.ceremony-card{
  position:relative;z-index:2;max-width:380px;width:100%;
  background:var(--bg);border-radius:20px;padding:2rem 1.5rem 1.75rem;
  text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4);
  animation:ceremony-card-in .45s cubic-bezier(.34,1.56,.64,1);
}
@keyframes ceremony-card-in{
  0%{transform:scale(.6) translateY(40px);opacity:0}
  100%{transform:scale(1) translateY(0);opacity:1}
}
.ceremony-eyebrow{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.14em;
  color:var(--gold);margin-bottom:6px;}
.ceremony-icon{font-size:56px;margin-bottom:8px;animation:ceremony-icon-bounce 1.1s ease-in-out infinite;}
@keyframes ceremony-icon-bounce{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.06)}}
.ceremony-title{font-size:26px;font-weight:800;color:var(--txt);margin-bottom:4px;line-height:1.15;}
.ceremony-subtitle{font-size:13px;color:var(--txt2);margin-bottom:18px;}
.ceremony-money{font-size:42px;font-weight:800;color:var(--green-txt);font-variant-numeric:tabular-nums;
  margin-bottom:4px;}
.ceremony-money-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  color:var(--txt3);margin-bottom:18px;}
.ceremony-cat-flow{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:18px;}
.ceremony-cat-old{font-size:28px;opacity:.4;filter:grayscale(1);}
.ceremony-cat-arrow{font-size:20px;color:var(--gold);font-weight:800;}
.ceremony-cat-new{font-size:44px;animation:ceremony-icon-bounce 1.1s ease-in-out infinite;}
.ceremony-btn{width:100%;padding:13px;border-radius:var(--radius-lg);border:none;cursor:pointer;
  background:var(--green-txt);color:#fff;font-size:14px;font-weight:700;letter-spacing:.02em;}
.ceremony-btn:active{opacity:.85;}
.ceremony-confetti{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden;}
.confetti-piece{position:absolute;top:-10%;width:9px;height:14px;opacity:.9;
  animation:confetti-fall linear forwards;}
@keyframes confetti-fall{
  0%  {transform:translateY(0) rotate(0deg);opacity:1;}
  90% {opacity:1;}
  100%{transform:translateY(115vh) rotate(540deg);opacity:0;}
}
</style>
</head>
<body>
<div id="app">
  <header class="game-header">
    <div class="game-title">🚴 <span class="accent">Cycling</span> Idle Manager</div>
    <div class="stat-row">
      <div class="stat-item"><div class="stat-val" id="hdr-money">£0</div><div class="stat-lbl">Prize Money</div></div>
      <div class="stat-item"><div class="stat-val" id="hdr-ftp">50</div><div class="stat-lbl">FTP (w)</div></div>
      <div class="stat-item"><div class="stat-val" id="hdr-energy">100/100</div><div class="stat-lbl">⚡ Energy</div><div class="stat-sublbl" id="hdr-energy-tmr">💤 tmr: 100</div></div>
      <div class="stat-item"><div class="stat-val" id="hdr-cat">Uncat</div><div class="stat-lbl">Category</div><div class="stat-sublbl" id="hdr-weather" style="color:var(--txt2)">☀️</div></div>
    </div>
  </header>

// ─── DAILY MARKET (price/offer/benefit fluctuation) ─────────
// Deterministic per-day randomness: same seed -> same numbers all day, new numbers
// the moment the calendar day changes, with no need to store every roll explicitly.
function hashStr(str){ let h=0; for(let i=0;i<str.length;i++){ h=(h<<5)-h+str.charCodeAt(i); h|=0; } return h; }
function mulberry32(seed){
  return function(){
    seed|=0; seed=seed+0x6D2B79F5|0;
    let t=Math.imul(seed^seed>>>15,1|seed);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
function getDayKey(){ return new Date().toDateString(); }

// ─── DAILY WEATHER ────────────────────────────────────────────
// Same seeded-RNG pattern as the energy market — deterministic for the whole day,
// fresh roll each morning. Weather affects race score multipliers and energy costs;
// the AI field is also affected equally so weather never unfairly changes the odds,
// it just shifts the terrain everyone is racing on.
const WEATHER_CONDITIONS = [
  {id:'sunny',   icon:'☀️',  name:'Sunny',    intensityDesc:['Warm and clear.','Hot and dry.','Scorching. Energy costs up.'],
   scoreEffect:{crit:0,road:0,tt:0,hill:0}, energyMult:1.0, fatigueBonus:0},

   scoreEffect:{crit:-0.05,road:-0.04,tt:0.04,hill:-0.08}, energyMult:1.08, fatigueBonus:3},
  {id:'rainy',   icon:'🌧️', name:'Rainy',    intensityDesc:['Light drizzle.','Wet roads. Crits are sketchy.','Heavy rain. Dangerous conditions.'],
   scoreEffect:{crit:-0.12,road:-0.06,tt:-0.04,hill:-0.05}, energyMult:1.12, fatigueBonus:5},
  {id:'cold',    icon:'🥶',  name:'Cold',     intensityDesc:['Cool but manageable.','Cold. Muscles struggle to warm up.','Freezing. Sprinters badly affected.'],
   scoreEffect:{crit:-0.08,road:-0.03,tt:-0.03,hill:0.02}, energyMult:1.05, fatigueBonus:2},
  {id:'hot',     icon:'🌡️', name:'Hot',      intensityDesc:['Warm. Stay hydrated.','Hot. Fatigue accumulates faster.','Extreme heat. Significant fatigue penalty.'],
   scoreEffect:{crit:-0.04,road:-0.08,tt:-0.08,hill:-0.10}, energyMult:1.15, fatigueBonus:8},
];
// Intensity: 0=mild (×0.5), 1=moderate (×1.0), 2=strong (×1.5)
const WEATHER_INTENSITY_LABELS = ['Mild','Moderate','Strong'];
const WEATHER_INTENSITY_MULTS  = [0.5, 1.0, 1.5];

function getDailyWeather(){
  const dayKey=getDayKey();
  const rng=mulberry32(hashStr(dayKey+'_weather'));
  const condIdx=Math.floor(rng()*WEATHER_CONDITIONS.length);
  const intensity=Math.floor(rng()*3); // 0=mild, 1=moderate, 2=strong
  return {condition:WEATHER_CONDITIONS[condIdx], intensity};
}

// Score multiplier for today's weather applied to a specific race type.
// Positive = advantage, negative = disadvantage. Both player AND AI are affected equally
// so it doesn't shift overall win probability — it just changes which race types
// are relatively more or less favourable today (a strategic layer).
function getWeatherScoreMult(raceTypeId){
  const {condition,intensity}=getDailyWeather();
  const base=condition.scoreEffect[raceTypeId]||0;
  return 1+base*WEATHER_INTENSITY_MULTS[intensity];
}

// Extra energy cost from heat/rain (weather that taxes the body more).
function getWeatherEnergyCost(baseCost){
  const {condition,intensity}=getDailyWeather();
  return Math.round(baseCost*( 1+(condition.energyMult-1)*WEATHER_INTENSITY_MULTS[intensity] ));
}

// Extra fatigue units added to energySpentToday after a race in tough weather.
function getWeatherFatigueBonus(){
  const {condition,intensity}=getDailyWeather();
  return Math.round((condition.fatigueBonus||0)*WEATHER_INTENSITY_MULTS[intensity]);
}

// ─── WEIGHT / POWER-TO-WEIGHT DYNAMIC ───────────────────────
// Real-world cycling performance on climbs is driven by watts-per-kilogram, not raw
// watts — a heavier rider with the same FTP climbs slower. WEIGHT_SENSITIVITY controls
// how much bodyweight matters per race type: flat/drafting races barely care, hill
// climbs care a great deal.
const DEFAULT_RIDER_WEIGHT       = 70;   // kg — see chat: a sensible "all-rounder" reference weight
const MIN_RIDER_WEIGHT           = 60;   // kg — climbing specialist floor
const MAX_RIDER_WEIGHT           = 90;   // kg — sprinter/heavy-build ceiling
const CARB_DAILY_LIMIT           = 80;   // energy-units worth of items consumed before excess risks weight gain
const WEIGHT_GAIN_PER_EXCESS_CARB= 0.005;// kg gained per unit of carbs consumed over the daily limit
const WEIGHT_SENSITIVITY = {
  crit: 0.0,  // flat, drafting-heavy circuit — bodyweight is basically irrelevant
  road: 0.3,  // rolling terrain — bodyweight matters a little
  tt:   0.1,  // mostly flat, aero-dominated — bodyweight barely matters
  hill: 1.0,  // pure climbing — bodyweight matters fully, watts-per-kg is everything
};

// ═══════════════════════════════════════════════════════════
// DERIVED STATS
// ═══════════════════════════════════════════════════════════
function getRiderStats(){
  const a=state.attributes;
  let ftp = Math.round(50+a.endurance.level*14+a.power.level*16+a.threshold.level*20);
  // Rouleur passive: all FTP contributions +10%
  if(state.specialisation==='rouleur') ftp = Math.round(ftp*1.10);
  return {
    ftp:         Math.min(MAX_FTP, ftp),
    vo2max:      Math.min(MAX_VO2,    Math.round(30+a.vo2.level*5.5)),
    sprintPower: Math.min(MAX_SPRINT, Math.round(300+a.sprint.level*170)),
  };
}

// The headline cycling performance metric: watts per kilogram of bodyweight.
function getPowerToWeight(){
  return getRiderStats().ftp / state.riderWeight;
}

// Records a snapshot only when FTP or W/kg has actually moved from the last stored
// value (±1w or ±0.05 W/kg), so the chart fills with meaningful data points rather
// than repeating rows during inactive stretches. Capped at 90 entries.
function recordFtpSnapshot(){
  const ftp=getRiderStats().ftp;
  const pwkg=parseFloat(getPowerToWeight().toFixed(2));
  const weight=parseFloat(state.riderWeight.toFixed(1));
  const last=state.ftpHistory[state.ftpHistory.length-1];
  if(last && Math.abs(last.ftp-ftp)<1 && Math.abs(last.pwkg-pwkg)<0.05) return;
  state.ftpHistory.push({ts:Date.now(), ftp, pwkg, weight});
  if(state.ftpHistory.length>90) state.ftpHistory.shift();
}

// How much today's bodyweight helps or hurts a given race type, relative to the
// DEFAULT_RIDER_WEIGHT baseline. >1 = lighter-than-default advantage, <1 = heavier penalty.
// Blended by WEIGHT_SENSITIVITY so flat/drafting races barely notice, climbs notice fully.
function getWeightFactorForRace(raceTypeId){
  const sensitivity=WEIGHT_SENSITIVITY[raceTypeId]??0;
  if(sensitivity<=0) return 1;
  const rawFactor=DEFAULT_RIDER_WEIGHT/state.riderWeight;
  return 1+(rawFactor-1)*sensitivity;
}

function getEquipmentBonusForRace(raceTypeId){
  const bike  = BIKES.find(b=>b.id===state.equippedBike)   || BIKES[0];
  const wheel = WHEELS.find(w=>w.id===state.equippedWheels) || WHEELS[0];
  const kit   = KITS.find(k=>k.id===state.equippedKit)     || KITS[0];
  const w = EQUIP_WEIGHTS[raceTypeId] || {aero:0.5,climb:0.5};
  const totalAero  = bike.aeroWatts  + wheel.aeroWatts  + kit.aeroWatts;
  const totalClimb = bike.climbWatts + wheel.climbWatts;
  let bonus = Math.round(totalAero * w.aero + totalClimb * w.climb);
  // Climber passive: +10w on hill climbs from better weight-distribution intuition
  if(state.specialisation==='climber' && raceTypeId==='hill') bonus += 10;
  return bonus;
}

function recalc(){
  let sp=0;
  for (const id of state.boughtUpgrades){
    const u=ACCESSORIES.find(u=>u.id===id); if(!u) continue;
    sp += (u.sponsorPerSec||0);
  }
  // Passive sponsor income comes exclusively from accessories purchased in the Gear shop.
  // Achievement rewards are one-time prize money bonuses, not passive income.
  D.sponsorPerSec = sp * state.prestigeMult;
  D.sessionMult   = 1 + state.attributes.threshold.level * 0.08;
}

// ═══════════════════════════════════════════════════════════
// XP
// ═══════════════════════════════════════════════════════════
function addXP(attrId, amount){
  const attr=state.attributes[attrId], def=ATTR_DEFS[attrId]; if(!attr||!def) return;
  const ftpBefore=getRiderStats().ftp;
  attr.xp += amount;
  let needed=xpForLevel(attr.level), leveled=false, maxLv=0;
  while(attr.xp>=needed){ attr.xp-=needed; attr.level++; leveled=true; maxLv=attr.level; recalc(); needed=xpForLevel(attr.level); }
  if(leveled){
    const ftpAfter=getRiderStats().ftp;
    const ftpStr=(['endurance','power','threshold'].includes(attrId)&&ftpAfter>ftpBefore)?` · FTP ${ftpBefore}→${ftpAfter}w`:'';
    showToast(`${def.icon} ${def.name} Level ${maxLv}!${ftpStr}`);
    recordFtpSnapshot();
    // FTP milestones and all-attrs achievement checked on level-up
    checkAchievements();
  }
}

// How much energy you'll wake up with tomorrow based on today's training load
function getTomorrowEnergy(){
  const fatigue = Math.round((state.energySpentToday||0) * FATIGUE_RATE);
  return Math.max(MIN_ENERGY_START, state.maxEnergy - fatigue);
}

// Returns the streak-milestone bonus reward for a given day count.
// xpBonus: array of {attr, amount} processed in collectMorningReward().
function getStreakReward(day){
  if(day>=30) return {type:'cash',  value:5000, icon:'🏆', label:'£5,000 prize bonus!'};
  if(day>=14) return {type:'cash',  value:2000, icon:'💎', label:'£2,000 prize bonus!'};
  if(day>=7)  return {type:'cash',  value:500,  icon:'⭐', label:'£500 + XP all attributes',
    xpBonus:[{attr:'endurance',amount:20},{attr:'power',amount:20},{attr:'vo2',amount:20},{attr:'sprint',amount:20},{attr:'threshold',amount:20}]};
  if(day===6) return {type:'xp', icon:'💪', label:'+20 XP — all attributes',
    xpBonus:[{attr:'endurance',amount:20},{attr:'power',amount:20},{attr:'vo2',amount:20},{attr:'sprint',amount:20},{attr:'threshold',amount:20}]};
  if(day===5) return {type:'xp', icon:'⚡', label:'+30 Sprint XP',
    xpBonus:[{attr:'sprint',amount:30}]};
  if(day===4) return {type:'xp', icon:'🔥', label:'+30 VO₂ Max XP',
    xpBonus:[{attr:'vo2',amount:30}]};
  if(day===3) return {type:'item', value:'shake', icon:'🥤', label:'Free Shake + 25 Threshold XP',
    xpBonus:[{attr:'threshold',amount:25}]};
  if(day===2) return {type:'xp', icon:'💪', label:'+30 Power XP',
    xpBonus:[{attr:'power',amount:30}]};
  if(day===1) return {type:'xp', icon:'🫀', label:'+30 Endurance XP',
    xpBonus:[{attr:'endurance',amount:30}]};
  return       {type:'none', value:0, icon:'⚡', label:'Energy restored'};
}

// Returns the next streak milestone the player hasn't reached yet, or null at max.
function getNextStreakMilestone(streak){
  const milestones=[{day:3,icon:'🥤'},{day:7,icon:'⭐'},{day:14,icon:'💎'},{day:30,icon:'🏆'}];
  return milestones.find(m=>m.day>streak)||null;
}

function checkDailyReset(){
  const now=new Date(), last=new Date(state.lastEnergyReset||0);
  if(now.toDateString()!==last.toDateString()){
    const nextEnergy = getTomorrowEnergy();
    // ── LOGIN STREAK: track consecutive calendar days ──────────
    const todayStr = now.toDateString();
    const yesterday = new Date(now); yesterday.setDate(yesterday.getDate()-1);
    const yesterdayStr = yesterday.toDateString();
    if(!state.lastLoginDate){
      state.loginStreak = 1;                           // first ever login
    } else if(state.lastLoginDate === yesterdayStr){
      state.loginStreak = (state.loginStreak||0) + 1;  // consecutive day — extend streak
    } else if(state.lastLoginDate !== todayStr){
      state.loginStreak = 1;                           // missed a day — streak broken
    }
    state.lastLoginDate = todayStr;
    // ── WITHHOLD ENERGY: restore only when player taps collect ─
    // Energy resets to 0 at the day boundary — yesterday's leftover doesn't carry
    // over. todayEnergyAllocation is the fatigue-adjusted ceiling for ALL regen
    // sources today (idle tick, offline catch-up, visibilitychange) so the fatigue
    // penalty can no longer be erased by leaving the app open/closed overnight.
    state.energy = 0;
    state.todayEnergyAllocation = nextEnergy;
    state.energySpentToday = 0;     // reset daily spend counter
    state.lastEnergyReset = Date.now();
    // Reset daily tasks alongside energy — same calendar-day boundary
    DAILY_TASKS.forEach(t=>{ state.dailyTasks.progress[t.id]=false; state.dailyTasks.claimed[t.id]=false; });
    state.dailyTasks.resetDate=Date.now();
    // Roll fresh prices/offers/benefits for the energy market
    ensureDailyMarket();
    // Weight dynamic: yesterday's excess carbs (if any) convert to weight gain now,
    // before today's counter resets to zero.
    let weightGainMsg=null;
    if(state.carbsToday>CARB_DAILY_LIMIT){
      const excess=state.carbsToday-CARB_DAILY_LIMIT;
      const gain=Math.round(excess*WEIGHT_GAIN_PER_EXCESS_CARB*100)/100;
      const before=state.riderWeight;
      state.riderWeight=Math.min(MAX_RIDER_WEIGHT, state.riderWeight+gain);
      if(state.riderWeight>before) weightGainMsg=`⚠️ Overate yesterday — gained ${(state.riderWeight-before).toFixed(2)}kg (now ${state.riderWeight.toFixed(1)}kg)`;
    }
    state.carbsToday=0;
    state.carbWarningShownToday=false;
    // Record today's FTP/W/kg snapshot before saving — weight may have just changed
    recordFtpSnapshot();
    // Set pending morning reward — energy withheld until player taps
    state.pendingMorningReward={
      energy:   nextEnergy,
      streak:   state.loginStreak,
      reward:   getStreakReward(state.loginStreak),
      weightGainMsg,
    };
    saveGame();
    updateUI();
    updateGrowthBadge();
  }
  // Sponsor weekly window is a rolling 7 days, independent of the calendar-day boundary
  // above, so this check runs unconditionally every time this function ticks.
  checkSponsorWeeklyReset();
  // Perishing is also independent of the calendar-day boundary — an item bought
  // mid-afternoon spoils exactly 7 days later, mid-afternoon, not at midnight.
  expirePerishedItems();
  // Calendar season is a rolling 30-day window, also independent of the calendar-day
  // boundary above — checked every tick once activated.
  checkCalendarSeasonReset();
}

// Called when the player taps the morning collect card.
// Grants the withheld energy + any streak milestone reward.
function collectMorningReward(){
  const pmr=state.pendingMorningReward; if(!pmr) return;
  // Set energy to exactly today's fatigue-adjusted allocation. state.energy was
  // already zeroed at the daily reset boundary, but we assign rather than add here
  // as a safety net in case any idle regen ticked between reset and this tap.
  state.energy=pmr.energy;
  state.pendingMorningReward=null;
  // Apply streak milestone reward
  const r=pmr.reward||{type:'none'};
  let rewardMsg='';
  if(r.type==='cash'){
    earnMoney(r.value);
    rewardMsg=` + ${r.icon} ${r.label}`;
  } else if(r.type==='item'){
    // Add a free recovery shake to the player's energy inventory
    const baseItem=ENERGY_ITEMS.find(i=>i.id==='shake');
    if(baseItem){
      state.energyInventory=state.energyInventory||[];
      state.energyInventory.push({
        id:'streak_shake_'+Date.now(),
        itemType:'shake',
        energy: baseItem.energy,
        fatigueRecovery: baseItem.fatigueRecovery||0,
        purchasedAt: Date.now(),
      });
      rewardMsg=` + 🥤 Free Shake in inventory!`;
    }
  }
  // XP bonus — present on days 1–7 and the Day 7 cash milestone
  if(r.xpBonus && r.xpBonus.length){
    r.xpBonus.forEach(({attr,amount})=>addXP(attr,amount));
    const allSame=r.xpBonus.length===5 && new Set(r.xpBonus.map(x=>x.amount)).size===1;
    const xpStr=allSame
      ? `+${r.xpBonus[0].amount} XP all attributes`
      : r.xpBonus.map(({attr,amount})=>`+${amount} ${ATTR_DEFS[attr]?.name||attr}`).join(' · ');
    rewardMsg+=(rewardMsg?' · ':' · ')+xpStr;
  }
  // Show weight gain warning (from overnight carb conversion) after a short delay
  if(pmr.weightGainMsg) setTimeout(()=>showToast(pmr.weightGainMsg),2800);
  saveGame();
  showToast(`🌅 Day ${pmr.streak} streak! ⚡ ${pmr.energy} energy restored${rewardMsg}`);
  renderTrainTab();
}

// ═══════════════════════════════════════════════════════════
// TRAINING
// ═══════════════════════════════════════════════════════════
function startSession(id){
  if(state.session.active||state.raceActive) return;
  const t=TRAINING.find(t=>t.id===id); if(!t) return;
  if(state.trainCooldowns[id]&&Date.now()<state.trainCooldowns[id]) return;
  if(t.unlock&&state.attributes[t.unlock.attr].level<t.unlock.level) return;
  if(state.energy<t.energyCost){ showToast(`⚡ Need ${t.energyCost} energy`); return; }
  state.energy=Math.max(0,state.energy-t.energyCost);
  state.energySpentToday=(state.energySpentToday||0)+t.energyCost;
  state.session={active:true,typeId:id,startTime:Date.now(),duration:t.duration*1000};
  // FIX 5a: Save immediately so energy deduction persists if page closes mid-session
  saveGame(); updateActivityDots(); renderTrainTab();
}

function completeSession(){
  const t=TRAINING.find(t=>t.id===state.session.typeId); if(!t) return;
  // Build session multiplier: threshold base × any specialisation bonus
  let sessMult = D.sessionMult;
  if(state.specialisation==='climber' && (t.id==='z2'||t.id==='z5')) sessMult*=1.25;
  else if(state.specialisation==='sprinter' && t.id==='z6') sessMult*=1.30;
  else if(state.specialisation==='rouleur') sessMult*=1.15;
  for(const [attr,base] of Object.entries(t.xpGains)) addXP(attr,Math.round(base*sessMult));
  if(t.cooldown>0) state.trainCooldowns[t.id]=Date.now()+t.cooldown*1000;
  state.session={active:false};
  markTaskProgress('train_session');
  incrementSponsorProgress('sessions',1);
  // Fat-burning sessions (currently only Z1) nudge bodyweight down, clamped to the floor
  let weightMsg='';
  if(t.weightEffect){
    const before=state.riderWeight;
    state.riderWeight=Math.max(MIN_RIDER_WEIGHT,Math.min(MAX_RIDER_WEIGHT,state.riderWeight+t.weightEffect));
    if(state.riderWeight!==before){ weightMsg=` · ⚖️ ${state.riderWeight.toFixed(1)}kg`; recordFtpSnapshot(); }
  }
  updateActivityDots(); recalc(); saveGame(); showToast(`✅ ${t.name} complete!${weightMsg}`);
}

function collectSessionReward(){
  if(!state.session.active||!state.session.awaitingCollection) return;
  const t=TRAINING.find(t=>t.id===state.session.typeId);
  const wasCritical=!!state.session.isCritical; // read before session state is cleared below
  // Award all pre-calculated XP
  for(const {attr,amount} of (state.session.pendingXP||[])) addXP(attr,amount);
  if(t&&t.cooldown>0) state.trainCooldowns[t.id]=Date.now()+t.cooldown*1000;
  markTaskProgress('train_session');
  incrementSponsorProgress('sessions',1);
  // Weight effect (e.g. Z1 fat-burn)
  let weightMsg='';
  if(t&&t.weightEffect){
    const before=state.riderWeight;
    state.riderWeight=Math.max(MIN_RIDER_WEIGHT,Math.min(MAX_RIDER_WEIGHT,state.riderWeight+t.weightEffect));
    if(state.riderWeight!==before){ weightMsg=` · ⚖️ ${state.riderWeight.toFixed(1)}kg`; recordFtpSnapshot(); }
  }
  state.session={active:false};
  updateActivityDots(); recalc(); saveGame();
  showToast(wasCritical
    ? `🌟 CRITICAL! ${t?t.name:'Session'} banked at 2× XP!${weightMsg}`
    : `✅ ${t?t.name:'Session'} banked!${weightMsg}`);
  renderTrainTab();
}

// ═══════════════════════════════════════════════════════════
// RACE
// ═══════════════════════════════════════════════════════════
// ─── INTERACTIVE RACE ENGINE ─────────────────────────────────
// Returns the race clock time that actually counts toward animMs —
// raw wall-clock elapsed minus any time spent showing decision cards.
// If a decision is currently pending, its duration is excluded too,
// so completeRace() can never fire while the card is visible.
function getEffectiveElapsed(rd, now){
  let paused = rd.totalPausedMs || 0;
  if(rd.pendingDecision) paused += now - rd.pendingDecision.startedAt;
  return Math.max(0, (now - rd.startTime) - paused);
}

// Builds the list of decision-point stages for a given race type.
// Each stage has a triggerPct (0-1) and fires once as the race progress bar passes it.
function buildRaceStages(raceTypeId){
  const events = RACE_EVENTS[raceTypeId] || [];
  return events.map(ev=>({ triggerPct:ev.triggerPct, event:ev, fired:false }));
}

// Called when the player taps a choice button in the decision card.
// Race Legs are reduced immediately; positionDelta accumulates.
// Phase 1 — called immediately when player taps a choice button.
// Just records which choice was made and the timestamp; gameTick handles resolution
// after the 1-second highlight delay. The race clock stays paused throughout.
function makeRaceDecision(choiceId){
  const rd=state.raceData; if(!rd||!rd.pendingDecision) return;
  if(rd.pendingDecision.selectedChoiceId) return; // already tapped, ignore double-tap
  const event=rd.pendingDecision.event;
  const choice=event.choices.find(c=>c.id===choiceId); if(!choice) return;
  // Mark the selection — gameTick will call resolveRaceDecision after 1 second
  rd.pendingDecision.selectedChoiceId=choiceId;
  rd.pendingDecision.selectedAt=Date.now();
  // Re-render immediately so the highlight shows before the delay
  if(currentTab==='race') renderActiveRaceBlock();
}

// Phase 2 — called by gameTick 1 second after the player taps.
// Applies legs cost, position delta, builds the result card, and resumes the clock.
function resolveRaceDecision(){
  const rd=state.raceData; if(!rd||!rd.pendingDecision) return;
  const {event, selectedChoiceId}=rd.pendingDecision;
  const choice=event.choices.find(c=>c.id===selectedChoiceId); if(!choice) return;
  const legs=rd.raceLegs;
  const spec=state.specialisation;
  rd.raceLegs=Math.max(0, legs-choice.raceLegsConst);
  const delta=choice.deltaFn?choice.deltaFn(legs,spec):0;
  rd.positionDelta=(rd.positionDelta||0)+delta;
  const legsLeft=rd.raceLegs;
  const legsCol=legsLeft>60?'var(--green-txt)':legsLeft>30?'var(--amber-txt)':'var(--red-txt)';
  const deltaStr=delta<0
    ?`<span style="color:var(--green-txt)">📈 +${Math.abs(delta)} position${Math.abs(delta)!==1?'s':''} gained</span>`
    :delta>0
      ?`<span style="color:var(--red-txt)">📉 ${delta} position${delta!==1?'s':''} lost</span>`
      :`<span style="color:var(--txt3)">↔️ No position change</span>`;
  rd.lastDecisionResult={label:choice.label,deltaStr,legsLeft,legsCol,autoSelected:!!rd.pendingDecision?.wasAutoSelected};
  // Accumulate full decision time (from card shown to resolution) into totalPausedMs
  rd.totalPausedMs=(rd.totalPausedMs||0)+(Date.now()-rd.pendingDecision.startedAt);
  rd.pendingDecision=null;
  saveGame();
  if(currentTab==='race') renderActiveRaceBlock();
}

// Assigns the rival's name once (career start) and recalibrates their FTP to
// 10–15% above the player's CURRENT FTP whenever the category index has changed
// since the last calibration — covers normal promotion, and also prestige resets
// since those drop raceCategory back to 0 (and the player's FTP resets alongside it,
// so the rival correctly recalibrates down to match the fresh season rather than
// staying at an old, now-unbeatable number).
function recalibrateRivalIfNeeded(){
  if(!state.rival.name){
    state.rival.name = RIVAL_NAMES[Math.floor(Math.random()*RIVAL_NAMES.length)];
  }
  if(state.rival.categoryIndexAtAssignment !== state.raceCategory){
    const playerFtp = getRiderStats().ftp;
    const multiplier = 1.10 + Math.random()*0.05; // 10–15% stronger, randomised within the range
    state.rival.ftp = Math.max(1, Math.round(playerFtp * multiplier));
    state.rival.categoryIndexAtAssignment = state.raceCategory;
  }
}

function simulateRaceResult(raceTypeId){
  const rt=RACE_TYPES.find(r=>r.id===raceTypeId);
  const cat=RACE_CATEGORIES[state.raceCategory];
  const rs=getRiderStats();
  const normVO2   =Math.max(0,(rs.vo2max    -30)/55  *100);
  // Sprinter passive: sprint power effectively +20% for score calculation
  const sprintPowerEff = state.specialisation==='sprinter' ? rs.sprintPower*1.20 : rs.sprintPower;
  const normSprint=Math.max(0,(sprintPowerEff-300)/1700*100);
  const playerBase=rt.weights.ftp*rs.ftp+rt.weights.vo2*normVO2+rt.weights.sprint*normSprint;
  const vo2Mult   =1+state.attributes.vo2.level*0.04;
  const sprintMult=rt.id==='crit'?(1+state.attributes.sprint.level*0.10):1;
  const equipBonus=getEquipmentBonusForRace(raceTypeId);
  const variance  =Math.max(10,playerBase*0.12);
  let playerScore =playerBase*vo2Mult*sprintMult+equipBonus+(Math.random()-0.5)*variance*2;
  // Apply specialisation race multipliers
  if(state.specialisation==='climber'){
    if(raceTypeId==='hill') playerScore*=1.5;
    else if(raceTypeId==='road') playerScore*=1.1;
  } else if(state.specialisation==='sprinter'){
    if(raceTypeId==='crit') playerScore*=1.5;
    else if(raceTypeId==='road') playerScore*=1.1;
  } else if(state.specialisation==='rouleur'){
    if(raceTypeId==='tt') playerScore*=1.35;
    else playerScore*=1.2;
  }
  // Power-to-weight dynamic: bodyweight away from the 70kg default helps or hurts
  // depending on race type — hill climbs feel it fully, flat crits barely at all.
  const weightFactor=getWeightFactorForRace(raceTypeId);
  playerScore*=weightFactor;
  // Weather applies equally to player and AI — it shifts which race types are
  // favourable today, not raw win probability. Applied AFTER weight so both modifiers
  // are transparent in the race card badges.
  const weatherMult=getWeatherScoreMult(raceTypeId);
  playerScore*=weatherMult;
  recalibrateRivalIfNeeded();
  const fieldSize =Math.floor(Math.random()*(cat.fieldMax-cat.fieldMin+1))+cat.fieldMin;
  // Build the AI field. Slot 0 is always the named rival — a fixed FTP basis
  // (recalibrated only at category changes, see recalibrateRivalIfNeeded) instead
  // of a freshly randomised one each race, so "beating Hendricks" tracks a real,
  // consistent opponent rather than an anonymous face from the crowd. Everyone
  // still gets the same per-race performance variance so the rival isn't a
  // static checkpoint — they have good days and bad days like anyone else.
  const aiScores=[];
  let rivalScore=0;
  for(let i=0;i<fieldSize-1;i++){
    const isRival = (i===0);
    const aiFTP = isRival ? state.rival.ftp : (cat.ftpMin+Math.random()*(cat.ftpMax-cat.ftpMin));
    const aiVO2=30+(aiFTP-50)/500*55, aiSprint=300+(aiFTP-50)/500*1700;
    const aiBase=rt.weights.ftp*aiFTP+rt.weights.vo2*Math.max(0,(aiVO2-30)/55*100)+rt.weights.sprint*Math.max(0,(aiSprint-300)/1700*100);
    // AI also feels the weather — keeps the playing field level while still making
    // today's race type choice feel meaningful (some days favour certain disciplines)
    const aiScore=(aiBase+(Math.random()-0.5)*Math.max(10,aiBase*0.12)*2)*weatherMult;
    aiScores.push(aiScore);
    if(isRival) rivalScore=aiScore;
  }
  const beaten=aiScores.filter(s=>s>playerScore).length;
  const position=beaten+1;
  // Rival's own finishing position: ranked against every OTHER ai rider plus the player.
  const othersBeatingRival=aiScores.filter((s,idx)=>idx!==0&&s>rivalScore).length;
  const rivalPosition=othersBeatingRival+(playerScore>rivalScore?1:0)+1;
  const prize=Math.round((cat.prizes[Math.min(position-1,cat.prizes.length-1)]||0)*state.prestigeMult);
  return {position,fieldSize,prize,points:cat.ptsPerPos[Math.min(position-1,cat.ptsPerPos.length-1)]||0,equipBonus,weightFactor,weatherMult,
    rival:{name:state.rival.name, beat:playerScore>rivalScore, position:rivalPosition}};
}

function startRace(raceTypeId){
  if(state.raceActive||state.session.active) return;
  const rt=RACE_TYPES.find(r=>r.id===raceTypeId); if(!rt) return;
  if(state.raceCooldowns[raceTypeId]&&Date.now()<state.raceCooldowns[raceTypeId]) return;
  const cat=RACE_CATEGORIES[state.raceCategory];
  const actualCost=getWeatherEnergyCost(cat.energyCost);
  if(state.energy<actualCost){ showToast(`⚡ Need ${actualCost} energy (weather adds cost)`); return; }
  state.energy=Math.max(0,state.energy-actualCost);
  const fatBonus=getWeatherFatigueBonus();
  state.energySpentToday=(state.energySpentToday||0)+actualCost+fatBonus;
  const result=simulateRaceResult(raceTypeId);
  state.raceActive=true;
  state.raceData={typeId:raceTypeId,startTime:Date.now(),animMs:rt.animMs,result,
    virtualPos:Math.round(result.fieldSize*0.45),startVP:Math.round(result.fieldSize*0.45),commentaryIdx:0,
    // Interactive race system
    stages:buildRaceStages(raceTypeId),
    raceLegs:100,          // in-race effort resource, 0-100, reset each race
    positionDelta:0,       // accumulated shift to base result from decisions
    pendingDecision:null,  // {event, startedAt} when player must choose
    lastDecisionResult:null,// shown briefly after a choice is made
    totalPausedMs:0,       // cumulative milliseconds spent showing decision cards
  };
  markTaskProgress('enter_race');
  incrementSponsorProgress('enter_races',1);
  // FIX 5b: Save immediately so energy deduction persists if page closes mid-race
  saveGame(); updateActivityDots();
  if(currentTab==='race') renderRaceTab();
}

function completeRace(){
  const rd=state.raceData, cat=RACE_CATEGORIES[state.raceCategory];
  const isCalEvent=!!rd.isCalendarEvent;
  const calEvent=isCalEvent ? CALENDAR_EVENTS.find(e=>e.id===rd.calendarEventId) : null;

  // Apply interactive decisions: positionDelta shifts the base result.
  // Clamped so decisions can't push you past 1st, and are meaningful but not all-powerful.
  // The cap (±40% of field) means a great set of decisions can swing ~8 places in a field
  // of 20, and a poor set can cost ~8 — significant but not the entire race.
  const rawDelta = rd.positionDelta || 0;
  const maxShift = Math.max(2, Math.floor(rd.result.fieldSize * 0.40));
  const clampedDelta = Math.max(-maxShift, Math.min(maxShift, rawDelta));
  const finalPos = Math.max(1, Math.min(rd.result.fieldSize, rd.result.position + clampedDelta));
  // Recalculate prize for final position (lookup from category prize table)
  const prizeTable = isCalEvent ? calEvent.prizes : cat.prizes;
  const finalPrize = Math.round((prizeTable[Math.min(finalPos-1, prizeTable.length-1)]||0) * state.prestigeMult);
  // Overwrite result with decision-adjusted values
  rd.result.position = finalPos;
  rd.result.prize    = finalPrize;

  if(finalPrize>0) earnMoney(finalPrize);

  // Calendar events run against a fixed invitational field, not the player's own
  // category — so they don't feed category points or set the normal race-type
  // cooldown. They DO still count as real races/wins/podiums for everything else
  // (achievements, sponsor objectives, lifetime totals) — winning the Tour de France
  // should matter just as much as winning a local crit, arguably more.
  const rt=RACE_TYPES.find(r=>r.id===rd.typeId);
  if(!isCalEvent){
    state.categoryPoints+=rd.result.points;
    if(rt) state.raceCooldowns[rd.typeId]=Date.now()+rt.cooldown*1000;
  }
  state.totalRaces++;
  incrementSponsorProgress('prize_money', rd.result.prize);
  if(rd.result.position<=3){ state.totalPodiums++; markTaskProgress('podium_race'); incrementSponsorProgress('podiums',1); }
  if(rd.result.position===1){ markTaskProgress('win_race'); if(rt) state.raceWinsByType[rt.id]=(state.raceWinsByType[rt.id]||0)+1; incrementSponsorProgress('win_races',1); }

  const raceTypeNameForDisplay = isCalEvent ? `${calEvent.icon} ${calEvent.name}` : (rt?rt.name:rd.typeId);
  const catNameForDisplay = isCalEvent ? (calEvent.tier==='pro'?'Pro Calendar':'Semi-Pro Calendar') : cat.shortName;

  const histEntry={
    raceTypeName: raceTypeNameForDisplay,
    catName: catNameForDisplay,
    position:rd.result.position,fieldSize:rd.result.fieldSize,
    prize:rd.result.prize,points:isCalEvent?0:rd.result.points,ts:Date.now()};
  state.raceHistory.unshift(histEntry);
  if(state.raceHistory.length>8) state.raceHistory.pop();
  state.lastRaceResult=histEntry;

  if(isCalEvent){
    state.calendar.completed[rd.calendarEventId]={
      position:rd.result.position, fieldSize:rd.result.fieldSize, prize:rd.result.prize, ts:Date.now(),
    };
  }

  state.raceActive=false; state.raceData=null;
  // Win ceremony — enqueued BEFORE checkCategoryPromotion() so if a single race
  // both wins AND triggers a promotion, the win celebration plays first and the
  // promotion celebration follows immediately after (FIFO ceremony queue).
  if(rd.result.position===1){
    enqueueCeremony({type:'win', raceTypeName:raceTypeNameForDisplay, catName:catNameForDisplay, prize:rd.result.prize});
  }
  updateActivityDots(); checkCategoryPromotion(); checkAchievements(); updateSponsorBadge(); updateCalendarBadge(); recalc(); saveGame();
  // The full-screen win ceremony already communicates position + prize, so the
  // small bottom toast is suppressed for 1st place to avoid showing the same
  // information twice in two different UI styles at once.
  if(rd.result.position!==1){
    showToast(`${rd.result.prize>0?'+'+fmtMoney(rd.result.prize):'No prize'} · ${rd.result.position}${ordinal(rd.result.position)} / ${rd.result.fieldSize}`);
  }
}

function checkCategoryPromotion(){
  const cat=RACE_CATEGORIES[state.raceCategory];
  if(state.categoryPoints>=cat.ptsToPromote&&state.raceCategory<RACE_CATEGORIES.length-1){
    const oldCat=cat;
    state.raceCategory++; state.categoryPoints=0;
    const newCat=RACE_CATEGORIES[state.raceCategory];
    enqueueCeremony({type:'promotion', oldCat, newCat});
    ensureCalendarSeasonStarted();
    updateCalendarBadge();
  }
}

function chooseSpecialisation(id){
  if(state.specialisation) return; // already chosen — permanent
  const spec=SPECIALISATIONS.find(s=>s.id===id); if(!spec) return;
  const canUnlock=Object.entries(spec.requirements).every(([attr,lvl])=>state.attributes[attr]?.level>=lvl);
  if(!canUnlock){ showToast('Requirements not met'); return; }
  state.specialisation=id;
  recalc(); saveGame();
  showToast(`${spec.icon} ${spec.name} unlocked!`);
  if(currentTab==='rider') renderSpecialisation();
}

let _achToastQueue=[];
function checkAchievements(){
  const newlyEarned=[];
  for(const ach of ACHIEVEMENTS){
    if(!state.earnedAchievements.has(ach.id) && achUnlocked(state,ach.id)){
      state.earnedAchievements.add(ach.id);
      newlyEarned.push(ach);
      if(ach.reward.type==='color')  state.unlockedKitColors.add(ach.reward.val);
      if(ach.reward.type==='money')  earnMoney(ach.reward.val);
    }
  }
  if(newlyEarned.length){
    // Stagger toasts so they don't overwrite each other
    newlyEarned.forEach((ach,i)=>{
      setTimeout(()=>showToast(`🏅 ${ach.name}: ${ach.reward.label}`), i*2800);
    });
    if(currentTab==='rider') setTimeout(()=>{ renderAchievements(); renderStats(); },100);
  }
}

function ordinal(n){ const s=['th','st','nd','rd'],v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
