// SPONSORSHIP
// ═══════════════════════════════════════════════════════════
function totalWins(){ return Object.values(state.raceWinsByType).reduce((a,b)=>a+b,0); }

// Highest tier index the player's lifetime win count qualifies for, or -1 if none yet.
function getCurrentSponsorTierIndex(){
  let idx=-1;
  SPONSOR_TIERS.forEach((t,i)=>{ if(totalWins()>=t.winsRequired) idx=i; });
  return idx;
}

function getActiveSponsorDef(){
  if(!state.sponsor.activeId) return null;
  for(const tierObj of SPONSOR_TIERS){
    const s=tierObj.sponsors.find(s=>s.id===state.sponsor.activeId);
    if(s) return {sponsor:s, tier:tierObj};
  }
  return null;
}

// Called from the relevant game action the moment it happens (session complete, race
// entered, race result). No-ops if the player has no active sponsor.
function incrementSponsorProgress(type, amount=1){
  if(!state.sponsor.activeId) return;
  state.sponsor.progress[type]=(state.sponsor.progress[type]||0)+amount;
  if(currentTab==='sponsors') renderSponsorsTab();
  updateSponsorBadge();
}

const SPONSOR_TERMINATE_COOLDOWN_MS = 3 * 24 * 60 * 60 * 1000; // 3 days
const SPONSOR_LATERAL_COOLDOWN_MS  = 24 * 60 * 60 * 1000;      // 24 hrs after same-tier switch

// How many ms remain on the termination cooldown (0 if none active)
function getSponsorTerminateCooldownRemaining(){
  if(!state.sponsor.terminatedAt) return 0;
  return Math.max(0, state.sponsor.terminatedAt + SPONSOR_TERMINATE_COOLDOWN_MS - Date.now());
}

function getSponsorLateralCooldownRemaining(){
  if(!state.sponsor.lateralCooldownUntil) return 0;
  return Math.max(0, state.sponsor.lateralCooldownUntil - Date.now());
}

// Can the player upgrade to a higher tier than their current signed tier?
function canUpgradeSponsor(){
  const qualified=getCurrentSponsorTierIndex();
  return qualified > state.sponsor.activeTierIdx && qualified >= 0;
}

// The other sponsor within the same tier (for lateral switch)
function getLateralSponsor(){
  if(state.sponsor.activeTierIdx < 0) return null;
  const tierObj=SPONSOR_TIERS[state.sponsor.activeTierIdx]; if(!tierObj) return null;
  return tierObj.sponsors.find(s=>s.id!==state.sponsor.activeId)||null;
}

// Voluntary termination — wipes active sponsor, sets 3-day cooldown
function terminateSponsor(){
  const active=getActiveSponsorDef(); if(!active) return;
  if(sponsorActionPending!=='terminate'){
    sponsorActionPending='terminate';
    clearTimeout(sponsorActionTimer);
    sponsorActionTimer=setTimeout(()=>{ sponsorActionPending=null; if(currentTab==='sponsors') renderSponsorsTab(); },4000);
    if(currentTab==='sponsors') renderSponsorsTab();
    return;
  }
  clearTimeout(sponsorActionTimer);
  sponsorActionPending=null;
  state.sponsor.activeId=null;
  state.sponsor.activeTierIdx=-1;
  state.sponsor.terminatedAt=Date.now();
  state.sponsor.weekStart=0;
  state.sponsor.progress={win_races:0,enter_races:0,podiums:0,sessions:0,prize_money:0};
  state.sponsor.claimed={};
  state.sponsor.bonusClaimed=false;
  sponsorViewMode='active';
  saveGame();
  showToast('📋 Contract terminated — 3 day cooling-off period begins now');
  if(currentTab==='sponsors') renderSponsorsTab();
  updateSponsorBadge();
}

// Lateral switch — same tier, different sponsor. 24hr cooldown, progress resets.
function lateralSwitchSponsor(sponsorId){
  const lateral=getLateralSponsor();
  if(!lateral||lateral.id!==sponsorId) return;
  if(getSponsorLateralCooldownRemaining()>0) return;
  const key='lateral:'+sponsorId;
  if(sponsorActionPending!==key){
    sponsorActionPending=key;
    clearTimeout(sponsorActionTimer);
    sponsorActionTimer=setTimeout(()=>{ sponsorActionPending=null; if(currentTab==='sponsors') renderSponsorsTab(); },4000);
    if(currentTab==='sponsors') renderSponsorsTab();
    return;
  }
  clearTimeout(sponsorActionTimer);
  sponsorActionPending=null;
  state.sponsor.activeId=sponsorId;
  state.sponsor.weekStart=Date.now();
  state.sponsor.progress={win_races:0,enter_races:0,podiums:0,sessions:0,prize_money:0};
  state.sponsor.claimed={};
  state.sponsor.bonusClaimed=false;
  state.sponsor.lateralCooldownUntil=Date.now()+SPONSOR_LATERAL_COOLDOWN_MS;
  sponsorViewMode='active';
  saveGame();
  showToast(`🤝 Switched to ${lateral.name}`);
  if(currentTab==='sponsors') renderSponsorsTab();
  updateSponsorBadge();
}

function signSponsor(tierIdx, sponsorId){
  const tierObj=SPONSOR_TIERS[tierIdx]; if(!tierObj) return;
  const sponsorDef=tierObj.sponsors.find(s=>s.id===sponsorId); if(!sponsorDef) return;
  if(getSponsorTerminateCooldownRemaining()>0){
    showToast('⏳ Cooling-off period active — wait 3 days after termination');
    return;
  }
  if(state.sponsor.activeId && state.sponsor.activeTierIdx===tierIdx){
    // Same-tier lateral switch — handled separately via lateralSwitchSponsor
    return;
  }
  if(state.sponsor.activeId){
    // Upgrading to a new tier — two-tap so player sees the cooldown warning first
    const key='sign:'+tierIdx+':'+sponsorId;
    if(sponsorActionPending!==key){
      sponsorActionPending=key;
      clearTimeout(sponsorActionTimer);
      sponsorActionTimer=setTimeout(()=>{ sponsorActionPending=null; if(currentTab==='sponsors') renderSponsorsTab(); },4000);
      if(currentTab==='sponsors') renderSponsorsTab();
      return;
    }
    clearTimeout(sponsorActionTimer);
    sponsorActionPending=null;
  }
  state.sponsor.activeId=sponsorId;
  state.sponsor.activeTierIdx=tierIdx;
  state.sponsor.weekStart=Date.now();
  state.sponsor.progress={win_races:0,enter_races:0,podiums:0,sessions:0,prize_money:0};
  state.sponsor.claimed={};
  state.sponsor.bonusClaimed=false;
  state.sponsor.terminatedAt=0;
  // Signing (including upgrades) starts a 24hr cooldown on lateral switching
  // so the player can't immediately hop to the other sponsor in the new tier.
  state.sponsor.lateralCooldownUntil=Date.now()+SPONSOR_LATERAL_COOLDOWN_MS;
  sponsorViewMode='active';
  saveGame();
  showToast(`🤝 Signed with ${sponsorDef.name}! 24hr cooldown on switching`);
  if(currentTab==='sponsors') renderSponsorsTab();
  updateSponsorBadge();
}

function claimSponsorObjective(objId){
  const active=getActiveSponsorDef(); if(!active) return;
  const obj=active.sponsor.objectives.find(o=>o.id===objId); if(!obj) return;
  if(state.sponsor.claimed[objId]) return;
  const cur=state.sponsor.progress[obj.type]||0;
  if(cur<obj.target) return;
  state.sponsor.claimed[objId]=true;
  earnMoney(obj.reward);
  state.sponsor.totalEarned=(state.sponsor.totalEarned||0)+obj.reward;
  saveGame();
  showToast(`💰 ${obj.label} complete: +${fmtMoney(obj.reward)}!`);
  if(currentTab==='sponsors') renderSponsorsTab();
  updateSponsorBadge();
}

function claimSponsorBonus(){
  const active=getActiveSponsorDef(); if(!active) return;
  if(state.sponsor.bonusClaimed) return;
  const allClaimed=active.sponsor.objectives.every(o=>state.sponsor.claimed[o.id]);
  if(!allClaimed) return;
  state.sponsor.bonusClaimed=true;
  earnMoney(active.sponsor.weeklyBonus);
  state.sponsor.totalEarned=(state.sponsor.totalEarned||0)+active.sponsor.weeklyBonus;
  saveGame();
  showToast(`🎉 Weekly Bonus: +${fmtMoney(active.sponsor.weeklyBonus)}!`);
  if(currentTab==='sponsors') renderSponsorsTab();
  updateSponsorBadge();
}

// Rolling 7-day window from when the current sponsor was signed (or last reset),
// independent of the calendar-day energy/task reset. Checked every time checkDailyReset
// ticks (every 60s + at boot) so it doesn't need its own interval.
function checkSponsorWeeklyReset(){
  if(!state.sponsor.activeId) {
    // Re-render sponsors tab live if a cooldown just expired
    if(state.sponsor.terminatedAt > 0 && getSponsorTerminateCooldownRemaining()===0){
      state.sponsor.terminatedAt=0;
      saveGame();
      if(currentTab==='sponsors') renderSponsorsTab();
      updateSponsorBadge();
    }
    if(state.sponsor.lateralCooldownUntil > 0 && getSponsorLateralCooldownRemaining()===0){
      state.sponsor.lateralCooldownUntil=0;
      saveGame();
      if(currentTab==='sponsors') renderSponsorsTab();
    }
    return;
  }
  const WEEK_MS=7*24*60*60*1000;
  if(Date.now()-state.sponsor.weekStart>=WEEK_MS){
    state.sponsor.weekStart=Date.now();
    state.sponsor.progress={win_races:0,enter_races:0,podiums:0,sessions:0,prize_money:0};
    state.sponsor.claimed={};
    state.sponsor.bonusClaimed=false;
    saveGame();
    showToast('📅 New sponsorship week! Objectives have reset.');
    if(currentTab==='sponsors') renderSponsorsTab();
    updateSponsorBadge();
  }
}

// Lights up the Sponsors tab when there's something ready to claim, or when a tier is
// unlocked and waiting to be picked for the first time.
function updateSponsorBadge(){
  const btn=document.getElementById('tab-btn-sponsors'); if(!btn) return;
  const active=getActiveSponsorDef();
  let ready=false;
  if(active){
    // Claimable objectives or bonus
    ready = active.sponsor.objectives.some(o=>!state.sponsor.claimed[o.id] && (state.sponsor.progress[o.type]||0)>=o.target);
    if(!ready && !state.sponsor.bonusClaimed && active.sponsor.objectives.every(o=>state.sponsor.claimed[o.id])) ready=true;
    // Upgrade available
    if(!ready && canUpgradeSponsor()) ready=true;
  } else if(getSponsorTerminateCooldownRemaining()<=0){
    // No sponsor, no cooldown — something to act on
    ready = getCurrentSponsorTierIndex()>=0;
  }
  btn.classList.toggle('sponsor-ready', ready);
}

const CALENDAR_TIER_UNLOCK_CAT = { semipro: 5, pro: 6 }; // RACE_CATEGORIES index: 5=Cat1 (Semi-Pro), 6=Pro

function isCalendarUnlocked(){ return state.raceCategory>=CALENDAR_TIER_UNLOCK_CAT.semipro; }
function isProTierUnlocked(){ return state.raceCategory>=CALENDAR_TIER_UNLOCK_CAT.pro; }

// Events the player is currently eligible to see/sign up for, given their category.
function getAvailableCalendarEvents(){
  return CALENDAR_EVENTS.filter(e=> e.tier==='semipro' || (e.tier==='pro' && isProTierUnlocked()) );
}

// How many calendar slots the player gets this season, based on prestige (Season) level.
// Season 1-2: 1 slot. Season 3-6: 2 slots. Then +1 slot every 4 seasons beyond that.
// Always capped at however many events the player can actually see.
function getCalendarSlotLimit(){
  let raw;
  if(state.season<=2) raw=1;
  else raw=2+Math.floor((state.season-3)/4);
  return Math.max(1, Math.min(raw, getAvailableCalendarEvents().length));
}

// Lazily starts the 30-day calendar clock the first time the player reaches Semi-Pro,
// so the feature doesn't silently burn through real-world time before it's relevant.
function ensureCalendarSeasonStarted(){
  if(!isCalendarUnlocked()) return;
  if(state.calendar.seasonStartDate===0){
    state.calendar.seasonStartDate=Date.now();
    saveGame();
  }
}

function getCalendarDaysRemaining(){
  if(state.calendar.seasonStartDate===0) return CALENDAR_SEASON_DAYS;
  const elapsedMs=Date.now()-state.calendar.seasonStartDate;
  const remainingMs=Math.max(0, CALENDAR_SEASON_DAYS*24*60*60*1000 - elapsedMs);
  return Math.ceil(remainingMs/(24*60*60*1000));
}

// Rolling 30-day window. Archives this season's results, forfeits any signed-up-but-
// unraced events (no refund — that was the commitment made at sign-up), and restarts
// the clock. Checked from the existing checkDailyReset tick, so no separate interval.
function checkCalendarSeasonReset(){
  if(state.calendar.seasonStartDate===0) return;
  const elapsedMs=Date.now()-state.calendar.seasonStartDate;
  if(elapsedMs < CALENDAR_SEASON_DAYS*24*60*60*1000) return;

  const completedResults=Object.entries(state.calendar.completed).map(([eventId,result])=>{
    const ev=CALENDAR_EVENTS.find(e=>e.id===eventId);
    return {eventName:ev?ev.name:eventId, eventIcon:ev?ev.icon:'🏁', ...result};
  });
  const forfeitedIds=state.calendar.signups.filter(id=>!state.calendar.completed[id]);

  state.calendar.history.unshift({
    seasonEndedAt:Date.now(),
    results:completedResults,
    forfeitedCount:forfeitedIds.length,
  });
  if(state.calendar.history.length>12) state.calendar.history.pop();

  state.calendar.signups=[];
  state.calendar.completed={};
  state.calendar.seasonStartDate=Date.now();
  saveGame();

  const msg = forfeitedIds.length>0
    ? `📅 New Calendar season! ${forfeitedIds.length} unraced event${forfeitedIds.length>1?'s were':' was'} forfeited.`
    : '📅 New Calendar season has begun!';
  showToast(msg);
  if(currentTab==='calendar') renderCalendarTab();
  updateCalendarBadge();
}

function signUpForCalendarEvent(eventId){
  const ev=CALENDAR_EVENTS.find(e=>e.id===eventId); if(!ev) return;
  if(ev.tier==='pro' && !isProTierUnlocked()){ showToast('🔒 Reach Pro category to enter this event'); return; }
  if(state.calendar.signups.includes(eventId)){ showToast('Already signed up for this event'); return; }
  if(state.calendar.signups.length>=getCalendarSlotLimit()){ showToast(`Only ${getCalendarSlotLimit()} event slot${getCalendarSlotLimit()>1?'s':''} this season`); return; }
  if(state.money<ev.entryFee){ showToast('Not enough prize money for entry fee'); return; }

  // Two-tap confirmation — replaces confirm() which is suppressed on iOS PWA.
  // First tap: highlight button amber and wait for a second tap within 4 seconds.
  if(calendarSignupPending!==eventId){
    calendarSignupPending=eventId;
    clearTimeout(calendarSignupTimer);
    calendarSignupTimer=setTimeout(()=>{
      calendarSignupPending=null;
      if(currentTab==='calendar') renderCalendarTab();
    }, 4000);
    if(currentTab==='calendar') renderCalendarTab();
    return;
  }

  // Second tap within 4s — execute the signup.
  clearTimeout(calendarSignupTimer);
  calendarSignupPending=null;
  state.money-=ev.entryFee;
  state.calendar.signups.push(eventId);
  saveGame();
  showToast(`📝 Signed up for ${ev.name}!`);
  if(currentTab==='calendar') renderCalendarTab();
  updateHeader();
}

// Mirrors simulateRaceResult, but uses the event's own fixed elite-AI FTP band
// (independent of the player's category) and its own field size / prize table.
function simulateCalendarEventResult(eventId){
  const ev=CALENDAR_EVENTS.find(e=>e.id===eventId); if(!ev) return null;
  const rt=RACE_TYPES.find(r=>r.id===ev.raceTypeId);
  const rs=getRiderStats();
  const normVO2   =Math.max(0,(rs.vo2max    -30)/55  *100);
  const sprintPowerEff = state.specialisation==='sprinter' ? rs.sprintPower*1.20 : rs.sprintPower;
  const normSprint=Math.max(0,(sprintPowerEff-300)/1700*100);
  const playerBase=rt.weights.ftp*rs.ftp+rt.weights.vo2*normVO2+rt.weights.sprint*normSprint;
  const vo2Mult   =1+state.attributes.vo2.level*0.04;
  const sprintMult=rt.id==='crit'?(1+state.attributes.sprint.level*0.10):1;
  const equipBonus=getEquipmentBonusForRace(ev.raceTypeId);
  const variance  =Math.max(10,playerBase*0.12);
  let playerScore=playerBase*vo2Mult*sprintMult+equipBonus+(Math.random()-0.5)*variance*2;
  if(state.specialisation==='climber'){
    if(ev.raceTypeId==='hill') playerScore*=1.5;
    else if(ev.raceTypeId==='road') playerScore*=1.1;
  } else if(state.specialisation==='sprinter'){
    if(ev.raceTypeId==='crit') playerScore*=1.5;
    else if(ev.raceTypeId==='road') playerScore*=1.1;
  } else if(state.specialisation==='rouleur'){
    if(ev.raceTypeId==='tt') playerScore*=1.35;
    else playerScore*=1.2;
  }
  const weightFactor=getWeightFactorForRace(ev.raceTypeId);
  playerScore*=weightFactor;

  // Fixed elite AI band per tier, independent of the player's own race category —
  // these are invitational fields of specialists, not a reflection of player rank.
  const ftpBand = ev.tier==='pro' ? [430,560] : [360,470];
  let beaten=0;
  for(let i=0;i<ev.fieldSize-1;i++){
    const aiFTP=ftpBand[0]+Math.random()*(ftpBand[1]-ftpBand[0]);
    const aiVO2=30+(aiFTP-50)/500*55, aiSprint=300+(aiFTP-50)/500*1700;
    const aiBase=rt.weights.ftp*aiFTP+rt.weights.vo2*Math.max(0,(aiVO2-30)/55*100)+rt.weights.sprint*Math.max(0,(aiSprint-300)/1700*100);
    const aiScore=aiBase+(Math.random()-0.5)*Math.max(10,aiBase*0.12)*2;
    if(aiScore>playerScore) beaten++;
  }
  const position=beaten+1;
  const prize=ev.prizes[Math.min(position-1,ev.prizes.length-1)]||0;
  return {position,fieldSize:ev.fieldSize,prize,equipBonus,weightFactor};
}

function startCalendarEvent(eventId){
  if(state.raceActive||state.session.active) return;
  const ev=CALENDAR_EVENTS.find(e=>e.id===eventId); if(!ev) return;
  if(!state.calendar.signups.includes(eventId)){ showToast('Not signed up for this event'); return; }
  if(state.calendar.completed[eventId]){ showToast('Already raced this event this season'); return; }
  if(state.energy<ev.energyCost){ showToast(`⚡ Need ${ev.energyCost} energy`); return; }
  state.energy=Math.max(0,state.energy-ev.energyCost);
  state.energySpentToday=(state.energySpentToday||0)+ev.energyCost;
  const result=simulateCalendarEventResult(eventId);
  const rt=RACE_TYPES.find(r=>r.id===ev.raceTypeId);
  state.raceActive=true;
  state.raceData={typeId:ev.raceTypeId,startTime:Date.now(),animMs:rt.animMs,result,
    virtualPos:Math.round(result.fieldSize*0.45),startVP:Math.round(result.fieldSize*0.45),commentaryIdx:0,
    isCalendarEvent:true, calendarEventId:eventId,
    stages:buildRaceStages(ev.raceTypeId),
    raceLegs:100, positionDelta:0, pendingDecision:null, lastDecisionResult:null,
    totalPausedMs:0,
  };
  markTaskProgress('enter_race');
  incrementSponsorProgress('enter_races',1);
  saveGame(); updateActivityDots();
  // Switch to the Race tab to watch the animation — reuses the existing race engine/UI
  // wholesale rather than duplicating a second live-race renderer inside Calendar.
  showTab('race');
}

// Regenerates today's price/offer/benefit rolls if the stored market is from a
// previous day. Cheap to call defensively from anywhere that reads market data.
function ensureDailyMarket(){
  const dayKey=getDayKey();
  if(state.dailyMarket && state.dailyMarket.dayKey===dayKey) return;
  const items={};
  ENERGY_ITEMS.forEach(item=>{
    const rng=mulberry32(hashStr(dayKey+'_'+item.id));
    items[item.id]={ priceMult: 0.8+rng()*0.5, benefitMult: 0.85+rng()*0.35, onOffer:false };
  });
  // Pick 1-2 items to feature "on offer" today (extra discount on top of the price roll)
  const offerRng=mulberry32(hashStr(dayKey+'_offer'));
  const offerCount=1+Math.floor(offerRng()*2);
  const shuffled=[...ENERGY_ITEMS.map(i=>i.id)];
  for(let i=shuffled.length-1;i>0;i--){ const j=Math.floor(offerRng()*(i+1)); [shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]]; }
  shuffled.slice(0,offerCount).forEach(id=>{ items[id].onOffer=true; items[id].priceMult*=0.65; });
  state.dailyMarket={dayKey, items};
}

function getMarketPrice(item){
  ensureDailyMarket();
  const m=state.dailyMarket.items[item.id];
  return Math.max(1, Math.round(item.cost*m.priceMult));
}

function getMarketBenefit(item){
  ensureDailyMarket();
  const m=state.dailyMarket.items[item.id];
  return {
    energy: Math.max(1, Math.round(item.energy*m.benefitMult)),
    fatigueRecovery: item.fatigueRecovery>0 ? Math.round(item.fatigueRecovery*m.benefitMult) : 0,
  };
}

function isOnOffer(itemId){ ensureDailyMarket(); return !!state.dailyMarket.items[itemId]?.onOffer; }

// Removes any inventory instance older than its 1-week shelf life. Run on every
// checkDailyReset tick (every 60s + at boot), independent of the calendar-day boundary,
// since an item bought mid-day perishes mid-day exactly a week later.
function expirePerishedItems(){
  const now=Date.now();
  const fresh=state.energyInventory.filter(e=>now-e.purchasedAt<ITEM_SHELF_LIFE_MS);
  const expiredCount=state.energyInventory.length-fresh.length;
  if(expiredCount>0){
    state.energyInventory=fresh;
    saveGame();
    showToast(`🗑️ ${expiredCount} item${expiredCount>1?'s':''} spoiled and were discarded`);
    if(currentTab==='train') renderEnergyCard();
    if(currentTab==='gear') renderEnergyItems();
  }
}

function buyEnergyItem(id){
  const item=ENERGY_ITEMS.find(e=>e.id===id); if(!item) return;
  const price=getMarketPrice(item);
  if(state.money<price){ showToast('Not enough prize money'); return; }
  const benefit=getMarketBenefit(item);
  state.money-=price;
  state.energyInventory.push({
    id:'inv_'+Date.now()+'_'+Math.floor(Math.random()*100000),
    itemType:id, energy:benefit.energy, fatigueRecovery:benefit.fatigueRecovery, purchasedAt:Date.now(),
  });
  markTaskProgress('purchase_item');
  updateHeader();
  if(currentTab==='gear') renderEnergyItems();
  if(currentTab==='train') renderEnergyCard();
  saveGame();
  showToast(`${item.icon} ${item.name} added to inventory! (+${benefit.energy} energy when used)`);
}

function useEnergyItem(id){
  const item=ENERGY_ITEMS.find(e=>e.id===id); if(!item) return;
  // FIFO — use the oldest instance of this item type first, so freshness is spent down naturally
  const candidates=state.energyInventory.filter(e=>e.itemType===id).sort((a,b)=>a.purchasedAt-b.purchasedAt);
  if(!candidates.length){ showToast('None in inventory'); return; }
  if(state.energy>=MAX_ENERGY_CAP){ showToast('⚡ Already at max energy!'); return; }
  const instance=candidates[0];
  state.energyInventory.splice(state.energyInventory.indexOf(instance),1);
  state.energy=Math.min(MAX_ENERGY_CAP, state.energy+instance.energy);
  // Recovery items also reduce today's fatigue, improving tomorrow's starting energy
  if(instance.fatigueRecovery>0){
    state.energySpentToday=Math.max(0,(state.energySpentToday||0)-instance.fatigueRecovery);
  }
  // Weight dynamic: every item eaten counts toward today's carb load. Crossing the
  // daily limit doesn't gain weight immediately — the excess converts to weight at
  // tonight's reset — but we warn once per day on approach so it's never a surprise.
  state.carbsToday=(state.carbsToday||0)+instance.energy;
  const overLimit=state.carbsToday>=CARB_DAILY_LIMIT;
  const nearLimit=state.carbsToday>=CARB_DAILY_LIMIT*0.8;
  let carbWarning='';
  if(!state.carbWarningShownToday && (nearLimit||overLimit)){
    state.carbWarningShownToday=true;
    carbWarning=overLimit
      ? ` · ⚠️ Over today's carb limit — excess adds weight tonight`
      : ` · ⚠️ Approaching today's carb limit (${state.carbsToday}/${CARB_DAILY_LIMIT})`;
  }
  markTaskProgress('use_item');
  updateHeader();
  if(currentTab==='train') renderEnergyCard();
  if(currentTab==='gear') renderEnergyItems();
  saveGame();
  const recovMsg=instance.fatigueRecovery>0?` · 💤 tmr: ${getTomorrowEnergy()}/${state.maxEnergy}`:'';
  showToast(`${item.icon} +${instance.energy} energy!${recovMsg}${carbWarning}`);
}

function canClaimDailyBar(){
  const now=new Date(), last=new Date(state.lastDailyBar||0);
  return now.toDateString()!==last.toDateString();
}

function claimDailyBar(){
  if(!canClaimDailyBar()){ showToast('Already claimed today — come back tomorrow!'); return; }
  // The free daily bar is a flat, reliable freebie — it always uses the base stats,
  // not today's fluctuating market benefit, so the daily gift never feels like a bad roll.
  const item=ENERGY_ITEMS.find(e=>e.id==='bar');
  state.energyInventory.push({
    id:'inv_'+Date.now()+'_'+Math.floor(Math.random()*100000),
    itemType:'bar', energy:item.energy, fatigueRecovery:item.fatigueRecovery, purchasedAt:Date.now(),
  });
  state.lastDailyBar=Date.now();
  saveGame();
  showToast('🍫 Free daily Energy Bar added to your inventory!');
  if(currentTab==='gear') renderEnergyItems();
  if(currentTab==='train') renderEnergyCard();
}

// ─── DAILY TASKS (Growth tab) ───────────────────────────────
// markTaskProgress is called from the relevant action (session complete, race start,
// race result, item purchase, item use) the moment that action happens. It only ever
// flips false→true — completing the same task twice in one day has no extra effect.
function markTaskProgress(id){
  if(!state.dailyTasks.progress[id]){
    state.dailyTasks.progress[id]=true;
    saveGame();
    if(currentTab==='growth') renderGrowthTab();
    updateGrowthBadge();
  }
}

function claimDailyTask(id){
  const task=DAILY_TASKS.find(t=>t.id===id); if(!task) return;
  if(!state.dailyTasks.progress[id]||state.dailyTasks.claimed[id]) return;
  state.dailyTasks.claimed[id]=true;
  ATTR_ORDER.forEach(attr=>addXP(attr,task.xpReward));
  recalc(); saveGame();
  showToast(`✅ ${task.name}: +${task.xpReward} XP to all attributes!`);
  if(currentTab==='growth') renderGrowthTab();
  updateGrowthBadge();
}

function claimAllDailyTasks(){
  const claimable=DAILY_TASKS.filter(t=>state.dailyTasks.progress[t.id]&&!state.dailyTasks.claimed[t.id]);
  if(!claimable.length) return;
  claimable.forEach(t=>{
    state.dailyTasks.claimed[t.id]=true;
    ATTR_ORDER.forEach(attr=>addXP(attr,t.xpReward));
  });
  recalc(); saveGame();
  showToast(`✅ Claimed ${claimable.length} task${claimable.length>1?'s':''}!`);
  if(currentTab==='growth') renderGrowthTab();
  updateGrowthBadge();
}

// Lights up the Growth tab with a pulsing dot whenever a completed task is waiting to be claimed
function updateGrowthBadge(){
  const hasClaimable=DAILY_TASKS.some(t=>state.dailyTasks.progress[t.id]&&!state.dailyTasks.claimed[t.id]);
  const btn=document.getElementById('tab-btn-growth');
  if(btn) btn.classList.toggle('growth-ready',hasClaimable);
}

function prestigeThreshold(){ return Math.floor(1500*Math.pow(3,state.seasonsCompleted)); }
function handlePrestige(){
  if(state.seasonMoney<prestigeThreshold()) return;
  // FIX 4: Block prestige during active session or race to prevent energy/XP loss
  if(state.raceActive||state.session.active){ showToast('⚠️ Finish current activity first'); return; }
  const next=state.prestigeMult*2, newMax=state.maxEnergy+10;
  if(!confirm(`Start Season ${state.season+1}?\n\n• Prize money & race category reset\n• FTP & fitness attributes RESET to default\n• Bikes, wheels, kit & accessories are KEPT\n• Specialisation RESETS — choose again next season\n• Prize money multiplier: ×${next}\n• Daily energy increases to ${newMax}\n\nAll-time earnings: ${fmtMoney(state.lifetimeMoney)}`)) return;
  state.season++; state.seasonsCompleted++; state.money=0; state.seasonMoney=0;
  state.prestigeMult=next; state.maxEnergy=newMax; state.energy=newMax;
  state.todayEnergyAllocation=newMax; // fresh season starts at full allocation, no fatigue carried over
  // FTP reset: zero every attribute back to its starting level/xp. Bikes, wheels,
  // kit and accessories (boughtUpgrades) are deliberately left untouched — gear
  // earned through play is a permanent collection, not something prestige should
  // strip away. Only the rider's physical conditioning resets each season.
  ATTR_ORDER.forEach(id=>{ state.attributes[id]={xp:0,level:0}; });
  state.session={active:false}; state.trainCooldowns={};
  state.raceActive=false; state.raceData=null; state.raceCategory=0;
  state.categoryPoints=0; state.raceCooldowns={}; state.lastRaceResult=null;
  state.specialisation=null;
  state.energySpentToday=0; // fresh season — clean fatigue slate
  checkAchievements(); updateActivityDots(); recalc(); updateUI(); saveGame();
}

function fmtMoney(n){ n=Math.floor(n); return n>=1e6?'£'+(n/1e6).toFixed(2)+'M':n>=1000?'£'+(n/1000).toFixed(1)+'K':'£'+n.toLocaleString(); }
function fmt(n){ n=Math.floor(n); return n>=1e6?(n/1e6).toFixed(2)+'M':n>=1000?(n/1000).toFixed(1)+'K':n.toLocaleString(); }
function fmtDec(n){ return n>=1000?fmt(n):n.toFixed(2); }
function fmtTime(ms){ const s=Math.ceil(ms/1000); return s>60?Math.ceil(s/60)+'m':s+'s'; }
function timeToReset(){ const now=new Date(),mid=new Date(now);mid.setHours(24,0,0,0);const ms=mid-now,h=Math.floor(ms/3600000),m=Math.floor((ms%3600000)/60000);return h>0?`${h}h ${m}m`:`${m}m`; }
let toastTimer=null;
function showToast(msg){ const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2500); }

// ═══════════════════════════════════════════════════════════
// CEREMONY SYSTEM — full-screen celebration for race wins and
// category promotions. A single race can trigger both (win AND
// get promoted in the same result), so these queue rather than
// show simultaneously or clobber each other.
// ═══════════════════════════════════════════════════════════
let ceremonyQueue=[];
let ceremonyShowing=false;

function enqueueCeremony(ceremony){
  ceremonyQueue.push(ceremony);
  if(!ceremonyShowing) processCeremonyQueue();
}

function processCeremonyQueue(){
  if(ceremonyShowing||ceremonyQueue.length===0) return;
  const next=ceremonyQueue.shift();
  ceremonyShowing=true;
  if(next.type==='win') renderWinCeremony(next);
  else if(next.type==='promotion') renderPromotionCeremony(next);
  spawnConfetti();
  document.getElementById('ceremony-overlay').style.display='flex';
}

function dismissCeremony(e){
  // Allow tapping the dim backdrop OR the explicit button to dismiss.
  // Taps inside the card itself are stopped via stopPropagation in the HTML.
  document.getElementById('ceremony-overlay').style.display='none';
  document.getElementById('ceremony-confetti').innerHTML='';
  ceremonyShowing=false;
  processCeremonyQueue(); // show the next queued ceremony, if any
}

// Generates ~36 falling confetti rectangles in randomised colours, positions,
// rotation and timing. Rebuilt fresh on every ceremony so it never looks stale.
function spawnConfetti(){
  const wrap=document.getElementById('ceremony-confetti');
  const colors=['var(--gold)','var(--green-txt)','var(--blue-txt)','var(--red-txt)','var(--purple-txt)','var(--amber-txt)'];
  let html='';
  for(let i=0;i<36;i++){
    const left=Math.random()*100;
    const delay=(Math.random()*0.5).toFixed(2);
    const duration=(2.2+Math.random()*1.4).toFixed(2);
    const color=colors[Math.floor(Math.random()*colors.length)];
    const rotate=Math.random()<0.5?'2px':'6px';
    html+=`<span class="confetti-piece" style="left:${left}%;background:${color};animation-delay:${delay}s;animation-duration:${duration}s;border-radius:${rotate}"></span>`;
  }
  wrap.innerHTML=html;
}

// Animates a number counting up from 0 to `target` over `durationMs`,
// writing the formatted result into the element with id `elId` each frame.
// Uses an ease-out curve so it starts fast and settles gently on the final value.
function animateCountUp(elId, target, durationMs, formatFn){
  const el=document.getElementById(elId); if(!el) return;
  const start=performance.now();
  function tick(now){
    const t=Math.min(1,(now-start)/durationMs);
    const eased=1-Math.pow(1-t,3); // ease-out cubic
    const val=Math.round(target*eased);
    el.textContent=formatFn(val);
    if(t<1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

    ? `<div class="energy-hint" style="color:var(--red-txt)">⚠️ Over today's limit — excess converts to weight tonight</div>`
    : carbPct>=80
      ? `<div class="energy-hint">⚠️ Approaching today's carb limit</div>`
      : '';

  wrap.innerHTML=`<div class="energy-card">
    <div class="energy-head"><span class="energy-label">⚖️ Rider Weight</span><span class="energy-amount">${state.riderWeight.toFixed(1)}kg</span></div>

function renderActiveSession(){
  const wrap=document.getElementById('active-session-wrap');
  if(!state.session.active){ wrap.innerHTML=''; return; }
  const t=TRAINING.find(t=>t.id===state.session.typeId); if(!t){ wrap.innerHTML=''; return; }

  // ── COLLECT STATE: timer done, waiting for player tap ──
  if(state.session.awaitingCollection){
    const isCrit=!!state.session.isCritical;
    const rewardPills=(state.session.pendingXP||[]).map(({attr,amount})=>{
      const acv=ATTR_DEFS[attr].colorVar;
      const pillStyle=isCrit
        ? `background:var(--gold);color:#fff;font-weight:800;font-size:13px;padding:5px 12px;box-shadow:0 1px 4px rgba(0,0,0,.25)`
        : `background:var(--${acv}-bg);color:var(--${acv}-txt);font-weight:700;font-size:13px;padding:5px 12px`;
      return `<span class="active-gain-pill" style="${pillStyle}">${ATTR_DEFS[attr].icon} +${amount} xp</span>`;
    }).join('');
    if(isCrit){
      wrap.innerHTML=`<div class="active-session collect-critical" style="cursor:pointer;text-align:center;padding:22px 14px;" onclick="collectSessionReward()">
        <div style="font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.3);margin-bottom:4px">⚡ Critical Effort ⚡</div>
        <div class="critical-badge" style="font-size:38px;margin-bottom:4px">🌟</div>
        <div style="font-size:19px;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.3);margin-bottom:2px">${t.name} — 2× XP!</div>
        <div style="font-size:12px;font-weight:600;color:#fff;opacity:.9;margin-bottom:12px">Your legs found something extra today</div>
        <div class="active-gains" style="justify-content:center;margin-bottom:14px">${rewardPills}</div>
        <div style="font-size:12px;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.3);text-transform:uppercase;letter-spacing:.08em">Tap to collect</div>
      </div>`;
      return;
    }
    wrap.innerHTML=`<div class="active-session collect-ready" style="background:var(--green-bg);border:2px solid var(--green-txt);cursor:pointer;text-align:center;padding:20px 14px;" onclick="collectSessionReward()">
      <div style="font-size:32px;margin-bottom:6px">🏅</div>
      <div style="font-size:18px;font-weight:800;color:var(--green-txt);margin-bottom:12px">${t.name} Complete!</div>
      <div class="active-gains" style="justify-content:center;margin-bottom:14px">${rewardPills}</div>
      <div style="font-size:12px;font-weight:700;color:var(--green-txt);opacity:.7;text-transform:uppercase;letter-spacing:.08em">Tap to collect</div>
    </div>`;
    return;
  }

  // ── RUNNING STATE: live countdown ──
  const now=Date.now(), elapsed=now-state.session.startTime;
  const progress=Math.min(1,elapsed/state.session.duration);
  const remaining=Math.max(0,Math.ceil((state.session.duration-elapsed)/1000));
  const cv=t.colorVar;
  const gainPills=Object.entries(t.xpGains).map(([a,x])=>{
    const acv=ATTR_DEFS[a].colorVar;
    return `<span class="active-gain-pill" style="background:var(--${acv}-bg);color:var(--${acv}-txt)">${ATTR_DEFS[a].icon} +${Math.round(x*D.sessionMult)} xp</span>`;
  }).join('');
  wrap.innerHTML=`<div class="active-session" style="background:var(--${cv}-bg);border:1.5px solid var(--${cv}-bd)">
    <div class="active-head">
      <span class="zone-badge" style="background:var(--${cv}-txt)">Z${t.zone}</span>
      <span class="active-name" style="color:var(--${cv}-txt)">${t.name}</span>
      <span class="active-timer" style="color:var(--${cv}-txt)">${remaining}s</span>
    </div>
    <div class="active-bar-wrap"><div class="active-bar" style="width:${Math.round(progress*100)}%;background:var(--${cv}-txt)"></div></div>
    <div class="active-flavour" style="color:var(--${cv}-txt)">${t.flavour}</div>
    <div class="active-gains-label" style="color:var(--${cv}-txt)">On completion</div>
    <div class="active-gains">${gainPills}</div>
  </div>`;
}

function renderSessionList(){
  const list=document.getElementById('training-list'); list.innerHTML='';
  const now=Date.now();
  TRAINING.forEach(t=>{
    if(state.session.active&&state.session.typeId===t.id) return;
    const cdEnd=state.trainCooldowns[t.id]||0, onCd=cdEnd>now;
    const locked=t.unlock&&state.attributes[t.unlock.attr].level<t.unlock.level;
    const noEnergy=!locked&&!onCd&&state.energy<t.energyCost;
    const available=!onCd&&!locked&&!noEnergy&&!state.session.active&&!state.raceActive;
    const cv=t.colorVar;
    let statusHtml;
    if(locked){ const ud=ATTR_DEFS[t.unlock.attr]; statusHtml=`<span class="session-status" style="color:var(--txt3)">🔒 ${ud.name} Lv${t.unlock.level}</span>`; }
    else if(onCd) statusHtml=`<span class="session-status" style="color:var(--txt2)">⏳ ${fmtTime(cdEnd-now)}</span>`;
    else if(state.session.active||state.raceActive) statusHtml=`<span class="session-status" style="color:var(--txt3)">Busy</span>`;
    else if(noEnergy) statusHtml=`<span class="session-status" style="color:var(--red-txt)">⚡ ${Math.floor(state.energy)}/${t.energyCost}</span>`;
    else statusHtml=`<span class="session-status" style="color:var(--${cv}-txt)">▶ ${t.duration}s</span>`;
    const xpBadges=Object.entries(t.xpGains).map(([a,x])=>`<span class="gain-badge">${ATTR_DEFS[a].icon} +${Math.round(x*D.sessionMult)}xp</span>`).join('');
    const eBadge=`<span class="energy-cost-badge${noEnergy?' unaffordable':''}">⚡ ${t.energyCost}</span>`;
    const cdBarHtml=onCd?(()=>{ const pct=Math.round((1-(cdEnd-now)/(t.cooldown*1000))*100); return `<div class="cooldown-bar-wrap"><div class="cooldown-bar" style="width:${pct}%"></div></div>`; })():'';
    const div=document.createElement('div'); div.className='session-card'+(available?' available':'');
    if(!available) div.style.opacity=locked?'0.5':'0.65';
    div.innerHTML=`<div class="session-card-head">
        <span class="zone-badge" style="background:var(--${cv}-txt)">Z${t.zone}</span>
        <div class="session-card-text"><div class="session-card-name">${t.name}</div><div class="session-card-sub">${t.subtitle}</div></div>
        ${statusHtml}
      </div>
      <div class="session-gains">${eBadge}${xpBadges}</div>${cdBarHtml}`;
    if(available) div.addEventListener('click',()=>startSession(t.id));
    list.appendChild(div);
  });
}

function renderWeatherBanner(){
  const wrap=document.getElementById('weather-banner-wrap'); if(!wrap) return;
  const {condition,intensity}=getDailyWeather();
  const intensityLabel=WEATHER_INTENSITY_LABELS[intensity];
  const intMult=WEATHER_INTENSITY_MULTS[intensity];
  const desc=condition.intensityDesc[intensity];

  // Per-race-type effect badges — show the player clearly which events today's
  // weather helps or hurts so they can make an informed choice before committing energy.
  const raceTypeBadges=RACE_TYPES.map(rt=>{
    const base=condition.scoreEffect[rt.id]||0;
    const effective=base*intMult;
    if(Math.abs(effective)<0.005) return `<span class="wx-badge wx-neutral">${rt.icon} ${rt.name}: neutral</span>`;
    const pct=Math.round(effective*100);
    const col=pct>0?'var(--green-txt)':'var(--red-txt)';
    const bg=pct>0?'var(--green-bg)':'var(--red-bg)';
    const bd=pct>0?'var(--green-bd)':'var(--red-bd)';
    return `<span class="wx-badge" style="color:${col};background:${bg};border-color:${bd}">${rt.icon} ${rt.name}: ${pct>0?'+':''}${pct}%</span>`;
  }).join('');

  // Energy cost note — only show when weather actually increases it
  const energyNote=(condition.energyMult>1 && intMult>0)
    ? `<div class="wx-energy-note">⚡ ${intensityLabel} ${condition.name.toLowerCase()} increases race energy cost and fatigue</div>`
    : '';

  // Banner colour matches condition severity
  const isNeutral=condition.id==='sunny'||condition.id==='overcast';
  const bannerStyle=isNeutral
    ? 'background:var(--bg);border-color:var(--border)'
    : intensity===2
      ? 'background:var(--amber-bg);border-color:var(--amber-bd)'
      : 'background:var(--bg);border-color:var(--border)';

  wrap.innerHTML=`<div class="wx-banner" style="${bannerStyle}">
    <div class="wx-banner-head">
      <span class="wx-icon">${condition.icon}</span>
      <div>
        <div class="wx-name">${intensityLabel} ${condition.name}</div>
        <div class="wx-desc">${desc}</div>
      </div>
    </div>
    <div class="wx-badges-row">${raceTypeBadges}</div>
    ${energyNote}
  </div>`;
}

function renderActiveRaceBlock(){
  const wrap=document.getElementById('active-race-wrap');
  if(!state.raceActive||!state.raceData){ wrap.innerHTML=''; return; }
  const rd=state.raceData, rt=RACE_TYPES.find(r=>r.id===rd.typeId); if(!rt){ wrap.innerHTML=''; return; }
  const now=Date.now();
  const elapsed=getEffectiveElapsed(rd,now); // paused during decision cards
  const progress=Math.min(1,elapsed/rd.animMs);
  const remaining=Math.max(0,Math.ceil((rd.animMs-elapsed)/1000));

  // Header — show calendar event name/icon if applicable
  let headIcon=rt.icon, headName=`${rt.name} — ${RACE_CATEGORIES[state.raceCategory].shortName}`;
  if(rd.isCalendarEvent){
    const ev=CALENDAR_EVENTS.find(e=>e.id===rd.calendarEventId);
    if(ev){ headIcon=ev.icon; headName=ev.name; }
  }

  // Stage marker pips overlaid on the progress bar
  const stages=rd.stages||[];
  const pipHtml=stages.map(s=>{
    const col=s.fired?'var(--amber-txt)':'var(--border)';
    return `<div class="race-stage-pip" style="left:${s.triggerPct*100}%;background:${col}"></div>`;
  }).join('');

  // Race Legs bar
  const legs=rd.raceLegs??100;
  const legsPct=Math.round(legs);
  const legsCol=legs>60?'var(--green-txt)':legs>30?'var(--amber-txt)':'var(--red-txt)';

  // Decision card (if pending) OR last decision result (brief feedback) OR commentary
  let middleHtml='';
  if(rd.pendingDecision){
    const {event, startedAt}=rd.pendingDecision;
    const decisionAge=Date.now()-startedAt;
    const timerPct=Math.max(0,Math.round((1-decisionAge/30000)*100));
    const timerSec=Math.max(0,Math.ceil((30000-decisionAge)/1000));

    const timerHtml=rd.pendingDecision.selectedChoiceId?''
      :`<div class="decision-timer">
        <div class="decision-timer-bar"><div class="decision-timer-fill" style="width:${timerPct}%"></div></div>
        <div class="decision-timer-text">Auto in ${timerSec}s</div>
      </div>`;
    const choicesHtml=event.choices.map(c=>{
      const legsAfter=Math.max(0,legs-c.raceLegsConst);
      const legsTag=c.raceLegsConst>0
        ? `<span class="decision-btn-legs" style="color:${legsAfter<20?'var(--red-txt)':'var(--amber-txt)'}">🔥 -${c.raceLegsConst} legs</span>`
        : `<span class="decision-btn-legs" style="color:var(--green-txt)">🔥 No cost</span>`;
      const isSelected=rd.pendingDecision.selectedChoiceId===c.id;
      const selectedStyle=isSelected
        ?'border-color:var(--green-txt);background:var(--green-bg);'
        :rd.pendingDecision.selectedChoiceId?'opacity:0.45;pointer-events:none;':'' ;
      return `<button class="decision-btn" onclick="makeRaceDecision('${c.id}')"
          style="${selectedStyle}">
        <div style="flex:1">
          <div class="decision-btn-label">${isSelected?'✅ ':''} ${c.label}</div>
          <div class="decision-btn-detail">${isSelected?'<em>Committed — applying...</em>':c.detail}</div>
        </div>
        <div class="decision-btn-cost">${legsTag}</div>
      </button>`;
    }).join('');

    middleHtml=`<div class="decision-card">
      <div class="decision-headline">${event.headline}</div>
      <div class="decision-situation">${event.situation}</div>
      <div class="decision-choices">${choicesHtml}</div>
      ${timerHtml}
    </div>`;
  } else if(rd.lastDecisionResult){
    // Show feedback from the last decision for a few seconds
    const r=rd.lastDecisionResult;
    middleHtml=`<div class="decision-result">
      <strong>${r.autoSelected?'⏱️ Auto-selected:':''} ${r.label}</strong><br>
      ${r.deltaStr} · Race legs remaining: <strong style="color:${r.legsCol}">${r.legsLeft}</strong>
    </div>`;
    // Clear the feedback after 4 seconds to return to normal commentary
    if(!rd._decisionResultShownAt) rd._decisionResultShownAt=Date.now();
    if(Date.now()-rd._decisionResultShownAt>4000){ rd.lastDecisionResult=null; rd._decisionResultShownAt=null; }
  } else {
    middleHtml=`<div class="race-commentary">${rt.commentary[rd.commentaryIdx]||rt.commentary[rt.commentary.length-1]}</div>`;
  }

  wrap.innerHTML=`<div class="active-race">
    <div class="race-run-head"><span style="font-size:18px">${headIcon}</span><span class="race-run-name">${headName}</span><span class="race-run-timer">${remaining}s</span></div>
    <div class="race-stage-row" style="position:relative">
      <div class="race-progress-wrap" style="flex:1;position:relative">
        <div class="race-progress-bar" style="width:${Math.round(progress*100)}%"></div>
        ${pipHtml}
      </div>
    </div>
    <div class="race-legs-row">
      <span class="race-legs-label">🔥 Race Legs</span>
      <div class="race-legs-track"><div class="race-legs-fill" style="width:${legsPct}%;background:${legsCol}"></div></div>
      <span class="race-legs-val" style="color:${legsCol}">${legsPct}</span>
    </div>
    ${middleHtml}
    <div class="race-pos-row"><span>🏃 Position: <strong>${ordinal(rd.virtualPos||1)} / ${rd.result.fieldSize}</strong></span><span>${rd.result.fieldSize} riders</span></div>
  </div>`;
}

function renderRaceTypes(){
  const list=document.getElementById('race-list'); list.innerHTML='';
  const now=Date.now(), cat=RACE_CATEGORIES[state.raceCategory];
  RACE_TYPES.forEach(rt=>{
    const cdEnd=state.raceCooldowns[rt.id]||0, onCd=cdEnd>now;
    const actualCost=getWeatherEnergyCost(cat.energyCost);
    const noEnergy=state.energy<actualCost, busy=state.raceActive||state.session.active;
    const available=!onCd&&!noEnergy&&!busy;
    const equipBonus=getEquipmentBonusForRace(rt.id);
    const bonusCol=equipBonus>0?'var(--green-txt)':equipBonus<0?'var(--red-txt)':'var(--txt3)';
    const bonusBg=equipBonus>0?'var(--green-bg)':equipBonus<0?'var(--red-bg)':'var(--bg3)';
    const weightFactor=getWeightFactorForRace(rt.id);
    const weightPct=Math.round((weightFactor-1)*100);
    const showWeightBadge=(WEIGHT_SENSITIVITY[rt.id]||0)>0 && Math.abs(weightPct)>=1;
    const weightCol=weightPct>0?'var(--green-txt)':'var(--red-txt)';
    const weightBg=weightPct>0?'var(--green-bg)':'var(--red-bg)';
    // Weather score badge for this race type
    const {condition,intensity}=getDailyWeather();
    const wxBase=condition.scoreEffect[rt.id]||0;
    const wxPct=Math.round(wxBase*WEATHER_INTENSITY_MULTS[intensity]*100);
    const showWxBadge=Math.abs(wxPct)>=1;
    const wxCol=wxPct>0?'var(--green-txt)':'var(--red-txt)';
    const wxBg=wxPct>0?'var(--green-bg)':'var(--red-bg)';
    let statusHtml;
    if(onCd)      statusHtml=`<span class="race-status" style="color:var(--txt2)">⏳ ${fmtTime(cdEnd-now)}</span>`;
    else if(busy) statusHtml=`<span class="race-status" style="color:var(--txt3)">Busy</span>`;

    if(!available) div.style.opacity='0.65';
    div.innerHTML=`<div class="race-card-head"><div class="race-type-icon">${rt.icon}</div><div class="race-card-text"><div class="race-card-name">${rt.name}</div><div class="race-card-desc">${rt.desc}</div></div>${statusHtml}</div>

        <span class="race-meta-badge race-prize-badge">Prize: £${cat.prizes[cat.prizes.length-1]||0}–${fmtMoney(cat.prizes[0])}</span>
        <span class="race-meta-badge">Key: ${topStatLabel}</span>
        <span class="race-equip-bonus" style="background:${bonusBg};color:${bonusCol};padding:2px 7px;border-radius:99px;font-weight:700;font-size:10px">⚙️ ${equipBonus>0?'+':''}${equipBonus}w</span>

  });

// Chart.js instance — held in module scope so we can destroy and recreate cleanly
// when the tab re-renders (avoids the "canvas already in use" error).
let _ftpChartInstance = null;

function renderFtpChart(){
  const wrap=document.getElementById('ftp-chart-wrap'); if(!wrap) return;
  const history=state.ftpHistory||[];

  // Not enough data yet — show a friendly placeholder explaining what it tracks
  if(history.length<2){
    if(_ftpChartInstance){ _ftpChartInstance.destroy(); _ftpChartInstance=null; }
    wrap.innerHTML=`<div style="background:var(--bg);border:.5px solid var(--border);border-radius:var(--radius);padding:18px 16px;text-align:center;color:var(--txt3);font-size:12px;line-height:1.6">
      📈 Your FTP and W/kg chart will appear here as you train.<br>
      <span style="font-size:11px">Data points record every time your FTP or bodyweight changes.</span>
    </div>`;
    return;
  }

  // Format x-axis labels: if all points are from the same day, use HH:MM;
  // otherwise use short date (e.g. "19 Jun").
  const firstTs=history[0].ts, lastTs=history[history.length-1].ts;
  const spanDays=(lastTs-firstTs)/(1000*60*60*24);
  const labels=history.map(p=>{
    const d=new Date(p.ts);
    if(spanDays<1) return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    return d.toLocaleDateString([],{day:'numeric',month:'short'});
  });

  const ftpData  =history.map(p=>p.ftp);
  const pwkgData =history.map(p=>p.pwkg);
  const weightData=history.map(p=>p.weight);

  // Destroy old instance before rebuilding — avoids "canvas is already in use" errors
  if(_ftpChartInstance){ _ftpChartInstance.destroy(); _ftpChartInstance=null; }
  wrap.innerHTML=`<div style="background:var(--bg);border:.5px solid var(--border);border-radius:var(--radius);padding:10px 12px;">
    <canvas id="ftp-chart-canvas" height="200"></canvas>
    <div style="display:flex;gap:16px;justify-content:center;margin-top:8px;flex-wrap:wrap;font-size:10px;color:var(--txt3)">
      <span>🟡 FTP (watts, left axis)</span>
      <span>🟢 W/kg (right axis)</span>
      <span>🔵 Weight kg (right axis)</span>
    </div>
  </div>`;

  const canvas=document.getElementById('ftp-chart-canvas');
  if(!canvas||typeof Chart==='undefined') return;

  // Compute sensible axis mins so small FTP gains still look visually significant
  const ftpMin=Math.max(0,Math.min(...ftpData)-20);
  const ftpMax=Math.min(600,Math.max(...ftpData)+20);
  const pwkgMin=Math.max(0,Math.min(...pwkgData,Math.min(...weightData))-5);
  const pwkgMax=Math.max(...pwkgData,Math.max(...weightData))+5;

  _ftpChartInstance=new Chart(canvas,{
    type:'line',
    data:{
      labels,
      datasets:[
        {
          label:'FTP (w)',
          data:ftpData,
          borderColor:'#b8860b',
          backgroundColor:'rgba(184,134,11,0.08)',
          yAxisID:'yFtp',
          tension:0.35,
          pointRadius:ftpData.length>40?0:3,
          borderWidth:2,
          fill:true,
        },
        {
          label:'W/kg',
          data:pwkgData,
          borderColor:'#0f6e56',
          backgroundColor:'transparent',
          yAxisID:'yRight',
          tension:0.35,
          pointRadius:pwkgData.length>40?0:3,
          borderWidth:2,
          borderDash:[],
        },
        {
          label:'Weight (kg)',
          data:weightData,
          borderColor:'#185fa5',
          backgroundColor:'transparent',
          yAxisID:'yRight',
          tension:0.35,
          pointRadius:weightData.length>40?0:3,
          borderWidth:1.5,
          borderDash:[4,4],
        },
      ],
    },
    options:{
      responsive:true,
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{display:false},
        tooltip:{
          callbacks:{
            label:ctx=>{
              const labels={ftp:'FTP',pwkg:'W/kg',weight:'Weight'};
              const units={0:'w',1:'W/kg',2:'kg'};
              return ` ${ctx.dataset.label}: ${ctx.parsed.y}${units[ctx.datasetIndex]||''}`;
            },
          },
        },
      },
      scales:{
        x:{
          ticks:{font:{size:9},maxTicksLimit:8,maxRotation:0},
          grid:{color:'rgba(0,0,0,0.05)'},
        },
        yFtp:{
          position:'left',
          min:ftpMin,
          max:ftpMax,
          ticks:{font:{size:9},callback:v=>v+'w'},
          grid:{color:'rgba(0,0,0,0.05)'},
          title:{display:true,text:'FTP',font:{size:9},color:'#b8860b'},
        },
        yRight:{
          position:'right',
          min:pwkgMin,
          max:pwkgMax,
          ticks:{font:{size:9}},
          grid:{drawOnChartArea:false},
          title:{display:true,text:'W/kg · kg',font:{size:9},color:'#0f6e56'},
        },
      },
    },
  });
}

function renderRiderStats(){
  const container=document.getElementById('rider-stats'), rs=getRiderStats();
  const ftpPct=Math.round(rs.ftp/MAX_FTP*100);
  const ftpMaxed=rs.ftp>=MAX_FTP;

  // FTP is built from three attributes at different weights — show each one's XP
  // progress toward its next level, and exactly how many extra watts that level will add.
  const FTP_CONTRIBUTORS=[
    {attr:'endurance', base:14},
    {attr:'power',     base:16},
    {attr:'threshold', base:20},
  ];
  const rouleurMult = state.specialisation==='rouleur' ? 1.10 : 1;
  const ftpContribHtml = FTP_CONTRIBUTORS.map(c=>{
    const def=ATTR_DEFS[c.attr], a=state.attributes[c.attr], cv=def.colorVar;
    const needed=xpForLevel(a.level), pct=needed>0?Math.min(100,Math.round(a.xp/needed*100)):100;
    const gain=Math.round(c.base*rouleurMult);
    return `<div class="ftp-contrib-item">
      <span class="ftp-contrib-icon">${def.icon}</span>
      <span class="ftp-contrib-label">${def.name}</span>
      <div class="ftp-contrib-bar-wrap"><div class="ftp-contrib-bar" style="width:${pct}%;background:var(--${cv}-txt)"></div></div>
      <span class="ftp-contrib-gain" style="color:var(--${cv}-txt)">${ftpMaxed?'MAXED':'+'+gain+'w'}</span>
    </div>`;
  }).join('');

  // VO2 Max and Sprint Power are each driven by a single attribute — show progress
  // toward that attribute's next level (i.e. "how close to improving") rather than
  // progress toward the absolute elite cap, which wasn't actionable info.
  const vo2A=state.attributes.vo2, vo2Needed=xpForLevel(vo2A.level);
  const vo2Pct=vo2Needed>0?Math.min(100,Math.round(vo2A.xp/vo2Needed*100)):100;
  const vo2Maxed=rs.vo2max>=MAX_VO2;

  const sprA=state.attributes.sprint, sprNeeded=xpForLevel(sprA.level);
  const sprPct=sprNeeded>0?Math.min(100,Math.round(sprA.xp/sprNeeded*100)):100;
  const sprMaxed=rs.sprintPower>=MAX_SPRINT;

  const smallStats=[
    {label:'VO₂ Max',val:rs.vo2max,unit:'ml/kg',
     sublabel:vo2Maxed?'Elite cap reached':`Lv${vo2A.level} → +5.5 next lvl`,
     pct:vo2Pct,colorVar:'red',icon:'🔥'},
    {label:'Sprint Power',val:rs.sprintPower,unit:'w',
     sublabel:sprMaxed?'Elite cap reached':`Lv${sprA.level} → +170w next lvl`,
     pct:sprPct,colorVar:'purple',icon:'⚡'},
    {label:'Race Bonus',val:`+${getEquipmentBonusForRace('road')}w`,unit:'',sublabel:'Gear (road)',pct:Math.min(100,Math.round(getEquipmentBonusForRace('road')/80*100)),colorVar:'teal',icon:'⚙️'},
  ];

  // Power-to-weight — the headline real-world cycling metric. Shown as its own
  // secondary hero card since it matters as much as raw FTP, especially for climbing.
  const pw=getPowerToWeight();
  const weightDelta=state.riderWeight-DEFAULT_RIDER_WEIGHT;
  const pwDeltaHtml=weightDelta>0.05
    ? `<span style="color:var(--red-txt)">+${weightDelta.toFixed(1)}kg vs default — hurts climbs</span>`
    : weightDelta<-0.05
      ? `<span style="color:var(--green-txt)">${weightDelta.toFixed(1)}kg vs default — helps climbs</span>`
      : `<span style="color:var(--txt3)">at default weight</span>`;

  container.innerHTML=`<div class="rsc-ftp-hero">
      <div class="rsc-ftp-icon">🏆</div>
      <div class="rsc-ftp-body">
        <div class="rsc-ftp-num">${rs.ftp}<span style="font-size:18px;font-weight:500">w</span></div>
        <div class="rsc-ftp-sub">Functional Threshold Power · Target ${MAX_FTP}w</div>
        <div class="rsc-ftp-bar-wrap"><div class="rsc-ftp-bar" style="width:${ftpPct}%"></div></div>
      </div>
      <div style="font-size:13px;font-weight:700;color:var(--amber-txt)">${ftpPct}%</div>
    </div>
    <div class="pw-hero">
      <div class="pw-hero-icon">⚖️</div>
      <div class="pw-hero-body">
        <div class="pw-hero-num">${pw.toFixed(2)}<span style="font-size:14px;font-weight:500">W/kg</span></div>
        <div class="pw-hero-sub">Power-to-Weight · ${state.riderWeight.toFixed(1)}kg bodyweight · ${pwDeltaHtml}</div>
      </div>
    </div>
    <div class="ftp-contrib-wrap">
      <div class="ftp-contrib-title">Progress to next FTP increase</div>
      ${ftpContribHtml}
    </div>
    <div class="rider-stats-grid">
      ${smallStats.map(s=>`<div class="rider-stat-card" style="border-color:var(--${s.colorVar}-bd);background:var(--${s.colorVar}-bg)">
        <div class="rsc-icon">${s.icon}</div>
        <div class="rsc-val" style="color:var(--${s.colorVar}-txt)">${s.val}<span class="rsc-unit">${s.unit}</span></div>
        <div class="rsc-label">${s.label}</div>
        <div class="rsc-bar-wrap"><div class="rsc-bar" style="width:${Math.max(0,Math.min(100,s.pct))}%;background:var(--${s.colorVar}-txt)"></div></div>
        <div class="rsc-sublabel">${s.sublabel}</div>
      </div>`).join('')}
    </div>`;
}

// FIX 1: buildEquipCard — removed spurious third stat-bar block that caused duplicate
// aero bars on kit items (fired when maxAero was defined AND maxClimb was undefined)
function buildEquipCard({icon,brand,model,name,tier,type,desc,price,aeroWatts,climbWatts,owned,equipped,onBuy,onEquip,maxAero,maxClimb}){
  const div=document.createElement('div');
  div.className='equip-card'+(equipped?' equipped':'')+(owned?' owned':price<=state.money?' affordable':' cant-afford');

  const tierCls=`tier-${tier}`, tierLabel=['','I','II','III','IV','V'][tier];
  const typeLabels={allrounder:'All-rounder',aero:'Aero',climbing:'Climbing',tt:'Time Trial',standard:'Standard',racing:'Racing',deep:'Deep Section',disc:'Disc',road:'Road',skinsuit:'Skinsuit'};
  const typeLabel=type?typeLabels[type]||type:'';
  const priceStr=price===0?'Free':fmtMoney(price);

  // Stat bars — each axis rendered independently, no overlap
  let statBarsHtml='';
  if(maxAero!==undefined){
    const aeroPct=Math.max(0,Math.min(100,Math.round((aeroWatts/maxAero)*100)));
    const aeroCol=aeroWatts<0?'var(--red-txt)':'var(--blue-txt)';
    statBarsHtml+=`<div class="stat-bar-row"><span class="stat-bar-lbl">Aero</span><div class="stat-bar-outer"><div class="stat-bar-inner" style="width:${Math.max(0,aeroPct)}%;background:${aeroCol}"></div></div><span class="stat-bar-val" style="color:${aeroCol}">${aeroWatts>0?'+':''}${aeroWatts}w</span></div>`;
  }
  if(maxClimb!==undefined){
    const climbPct=Math.max(0,Math.min(100,Math.round((climbWatts/maxClimb)*100)));
    const climbCol=climbWatts<0?'var(--red-txt)':'var(--teal-txt)';
    statBarsHtml+=`<div class="stat-bar-row"><span class="stat-bar-lbl">Climb</span><div class="stat-bar-outer"><div class="stat-bar-inner" style="width:${Math.max(0,climbPct)}%;background:${climbCol}"></div></div><span class="stat-bar-val" style="color:${climbCol}">${climbWatts>0?'+':''}${climbWatts}w</span></div>`;
  }
  // (removed duplicate aero block that was here — was firing on kits alongside block 1)

  let actionHtml='';
  if(equipped){
    actionHtml=`<div class="equip-price owned">${priceStr}</div><button class="equip-btn btn-equipped">✓ Equipped</button>`;
  } else if(owned){
    actionHtml=`<div class="equip-price owned">Owned</div><button class="equip-btn btn-equip" data-equip="1">Equip</button>`;
  } else if(price<=state.money){
    actionHtml=`<div class="equip-price affordable">${priceStr}</div><button class="equip-btn btn-buy" data-buy="1">Buy</button>`;
  } else {
    actionHtml=`<div class="equip-price">${priceStr}</div><button class="equip-btn btn-locked">🔒 Buy</button>`;
  }

  div.innerHTML=`<div class="equip-head">
    <div class="equip-main">
      ${brand?`<div class="equip-brand">${brand}</div>`:''}
      <div class="equip-model">${model||name}</div>
      <div class="equip-desc">${desc}</div>
      <div class="equip-badges"><span class="tier-badge ${tierCls}">Tier ${tierLabel}</span>${typeLabel?`<span class="type-badge">${typeLabel}</span>`:''}</div>
      ${statBarsHtml?`<div class="stat-bars">${statBarsHtml}</div>`:''}
    </div>
    <div class="equip-action-col">${actionHtml}</div>
  </div>`;

  if(!owned&&price<=state.money) div.querySelector('[data-buy]')?.addEventListener('click', onBuy);
  if(owned&&!equipped)           div.querySelector('[data-equip]')?.addEventListener('click', onEquip);
  return div;
}

let sponsorViewMode='active'; // 'active' (showing signed sponsor) | 'choosing' (showing tier choice cards)

function setSponsorViewMode(mode){ sponsorViewMode=mode; renderSponsorsTab(); }

function renderSponsorsTab(){
  const wrap=document.getElementById('sponsors-content'); if(!wrap) return;
  const wins=totalWins(), tierIdx=getCurrentSponsorTierIndex();

  // ── Termination cooldown ──────────────────────────────────────
  const terminateMsLeft=getSponsorTerminateCooldownRemaining();
  if(terminateMsLeft>0){
    const daysLeft=Math.ceil(terminateMsLeft/(24*60*60*1000));
    const hrsLeft=Math.ceil(terminateMsLeft/(60*60*1000));
    const label=daysLeft>1?`${daysLeft} days`:`${hrsLeft} hours`;
    wrap.innerHTML=`<div class="lifetime-placeholder">
      <div class="lifetime-placeholder-icon">⏳</div>
      <strong style="color:var(--txt2)">Cooling-Off Period</strong><br><br>
      You terminated your last contract. No sponsor will sign you for another
      <strong style="color:var(--red-txt)">${label}</strong>.<br><br>
      <span style="font-size:11px;color:var(--txt3)">Use this time to keep racing and building your win count.</span>
    </div>`;
    return;
  }

  // ── Not yet eligible ────────────────────────────────────────
  if(tierIdx<0){
    const need=SPONSOR_TIERS[0].winsRequired;
    const pct=Math.min(100,Math.round(wins/need*100));
    wrap.innerHTML=`<div class="lifetime-placeholder">
      <div class="lifetime-placeholder-icon">🔒</div>
      <strong style="color:var(--txt2)">Sponsorship Locked</strong><br><br>
      Win races to attract sponsor attention. Your first local sponsorship unlocks at <strong>${need} wins</strong>.
      <div class="cat-bar-outer" style="margin-top:1rem"><div class="cat-bar-inner" style="width:${pct}%;background:var(--amber-txt)"></div></div>
      <div style="margin-top:.4rem;font-size:12px;color:var(--txt3)">${wins} / ${need} wins</div>
    </div>`;
    return;
  }

  const activeInfo=getActiveSponsorDef();

  // ── No active sponsor — show sign-up choices ─────────────────
  if(!activeInfo){
    if(sponsorViewMode==='choosing') renderSponsorChoices(wrap, tierIdx, false);
    else wrap.innerHTML=sponsorReadyCardHtml(tierIdx);
    return;
  }

  // ── Upgrade available — show choosing screen if selected ─────
  const upgradeAvailable=canUpgradeSponsor();
  if(upgradeAvailable && sponsorViewMode==='choosing'){
    renderSponsorChoices(wrap, tierIdx, true);
    return;
  }

  renderActiveSponsorView(wrap, activeInfo, upgradeAvailable, tierIdx);
}

    <strong style="color:var(--txt2)">Sponsorship Locked</strong><br><br>

function renderSponsorChoices(wrap, tierIdx, isUpgrade){
  const tierObj=SPONSOR_TIERS[tierIdx];
  const backBtn = isUpgrade ? `<button class="gear-nav-btn" style="margin-bottom:.6rem" onclick="setSponsorViewMode('active')">← Back to current sponsor</button>` : '';
  const introHtml = isUpgrade
    ? `<div style="font-size:12px;color:var(--txt2);margin-bottom:.6rem;line-height:1.5">🎉 A new tier of sponsorship has opened up — <strong>${tierObj.label}</strong>. Choose your next partner:</div>`
    : `<div style="font-size:12px;color:var(--txt2);margin-bottom:.6rem;line-height:1.5">Choose your sponsor. Once signed, you're locked in until your next tier unlocks.</div>`;
  const cardsHtml=tierObj.sponsors.map(s=>{
    const objLines=s.objectives.map(o=>`<div class="sponsor-obj-preview">${o.icon} ${o.label} → <strong style="color:var(--green-txt)">${fmtMoney(o.reward)}</strong></div>`).join('');
    const signKey='sign:'+tierIdx+':'+s.id;
    const signPending=sponsorActionPending===signKey;
    const signBtnHtml=signPending
      ? `<button class="spec-btn cal-signup-confirm" onclick="signSponsor(${tierIdx},'${s.id}')">✓ Confirm — resets weekly progress + 24hr cooldown · tap again</button>`
      : `<button class="spec-btn spec-btn-unlock" onclick="signSponsor(${tierIdx},'${s.id}')">Sign with ${s.name}</button>`;
    return `<div class="spec-choice-card unlocked" style="border-color:var(--${s.color}-bd)">
      <div class="spec-choice-head">
        <div class="spec-choice-icon">${s.icon}</div>
        <div class="spec-choice-info">
          <div class="spec-choice-name">${s.name}</div>
          <div class="spec-choice-desc">${s.tagline}</div>
        </div>
      </div>
      <div>${objLines}</div>
      <div class="sponsor-bonus-preview">🎁 Weekly Bonus (all 3 complete): <strong style="color:var(--amber-txt)">${fmtMoney(s.weeklyBonus)}</strong></div>
      ${signBtnHtml}
    </div>`;
  }).join('');
  wrap.innerHTML=backBtn+introHtml+`<div class="spec-choice-grid">${cardsHtml}</div>`;
}

function renderActiveSponsorView(wrap, activeInfo, upgradeAvailable, qualifiedTierIdx){
  const {sponsor,tier}=activeInfo, cv=sponsor.color;

  // ── Upgrade banner ──────────────────────────────────────────
  const upgradeBannerHtml = upgradeAvailable
    ? `<div class="alert-banner">
        <span class="alert-banner-text">🎉 ${SPONSOR_TIERS[qualifiedTierIdx].label} sponsors are now interested in you!</span>
        <button class="claim-all-btn" onclick="setSponsorViewMode('choosing')">🔍 View Options</button>
      </div>`
    : '';

  // ── Weekly objectives ───────────────────────────────────────
  const objCardsHtml=sponsor.objectives.map(o=>{
    const cur=Math.min(o.target, state.sponsor.progress[o.type]||0);
    const pct=Math.round(cur/o.target*100);
    const claimed=state.sponsor.claimed[o.id];
    const ready=!claimed && cur>=o.target;
    let statusHtml;
    if(claimed)    statusHtml=`<span class="task-check" style="color:var(--green-txt)">✅</span>`;
    else if(ready) statusHtml=`<button class="task-claim-btn" onclick="claimSponsorObjective('${o.id}')">Claim</button>`;
    else           statusHtml=`<span style="font-size:12px;color:var(--txt3);font-weight:600">${cur} / ${o.target}</span>`;
    return `<div class="task-card ${claimed?'claimed':ready?'done-unclaimed':''}">
      <div class="task-icon">${o.icon}</div>
      <div class="task-info">
        <div class="task-name">${o.label}</div>
        <div class="rsc-bar-wrap" style="margin-top:6px"><div class="rsc-bar" style="width:${pct}%;background:var(--${cv}-txt)"></div></div>
        <div class="task-reward">Reward: ${fmtMoney(o.reward)}</div>
      </div>
      <div class="task-status">${statusHtml}</div>
    </div>`;
  }).join('');

  // ── Weekly bonus ────────────────────────────────────────────
  const allClaimed=sponsor.objectives.every(o=>state.sponsor.claimed[o.id]);
  const bonusHtml=`<div class="growth-summary" style="margin-top:.5rem">
    <div>
      <div class="growth-summary-label">🎁 Weekly Bonus</div>
      <div class="growth-summary-sub">${state.sponsor.bonusClaimed?'Claimed this week':allClaimed?'All objectives complete — claim your bonus!':'Complete all 3 objectives to unlock'}</div>
    </div>
    <button class="claim-all-btn" onclick="claimSponsorBonus()" ${(allClaimed&&!state.sponsor.bonusClaimed)?'':'disabled'}>${state.sponsor.bonusClaimed?'Claimed':fmtMoney(sponsor.weeklyBonus)}</button>
  </div>`;

  const weekMsRemaining=Math.max(0,7*24*60*60*1000-(Date.now()-state.sponsor.weekStart));
  const daysRemaining=Math.max(0,Math.ceil(weekMsRemaining/(24*60*60*1000)));

  // ── Lateral switch panel — other sponsor at same tier ──────
  const lateralSponsor=getLateralSponsor();
  const lateralCdLeft=getSponsorLateralCooldownRemaining();
  const lateralHtml=lateralSponsor ? `
    <div style="border:.5px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-top:.75rem;background:var(--bg)">
      <div style="font-size:12px;font-weight:700;color:var(--txt2);margin-bottom:6px">🔄 Switch Sponsor (same tier)</div>
      <div style="font-size:11px;color:var(--txt3);line-height:1.5;margin-bottom:8px">
        Switch to <strong>${lateralSponsor.name}</strong> ${lateralSponsor.icon} within your current <strong>${tier.label}</strong> tier.
        Weekly progress resets and there's a 24-hour cooldown before switching again.
      </div>
      ${lateralCdLeft>0
        ? `<div style="font-size:11px;color:var(--amber-txt);font-weight:600">⏳ Can switch again in ${Math.ceil(lateralCdLeft/(60*60*1000))}h</div>`
        : sponsorActionPending===('lateral:'+lateralSponsor.id)
          ? `<button onclick="lateralSwitchSponsor('${lateralSponsor.id}')"
              class="cal-signup-confirm"
              style="font-size:11px;font-weight:700;padding:7px 14px;border-radius:var(--radius);cursor:pointer;width:100%">
              ✓ Confirm switch to ${lateralSponsor.name} — resets weekly progress · tap again
            </button>`
          : `<button onclick="lateralSwitchSponsor('${lateralSponsor.id}')"
              style="font-size:11px;font-weight:700;padding:7px 14px;border-radius:var(--radius);border:.5px solid var(--border);background:var(--bg2);cursor:pointer;color:var(--txt)">
              Switch to ${lateralSponsor.name}
            </button>`
      }
    </div>` : '';

  // ── Terminate contract ──────────────────────────────────────
  const terminatePending=sponsorActionPending==='terminate';
  const terminateHtml=`
    <div style="border:.5px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-top:.75rem;background:var(--bg)">
      <div style="font-size:12px;font-weight:700;color:var(--txt2);margin-bottom:4px">⚠️ Terminate Contract</div>
      <div style="font-size:11px;color:var(--txt3);line-height:1.5;margin-bottom:8px">
        Walk away from <strong>${sponsor.name}</strong>. You'll enter a <strong style="color:var(--red-txt)">3-day cooling-off period</strong>
        during which no sponsor will sign you. All unclaimed rewards are forfeited.
      </div>
      ${terminatePending
        ? `<button onclick="terminateSponsor()"
            style="font-size:11px;font-weight:700;padding:7px 14px;border-radius:var(--radius);cursor:pointer;width:100%;background:var(--red-txt);color:#fff;border:none">
            ⚠️ Confirm termination — 3-day lockout · tap again
          </button>`
        : `<button onclick="terminateSponsor()"
            style="font-size:11px;font-weight:700;padding:7px 14px;border-radius:var(--radius);border:.5px solid var(--red-bd);background:var(--red-bg);cursor:pointer;color:var(--red-txt)">
            Terminate Contract
          </button>`
      }
    </div>`;

  wrap.innerHTML=`
    ${upgradeBannerHtml}
    <div class="spec-banner" style="background:var(--${cv}-bg);border-color:var(--${cv}-bd);color:var(--${cv}-txt)">
      <div class="spec-banner-icon">${sponsor.icon}</div>
      <div class="spec-banner-body">
        <div class="spec-banner-label">${tier.label} Sponsor</div>
        <div class="spec-banner-name">${sponsor.name}</div>
        <div class="spec-banner-desc">${sponsor.tagline}</div>
      </div>
    </div>
    <div class="sponsor-week-remaining">~${daysRemaining}d until objectives reset</div>
    ${objCardsHtml}
    ${bonusHtml}
    ${lateralHtml}
    ${terminateHtml}
    <div style="text-align:center;margin-top:.75rem;font-size:11px;color:var(--txt3)">Lifetime sponsor earnings: <strong style="color:var(--green-txt)">${fmtMoney(state.sponsor.totalEarned||0)}</strong></div>
  `;
}

let calendarShowHistory=false;
let calendarSignupPending=null; // eventId waiting for second-tap confirmation
let calendarSignupTimer=null;   // handle to auto-cancel pending confirm after 4s
let sponsorActionPending=null;  // 'terminate' | 'lateral:id' | 'sign:tierIdx:id'

function toggleCalendarHistory(){ calendarShowHistory=!calendarShowHistory; renderCalendarTab(); }

function renderCalendarTab(){
  const wrap=document.getElementById('calendar-content'); if(!wrap) return;

  if(!isCalendarUnlocked()){
    const cat=RACE_CATEGORIES[state.raceCategory];
    const semiProCat=RACE_CATEGORIES[CALENDAR_TIER_UNLOCK_CAT.semipro];
    wrap.innerHTML=`<div class="lifetime-placeholder">
      <div class="lifetime-placeholder-icon">🔒</div>
      <strong style="color:var(--txt2)">Calendar Locked</strong><br><br>
      Major Events unlock once you reach <strong>${semiProCat.name} (Semi-Pro)</strong>.
      National championships and — once you turn fully Pro — the Grand Tours will appear here.
      <div style="margin-top:1rem;font-size:12px;color:var(--txt3)">Currently racing as: <strong>${cat.name}</strong></div>
    </div>`;
    return;
  }

  ensureCalendarSeasonStarted();

  const daysRemaining=getCalendarDaysRemaining();
  const slotLimit=getCalendarSlotLimit();
  const slotsUsed=state.calendar.signups.length;
  const events=getAvailableCalendarEvents();

  const signedUpUnraced = events.filter(e=>state.calendar.signups.includes(e.id) && !state.calendar.completed[e.id]);
  const signedUpAndRaced = events.filter(e=>state.calendar.signups.includes(e.id) && state.calendar.completed[e.id]);
  const notSignedUp = events.filter(e=>!state.calendar.signups.includes(e.id));

  const seasonHeaderHtml=`<div class="cal-season-header">
    <div>
      <div class="cal-season-title">📅 Calendar Season</div>
      <div class="cal-season-sub">${daysRemaining} day${daysRemaining!==1?'s':''} remaining this month</div>
    </div>
    <div class="cal-slots-badge">${slotsUsed} / ${slotLimit} slots used</div>
  </div>`;

  const scheduleHtml = signedUpUnraced.length ? `
    <div class="section-lbl">Your Season Schedule</div>
    ${signedUpUnraced.map(ev=>calendarEventCardHtml(ev,'scheduled')).join('')}
  ` : '';

  const completedHtml = signedUpAndRaced.length ? `
    <div class="section-lbl" style="margin-top:.75rem">Completed This Season</div>
    ${signedUpAndRaced.map(ev=>{
      const r=state.calendar.completed[ev.id];
      const posCls=r.position===1?'pos-1':r.position===2?'pos-2':r.position===3?'pos-3':'pos-other';
      return `<div class="cal-result-row">
        <div class="result-pos-badge ${posCls}" style="width:40px;height:40px;font-size:14px">${ordinal(r.position)}</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:700">${ev.icon} ${ev.name}</div>
          <div style="font-size:11px;color:var(--txt2)">${r.position} of ${r.fieldSize} riders</div>
        </div>
        <div style="font-weight:700;color:${r.prize>0?'var(--green-txt)':'var(--txt3)'};font-size:13px">${r.prize>0?'+'+fmtMoney(r.prize):'No prize'}</div>
      </div>`;
    }).join('')}
  ` : '';

  const signupHtml = notSignedUp.length ? `
    <div class="section-lbl" style="margin-top:.75rem">Sign Up — ${slotsUsed>=slotLimit?'No slots remaining':`${slotLimit-slotsUsed} slot${slotLimit-slotsUsed!==1?'s':''} open`}</div>
    ${notSignedUp.map(ev=>calendarEventCardHtml(ev,'signup')).join('')}
  ` : '';

  const historyHtml = state.calendar.history.length ? `
    <div style="text-align:center;margin-top:1rem">
      <button class="gear-nav-btn" onclick="toggleCalendarHistory()">${calendarShowHistory?'Hide':'Show'} Event History (${state.calendar.history.length} past season${state.calendar.history.length!==1?'s':''})</button>
    </div>
    ${calendarShowHistory ? state.calendar.history.map((season,i)=>`
      <div style="margin-top:.6rem">
        <div class="section-lbl">Season ended ${new Date(season.seasonEndedAt).toLocaleDateString()}</div>
        ${season.results.length ? season.results.map(r=>{
          const posCls=r.position===1?'pos-1':r.position===2?'pos-2':r.position===3?'pos-3':'pos-other';
          return `<div class="cal-result-row">
            <div class="result-pos-badge ${posCls}" style="width:36px;height:36px;font-size:12px">${ordinal(r.position)}</div>
            <div style="flex:1;min-width:0"><div style="font-size:12px;font-weight:700">${r.eventIcon} ${r.eventName}</div><div style="font-size:10px;color:var(--txt2)">${r.position} of ${r.fieldSize}</div></div>
            <div style="font-weight:700;color:${r.prize>0?'var(--green-txt)':'var(--txt3)'};font-size:12px">${r.prize>0?'+'+fmtMoney(r.prize):'—'}</div>
          </div>`;
        }).join('') : `<div style="font-size:11px;color:var(--txt3);padding:.5rem 0">No events raced this season.</div>`}
        ${season.forfeitedCount>0?`<div style="font-size:10px;color:var(--red-txt);margin-top:2px">${season.forfeitedCount} event${season.forfeitedCount!==1?'s':''} forfeited (signed up but not raced)</div>`:''}
      </div>
    `).join('') : ''}
  ` : '';

  wrap.innerHTML = seasonHeaderHtml + scheduleHtml + completedHtml + signupHtml + historyHtml;
}

function calendarEventCardHtml(ev, mode){
  const tierColor = ev.tier==='pro' ? 'amber' : 'purple';
  const tierLabel = ev.tier==='pro' ? 'PRO' : 'SEMI-PRO';
  const proLocked = ev.tier==='pro' && !isProTierUnlocked();
  const prizeStr = `1st ${fmtMoney(ev.prizes[0])} · 2nd ${fmtMoney(ev.prizes[1])} · 3rd ${fmtMoney(ev.prizes[2])}`;

  let actionHtml;
  if(mode==='scheduled'){
    const busy=state.raceActive||state.session.active;
    const noEnergy=state.energy<ev.energyCost;
    actionHtml=`<button class="cal-start-btn" onclick="startCalendarEvent('${ev.id}')" ${(busy||noEnergy)?'disabled':''} style="${(busy||noEnergy)?'opacity:.5;cursor:default':''}">
      🏁 Start Event ${noEnergy?`(need ${ev.energyCost}⚡)`:''}
    </button>`;
  } else {
    const slotsFull=state.calendar.signups.length>=getCalendarSlotLimit();
    const cantAfford=state.money<ev.entryFee;
    const disabled=proLocked||slotsFull||cantAfford;
    const isPending=calendarSignupPending===ev.id;
    if(isPending){
      actionHtml=`<button class="cal-signup-btn cal-signup-confirm" onclick="signUpForCalendarEvent('${ev.id}')">✓ Confirm — ${fmtMoney(ev.entryFee)} entry · tap again to lock in</button>`;
    } else {
      const label=proLocked?'🔒 Reach Pro to unlock':slotsFull?'No slots remaining':cantAfford?`Need ${fmtMoney(ev.entryFee)}`:`Sign Up — ${fmtMoney(ev.entryFee)} entry`;
      actionHtml=`<button class="cal-signup-btn" onclick="signUpForCalendarEvent('${ev.id}')" ${disabled?'disabled':''}>${label}</button>`;
    }
  }

  return `<div class="cal-event-card">
    <div class="cal-event-head">
      <div class="cal-event-icon">${ev.icon}</div>
      <div class="cal-event-info">
        <div class="cal-event-name">${ev.name}<span class="cal-event-tierbadge" style="background:var(--${tierColor}-bg);color:var(--${tierColor}-txt);border:.5px solid var(--${tierColor}-bd)">${tierLabel}</span></div>
        <div class="cal-event-desc">${ev.desc}</div>
      </div>
    </div>
    <div class="cal-event-meta">
      <div class="cal-event-meta-item">Entry: <span class="cal-event-meta-val">${fmtMoney(ev.entryFee)}</span></div>
      <div class="cal-event-meta-item">Energy: <span class="cal-event-meta-val">${ev.energyCost}⚡</span></div>
      <div class="cal-event-meta-item">Field: <span class="cal-event-meta-val">${ev.fieldSize} riders</span></div>
    </div>
    <div class="cal-event-prizes">💰 ${prizeStr}</div>
    ${actionHtml}
  </div>`;
}
