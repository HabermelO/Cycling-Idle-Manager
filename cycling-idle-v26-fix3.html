function saveGame(){
  try{
    const attrs={};
    ATTR_ORDER.forEach(id=>{ attrs[id]={xp:state.attributes[id].xp,level:state.attributes[id].level}; });
    localStorage.setItem(SAVE_KEY,JSON.stringify({
      money:state.money, seasonMoney:state.seasonMoney, lifetimeMoney:state.lifetimeMoney,
      season:state.season, seasonsCompleted:state.seasonsCompleted, prestigeMult:state.prestigeMult,
      energy:state.energy, maxEnergy:state.maxEnergy, lastEnergyReset:state.lastEnergyReset,
      bought:[...state.boughtUpgrades], attributes:attrs,
      trainCooldowns:state.trainCooldowns, raceCooldowns:state.raceCooldowns,
      raceCategory:state.raceCategory, categoryPoints:state.categoryPoints,
      raceHistory:state.raceHistory, lastRaceResult:state.lastRaceResult,
      equippedBike:state.equippedBike, ownedBikes:[...state.ownedBikes],
      equippedWheels:state.equippedWheels, ownedWheels:[...state.ownedWheels],
      equippedKit:state.equippedKit, ownedKits:[...state.ownedKits],
      equippedKitColor:state.equippedKitColor,
      unlockedKitColors:[...state.unlockedKitColors],
      earnedAchievements:[...state.earnedAchievements],
      totalRaces:state.totalRaces, totalPodiums:state.totalPodiums,
      raceWinsByType:state.raceWinsByType,
      specialisation:state.specialisation,
      energyInventory:state.energyInventory,
      lastDailyBar:state.lastDailyBar,
      dailyMarket:state.dailyMarket,
      energySpentToday:state.energySpentToday,
      todayEnergyAllocation:state.todayEnergyAllocation,
      riderWeight:state.riderWeight,
      carbsToday:state.carbsToday,
      carbWarningShownToday:state.carbWarningShownToday,
      dailyTasks:state.dailyTasks,
      sponsor:state.sponsor,
      calendar:state.calendar,
      ftpHistory:state.ftpHistory,
      loginStreak:state.loginStreak,
      lastLoginDate:state.lastLoginDate,
      pendingMorningReward:state.pendingMorningReward,
      pendingSession:state.session.awaitingCollection
        ? {typeId:state.session.typeId, pendingXP:state.session.pendingXP||[], isCritical:!!state.session.isCritical}
        : null,
      lastSavedAt:Date.now(),
    }));
  }catch(e){ console.warn('[CIM] Save failed:',e); }
}

function loadGame(){
  try{
    const raw=localStorage.getItem(SAVE_KEY); if(!raw) return;
    const d=JSON.parse(raw);
    state.money=d.money||0; state.seasonMoney=d.seasonMoney||0; state.lifetimeMoney=d.lifetimeMoney||0;
    state.season=d.season||1; state.seasonsCompleted=d.seasonsCompleted||0; state.prestigeMult=d.prestigeMult||1;
    state.energy=d.energy??DAILY_ENERGY; state.maxEnergy=d.maxEnergy||DAILY_ENERGY; state.lastEnergyReset=d.lastEnergyReset||0;
    state.boughtUpgrades=new Set(d.bought||[]); state.trainCooldowns=d.trainCooldowns||{}; state.raceCooldowns=d.raceCooldowns||{};
    state.raceCategory=d.raceCategory||0; state.categoryPoints=d.categoryPoints||0;
    state.raceHistory=d.raceHistory||[]; state.lastRaceResult=d.lastRaceResult||null; state._lastSavedAt=d.lastSavedAt||0;
    state.equippedBike   = d.equippedBike   || 'starter';
    state.ownedBikes     = new Set(d.ownedBikes   || ['starter']);
    state.equippedWheels = d.equippedWheels || 'training';
    state.ownedWheels    = new Set(d.ownedWheels  || ['training']);
    state.equippedKit    = d.equippedKit    || 'club_jersey';
    state.ownedKits      = new Set(d.ownedKits    || ['club_jersey']);
    state.equippedKitColor   = d.equippedKitColor   || 'default';
    state.unlockedKitColors  = new Set(d.unlockedKitColors || ['default']);
    state.earnedAchievements = new Set(d.earnedAchievements || []);
    state.totalRaces    = d.totalRaces    || 0;
    state.totalPodiums  = d.totalPodiums  || 0;
    state.raceWinsByType= d.raceWinsByType|| {crit:0,road:0,tt:0,hill:0};
    state.specialisation= d.specialisation|| null;
    // energyInventory format changed from {itemId: count} to an array of purchased
    // instances (each with its own locked-in benefit + purchase date for perishing).
    // Old saves are migrated here: each old count becomes that many fresh instances
    // using the item's base stats, timestamped "now" so they don't immediately spoil.
    if(Array.isArray(d.energyInventory)){
      state.energyInventory = d.energyInventory;
    } else if(d.energyInventory && typeof d.energyInventory==='object'){
      const migrated=[];
      Object.entries(d.energyInventory).forEach(([itemType,count])=>{
        const baseItem=ENERGY_ITEMS.find(i=>i.id===itemType);
        if(baseItem) for(let i=0;i<(count||0);i++){
          migrated.push({id:'inv_migrated_'+itemType+'_'+i, itemType, energy:baseItem.energy, fatigueRecovery:baseItem.fatigueRecovery, purchasedAt:Date.now()});
        }
      });
      state.energyInventory = migrated;
    } else {
      state.energyInventory = [];
    }
    state.dailyMarket = d.dailyMarket || {dayKey:'', items:{}};
    state.lastDailyBar   = d.lastDailyBar   || 0;
    state.energySpentToday = d.energySpentToday || 0;
    // Fallback for saves predating this field: use maxEnergy so a returning player's
    // current energy isn't suddenly truncated mid-session. The fatigue-adjusted cap
    // takes effect correctly from their next daily reset onward.
    state.todayEnergyAllocation = d.todayEnergyAllocation ?? state.maxEnergy;
    state.riderWeight = d.riderWeight ?? DEFAULT_RIDER_WEIGHT;
    state.carbsToday = d.carbsToday || 0;
    state.carbWarningShownToday = d.carbWarningShownToday || false;
    // Defensive merge: if new task ids are added in a future update, fill in defaults
    // for any keys missing from an older save rather than crashing or losing state.
    const defaultProgress=Object.fromEntries(DAILY_TASKS.map(t=>[t.id,false]));
    const defaultClaimed =Object.fromEntries(DAILY_TASKS.map(t=>[t.id,false]));
    state.dailyTasks = {
      resetDate: d.dailyTasks?.resetDate || 0,
      progress:  {...defaultProgress, ...(d.dailyTasks?.progress||{})},
      claimed:   {...defaultClaimed,  ...(d.dailyTasks?.claimed ||{})},
    };
    state.sponsor = {
      activeId:      d.sponsor?.activeId ?? null,
      activeTierIdx: d.sponsor?.activeTierIdx ?? -1,
      weekStart:     d.sponsor?.weekStart || 0,
      progress:      d.sponsor?.progress || {win_races:0,enter_races:0,podiums:0,sessions:0,prize_money:0},
      claimed:       d.sponsor?.claimed || {},
      bonusClaimed:  d.sponsor?.bonusClaimed || false,
      totalEarned:   d.sponsor?.totalEarned || 0,
      terminatedAt:  d.sponsor?.terminatedAt || 0,
      lateralCooldownUntil: d.sponsor?.lateralCooldownUntil || 0,
    };
    state.calendar = {
      seasonStartDate: d.calendar?.seasonStartDate || 0,
      signups:          d.calendar?.signups   || [],
      completed:        d.calendar?.completed || {},
      history:          d.calendar?.history   || [],
    };
    state.ftpHistory = Array.isArray(d.ftpHistory) ? d.ftpHistory : [];
    state.loginStreak          = d.loginStreak          || 0;
    state.lastLoginDate        = d.lastLoginDate        || null;
    state.pendingMorningReward = d.pendingMorningReward || null;
    // Restore any session that completed but hadn't been collected before the page closed
    if(d.pendingSession){
      state.session={active:true, typeId:d.pendingSession.typeId,
        awaitingCollection:true, pendingXP:d.pendingSession.pendingXP||[],
        isCritical:!!d.pendingSession.isCritical,
        startTime:Date.now(), duration:0};
    }
    if(d.attributes) ATTR_ORDER.forEach(id=>{ if(d.attributes[id]){state.attributes[id].xp=d.attributes[id].xp||0;state.attributes[id].level=d.attributes[id].level||0;} });
  }catch(e){ console.warn('[CIM] Load failed:',e); }
}

function cleanupExpiredCooldowns(){
  const now=Date.now();
  for(const id of Object.keys(state.trainCooldowns)) if(state.trainCooldowns[id]<=now) delete state.trainCooldowns[id];
  for(const id of Object.keys(state.raceCooldowns))  if(state.raceCooldowns[id]<=now)  delete state.raceCooldowns[id];
}

function applyOfflineProgress(){
  if(!state._lastSavedAt) return;
  const awayMs=Date.now()-state._lastSavedAt;
  const awaySec=awayMs/1000;
  if(awaySec<5) return;

  // Sponsor passive income (capped at 5 minutes to avoid huge offline windfalls)
  if(D.sponsorPerSec>0){
    const gained=D.sponsorPerSec*Math.min(awaySec,300);
    earnMoney(gained);
    if(awayMs>30000) setTimeout(()=>showToast(`💤 +${fmtMoney(gained)} sponsorship while away`),600);
  }

  // Energy regen while closed: full offline time at ENERGY_REGEN_RATE, capped at
  // TODAY's fatigue-adjusted allocation — not state.maxEnergy. This is what stops
  // an overnight close-and-reopen from silently erasing the fatigue penalty.
  if(state.energy<state.todayEnergyAllocation){
    const regenGained=Math.min(state.todayEnergyAllocation-state.energy, ENERGY_REGEN_RATE*awaySec);
    if(regenGained>=1){
      state.energy=Math.min(state.todayEnergyAllocation, state.energy+regenGained);
      if(awayMs>60000) setTimeout(()=>showToast(`⚡ +${Math.floor(regenGained)} energy regenerated while away`),800);
    }
  }
}

// ═══════════════════════════════════════════════════════════
// GAME LOOP
// ═══════════════════════════════════════════════════════════
let lastTick=Date.now(), _lastRaceRender=0, _lastListRender=0, _lastSessionRender=0;
function gameTick(){
  const now=Date.now(), delta=(now-lastTick)/1000; lastTick=now;
  // FIX 3: Only earn passive income while tab is visible — the visibilitychange handler
  // covers the offline period, so earning here while hidden causes double-counting
  if(D.sponsorPerSec>0 && !document.hidden) earnMoney(D.sponsorPerSec*delta);
  // Idle energy regen: 1pt per 10min (6/hr), capped at TODAY's fatigue-adjusted
  // allocation (state.todayEnergyAllocation), not state.maxEnergy. This was the
  // root cause of the overnight-fatigue-reset bug — the comment always said
  // "today's allocation" but the code referenced the wrong variable.
  // MAX_ENERGY_CAP (item-boost ceiling) is deliberately excluded — regen only fills
  // your daily pot back up, it can't replace the benefit of energy items or exploit
  // the cap. Header updates only when the displayed integer changes to avoid DOM thrash.
  if(!document.hidden && state.energy<state.todayEnergyAllocation){
    const prevFloor=Math.floor(state.energy);
    state.energy=Math.min(state.todayEnergyAllocation, state.energy+ENERGY_REGEN_RATE*delta);
    if(Math.floor(state.energy)!==prevFloor) updateHeader();
  }
  if(state.session.active){
    const t=TRAINING.find(t=>t.id===state.session.typeId);
    // Timer done and not yet collected — switch to collect-reward state
    if(!state.session.awaitingCollection && t && now-state.session.startTime>=state.session.duration){
      let sessMult=D.sessionMult;
      if(state.specialisation==='climber'&&(t.id==='z2'||t.id==='z5')) sessMult*=1.25;
      else if(state.specialisation==='sprinter'&&t.id==='z6') sessMult*=1.30;
      else if(state.specialisation==='rouleur') sessMult*=1.15;
      // CRITICAL SESSION: 15% chance the whole session pays out at 2× XP.
      // Rolled once here, the instant the timer finishes — never re-rolled on
      // render — so the player can't refresh/reopen their way to a better roll.
      const isCritical = Math.random() < 0.15;
      if(isCritical) sessMult *= 2;
      state.session.awaitingCollection=true;
      state.session.isCritical=isCritical;
      state.session.pendingXP=Object.entries(t.xpGains).map(([attr,base])=>({attr,amount:Math.round(base*sessMult)}));
      saveGame();
      if(currentTab==='train') renderActiveSession();
      return;
    }
    if(currentTab==='train'&&now-_lastSessionRender>=200){ renderActiveSession(); _lastSessionRender=now; }
  }
  if(state.raceActive&&state.raceData){
    const rd=state.raceData;
    const elapsed=getEffectiveElapsed(rd,now); // excludes time spent showing decision cards
    const rt=RACE_TYPES.find(r=>r.id===rd.typeId);
    if(rt) rd.commentaryIdx=Math.min(Math.floor(elapsed/(rd.animMs/rt.commentary.length)),rt.commentary.length-1);
    const progress=elapsed/rd.animMs, fs=rd.result.fieldSize, fp=rd.result.position;
    if(progress<0.55){ if(Math.random()<0.15) rd.virtualPos=Math.max(1,Math.min(fs,rd.virtualPos+Math.round((Math.random()-0.5)*4))); }
    else{ rd.virtualPos=Math.max(1,Math.min(fs,Math.round(rd.startVP+(fp-rd.startVP)*((progress-0.55)/0.45)))); }
    // Fire decision stages as race progress crosses each triggerPct
    if(!rd.pendingDecision && rd.stages){
      for(const stage of rd.stages){
        if(!stage.fired && progress>=stage.triggerPct){
          stage.fired=true;
          rd.pendingDecision={event:stage.event, startedAt:Date.now()};
          rd.lastDecisionResult=null; // clear any previous result card
          break; // one decision at a time
        }
      }
    }
    // Auto-select the default choice after 30 seconds
    // Drive decision state machine:
    // A) If a choice has been selected (tapped), wait 1s then resolve it
    // B) If no choice yet and 30s have elapsed, auto-select the default then highlight for 1s
    if(rd.pendingDecision){
      const {selectedChoiceId, selectedAt, startedAt}=rd.pendingDecision;
      if(selectedChoiceId){
        // Player tapped — wait 1s for highlight, then apply
        if(now-selectedAt>=1000) resolveRaceDecision();
      } else {
        // No tap yet — check auto-select timer (30s)
        const decisionAge=now-startedAt;
        if(decisionAge>=30000){
          const dflt=rd.pendingDecision.event.choices.find(c=>c.defaultChoice)||rd.pendingDecision.event.choices[0];
          showToast(`⏱️ Time up — auto: ${dflt.label}`);
          // Mark as selected so the 1s highlight path takes over
          rd.pendingDecision.selectedChoiceId=dflt.id;
          rd.pendingDecision.selectedAt=now;
          rd.pendingDecision.wasAutoSelected=true;
          if(currentTab==='race') renderActiveRaceBlock();
        }
      }
    }
    if(elapsed>=rd.animMs){ completeRace(); if(currentTab==='race') renderRaceTab(); return; }
    if(currentTab==='race'&&now-_lastRaceRender>=100){
      // While a decision card is showing and the player hasn't tapped yet, DON'T
      // rebuild the whole block — that destroys the button DOM every 100ms and
      // swallows clicks before they can register (especially on Mac and mobile).
      // Instead, surgically update only the countdown timer bar in-place.
      const pending=state.raceData?.pendingDecision;
      if(pending && !pending.selectedChoiceId){
        const timerFill=document.querySelector('.decision-timer-fill');
        const timerText=document.querySelector('.decision-timer-text');
        if(timerFill&&timerText){
          // Card is already in the DOM — just update the countdown numbers
          const age=now-pending.startedAt;
          timerFill.style.width=Math.max(0,Math.round((1-age/30000)*100))+'%';
          timerText.textContent=`Auto in ${Math.max(0,Math.ceil((30000-age)/1000))}s`;
        } else {
          // Decision just fired but the card hasn't been rendered yet —
          // must do a full render so the card actually appears
          renderActiveRaceBlock();
        }
      } else {
        renderActiveRaceBlock();
      }
      _lastRaceRender=now;
    }
  }
  updateHeader();
  if(now-_lastListRender>=1000){
    if(currentTab==='train'&&!state.session.active){ renderSessionList(); renderEnergyCard(); }
    if(currentTab==='race'&&!state.raceActive){ renderRaceTypes(); renderCategoryCard(); }
    _lastListRender=now;
  }
}
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden){
    const now=Date.now(), awayMs=now-lastTick;
    // Sponsor passive income for tab-hidden time (capped at 5 min to match boot logic)
    if(awayMs>5000&&D.sponsorPerSec>0){
      const gained=D.sponsorPerSec*Math.min(awayMs,300000)/1000;
      earnMoney(gained);
      if(awayMs>30000) showToast(`💤 +${fmtMoney(gained)} sponsorship while away`);
    }
    // Energy regen for tab-hidden time — capped at today's fatigue-adjusted
    // allocation, not state.maxEnergy (see applyOfflineProgress for full rationale).
    if(awayMs>0 && state.energy<state.todayEnergyAllocation){
      const regenGained=Math.min(state.todayEnergyAllocation-state.energy, ENERGY_REGEN_RATE*(awayMs/1000));
      if(regenGained>=1){
        state.energy=Math.min(state.todayEnergyAllocation, state.energy+regenGained);
        if(awayMs>60000) showToast(`⚡ +${Math.floor(regenGained)} energy regenerated while away`);
        updateHeader();
      }
    }
    lastTick=now;
  }
});

// ═══════════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════════
loadGame();
cleanupExpiredCooldowns();
recalc();
ensureDailyMarket();
ensureCalendarSeasonStarted();
checkDailyReset();
// If a morning reward is already pending (restored from save or daily reset
// just fired on load), show the collect card straight away.
if(state.pendingMorningReward && currentTab==='train') renderEnergyCard();
applyOfflineProgress();
recordFtpSnapshot(); // seed a baseline point for players loading an existing save
updateUI();
updateActivityDots();
updateGrowthBadge();
updateSponsorBadge();
updateCalendarBadge();
setInterval(gameTick,100);
setInterval(saveGame,15000);
setInterval(checkDailyReset,60000);

// ── PWA: register service worker for offline support ──
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js')
      .then(reg => console.log('[CIM] SW registered:', reg.scope))
      .catch(err => console.warn('[CIM] SW failed:', err));
  });
}
</script>
</body>
