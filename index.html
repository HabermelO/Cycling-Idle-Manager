function prestigeThreshold(){ return Math.floor(1500*Math.pow(3,state.seasonsCompleted)); }
function handlePrestige(){
  if(state.seasonMoney<prestigeThreshold()) return;
  // FIX 4: Block prestige during active session or race to prevent energy/XP loss
  if(state.raceActive||state.session.active){ showToast('⚠️ Finish current activity first'); return; }
  // Two-tap confirmation — replaces confirm() which is silently suppressed on
  // iOS PWA (the dialog never appears, confirm() just returns false, and the
  // button looks broken). Same pattern as Calendar signup and Sponsor actions.
  if(!prestigeConfirmPending){
    prestigeConfirmPending=true;
    clearTimeout(prestigeConfirmTimer);
    prestigeConfirmTimer=setTimeout(()=>{
      prestigeConfirmPending=false;
      if(currentTab==='rider') renderPrestige();
    }, 4000);
    if(currentTab==='rider') renderPrestige();
    return;
  }
  clearTimeout(prestigeConfirmTimer);
  prestigeConfirmPending=false;
  const next=state.prestigeMult*2, newMax=state.maxEnergy+10;
  state.season++; state.seasonsCompleted++; state.money=0; state.seasonMoney=0;
  state.prestigeMult=next; state.maxEnergy=newMax; state.energy=newMax;
  state.todayEnergyAllocation=newMax; // fresh season starts at full allocation, no fatigue carried over
  // FTP reset: zero every attribute back to its starting level/xp. Bikes, wheels,
  // kit and accessories (boughtUpgrades) are deliberately left untouched — gear
  // earned through play is a permanent collection, not something prestige should
  // strip away. Only the rider's physical conditioning resets each season.
  ATTR_ORDER.forEach(id=>{ state.attributes[id]={xp:0,level:0}; });
  state.session={active:false}; state.trainCooldowns={};
  state.raceActive=false; state.raceData=null; state.raceCategory=0;
  state.categoryPoints=0; state.raceCooldowns={}; state.lastRaceResult=null;
  state.specialisation=null;
  state.energySpentToday=0; // fresh season — clean fatigue slate
  // Force rival recalibration next race — FTP just reset to 50w base, so the
  // rival must recalibrate down to match rather than staying at an old,
  // now-wildly-unbeatable number from the previous season's top category.
  state.rival.categoryIndexAtAssignment=-1;
  // Sponsorship reset: back to no sponsor, and the win gate re-locks — the
  // player needs fresh wins THIS season to attract a sponsor again, same
  // spirit as the FTP reset. This is a clean reset, not a termination, so
  // no cooling-off lockout is applied (that's reserved for voluntarily
  // walking out on a contract mid-season).
  state.winsSincePrestige=0;
  state.sponsor={
    activeId:null, activeTierIdx:-1, weekStart:0,
    progress:{win_races:0,enter_races:0,podiums:0,sessions:0,prize_money:0},
    claimed:{}, bonusClaimed:false,
    totalEarned:state.sponsor.totalEarned||0, // lifetime earnings from sponsors stays a career stat
    terminatedAt:0, lateralCooldownUntil:0,
  };
  updateSponsorBadge();
  checkAchievements(); checkLifetimeGoals(); updateActivityDots(); recalc(); updateUI(); saveGame();
  showToast(`🏆 Season ${state.season} begins! FTP reset · Prize ×${next}`);
}
function confirmReset(){
  if(confirm('Delete ALL save data and start from scratch?')){ localStorage.removeItem(SAVE_KEY); location.reload(); }
}

function fmtMoney(n){ n=Math.floor(n); return n>=1e6?'£'+(n/1e6).toFixed(2)+'M':n>=1000?'£'+(n/1000).toFixed(1)+'K':'£'+n.toLocaleString(); }
function fmt(n){ n=Math.floor(n); return n>=1e6?(n/1e6).toFixed(2)+'M':n>=1000?(n/1000).toFixed(1)+'K':n.toLocaleString(); }
function fmtDec(n){ return n>=1000?fmt(n):n.toFixed(2); }
function fmtTime(ms){ const s=Math.ceil(ms/1000); return s>60?Math.ceil(s/60)+'m':s+'s'; }
function timeToReset(){ const now=new Date(),mid=new Date(now);mid.setHours(24,0,0,0);const ms=mid-now,h=Math.floor(ms/3600000),m=Math.floor((ms%3600000)/60000);return h>0?`${h}h ${m}m`:`${m}m`; }
let toastTimer=null;
function showToast(msg){ const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2500); }

const ONBOARD_WELCOME_BONUS = 20;

function startOnboarding(){
  state.onboarding = {step:0, done:false};
  earnMoney(ONBOARD_WELCOME_BONUS);
  // A brand-new player's energy is withheld behind the morning-collect card
  // (see checkDailyReset/pendingMorningReward) until tapped. Auto-resolve it
  // here so the "start a session" step has energy to work with immediately —
  // the player will still see the real collect-card ritual naturally on Day 2.
  if(state.pendingMorningReward) collectMorningReward();
  saveGame();
  showTab('train');
  document.getElementById('onboard-layer').style.display='block';
  renderOnboardingStep();
}

// Replay of the tour on demand (Rider tab button). Differs from the first-run
// path in two ways: no welcome-bonus re-grant, and Skip stays visible on the
// two "do it to continue" steps — a replaying player may have no energy or no
// spare cash for the gel, and must never be trapped in the overlay. The replay
// flag lives INSIDE the saved onboarding state (not a transient variable) so
// that if the app closes mid-replay, the boot check can tell "interrupted
// replay" apart from "brand-new player" — otherwise reopening would re-run
// startOnboarding and re-grant the £20 welcome bonus every time.
// Minimum cash guaranteed for a tutorial replay — just enough to always afford
// an Energy Gel (£1-3 depending on the daily market roll) for the "try it"
// step. This is a TOP-UP, not a grant: a player who already has £5+ gets
// nothing extra, so replaying repeatedly can't be used to farm money.
const ONBOARD_REPLAY_MIN_CASH = 5;

function replayOnboarding(){
  if(state.raceActive||state.session.active){ showToast('Finish your current activity first'); return; }
  if(state.money<ONBOARD_REPLAY_MIN_CASH) earnMoney(ONBOARD_REPLAY_MIN_CASH-state.money);
  state.onboarding = {step:0, done:false, replay:true};
  saveGame();
  showTab('train');
  document.getElementById('onboard-layer').style.display='block';
  renderOnboardingStep();
}

function skipOnboarding(){
  state.onboarding.done=true;
  document.getElementById('onboard-layer').style.display='none';
  saveGame();
}

function finishOnboarding(){
  state.onboarding.done=true;
  document.getElementById('onboard-layer').style.display='none';
  saveGame();
  updateUI();
}

function advanceOnboarding(){
  state.onboarding.step++;
  if(state.onboarding.step>=ONBOARDING_STEPS.length){ finishOnboarding(); return; }
  saveGame();
  renderOnboardingStep();
}

// Called from the two gated actions (startSession, buyEnergyItem). Only
// advances if the CURRENT step is actually waiting on that specific action —
// harmless no-op otherwise, so these hooks are safe to leave in permanently.
function notifyOnboardingAction(eventName){
  if(state.onboarding.done) return;
  const step=ONBOARDING_STEPS[state.onboarding.step];
  if(step && step.actionEvent===eventName){
    // Small delay so the player sees the result of their tap (toast, UI update)
    // before the tour whisks them on to the next step.
    setTimeout(advanceOnboarding, 900);
  }
}

function renderOnboardingStep(){
  const step=ONBOARDING_STEPS[state.onboarding.step]; if(!step) return;
  if(step.tab && currentTab!==step.tab) showTab(step.tab);

  const spotlight=document.getElementById('onboard-spotlight');
  const card=document.getElementById('onboard-card');
  const skipBtn=document.getElementById('onboard-skip');
  // Skip is only offered before the two forced-action steps start, and again
  // right at the end — hiding it during the action steps themselves keeps the
  // player focused on completing the one thing being asked of them. EXCEPT on
  // a replay, where the player may lack the energy/money to complete an action
  // step and must always have a way out.
  skipBtn.style.display = (step.actionEvent && !state.onboarding.replay) ? 'none' : '';

  const progressDots=ONBOARDING_STEPS.map((s,i)=>
    `<div class="onboard-progress-dot${i<=state.onboarding.step?' done':''}"></div>`).join('');

  const actionHtml = step.actionEvent
    ? `<div class="onboard-action-hint"><span class="onboard-action-dot"></span>Do this to continue</div>`
    : `<button class="onboard-next-btn" onclick="advanceOnboarding()">${state.onboarding.step===ONBOARDING_STEPS.length-1?'Let\'s ride! 🚴':'Next →'}</button>`;

  card.innerHTML=`
    <div class="onboard-progress">${progressDots}</div>
    <div class="onboard-eyebrow">${step.eyebrow}</div>
    <div class="onboard-title">${step.title}</div>
    <div class="onboard-body">${step.body}</div>
    ${actionHtml}
  `;

  positionOnboardingUI(step, spotlight, card);
}

// Positions the spotlight cutout exactly over the target element (or dims the
// whole screen evenly for welcome/completion screens with no target), then
// places the instruction card in whichever half of the screen has more room.
function positionOnboardingUI(step, spotlight, card){
  if(!step.target){
    spotlight.classList.add('no-target');
    card.style.top='50%'; card.style.left='50%';
    card.style.transform='translate(-50%,-50%)';
    return;
  }
  spotlight.classList.remove('no-target');
  const el=document.querySelector(step.target);
  if(!el){
    // Target not in the DOM yet (e.g. tab just switched, render pending) — retry shortly.
    setTimeout(()=>positionOnboardingUI(step, spotlight, card), 80);
    return;
  }
  const r=el.getBoundingClientRect();
  const pad=8;
  spotlight.style.top=(r.top-pad)+'px';
  spotlight.style.left=(r.left-pad)+'px';
  spotlight.style.width=(r.width+pad*2)+'px';
  spotlight.style.height=(r.height+pad*2)+'px';

  // Card goes below the spotlight if there's room, otherwise above it.
  const cardWillFitBelow=(r.bottom+220) < window.innerHeight;
  card.style.transform='none';
  card.style.left=Math.max(16, Math.min(window.innerWidth-336, r.left))+'px';
  if(cardWillFitBelow){ card.style.top=(r.bottom+pad+12)+'px'; }
  else{ card.style.top=Math.max(16,(r.top-pad-12-220))+'px'; }
}

// Recompute spotlight position on resize/orientation change while the tour is active.
window.addEventListener('resize', ()=>{
  if(state.onboarding && !state.onboarding.done && document.getElementById('onboard-layer').style.display!=='none'){
    renderOnboardingStep();
  }
});


// ═══════════════════════════════════════════════════════════
// CEREMONY SYSTEM — full-screen celebration for race wins and
// category promotions. A single race can trigger both (win AND
// get promoted in the same result), so these queue rather than
// show simultaneously or clobber each other.
// ═══════════════════════════════════════════════════════════
let ceremonyQueue=[];
let ceremonyShowing=false;
let currentCeremonyType=null; // tracks which ceremony is on screen, used to gate backdrop-tap dismissal

function enqueueCeremony(ceremony){
  ceremonyQueue.push(ceremony);
  if(!ceremonyShowing) processCeremonyQueue();
}

function processCeremonyQueue(){
  if(ceremonyShowing||ceremonyQueue.length===0) return;
  const next=ceremonyQueue.shift();
  ceremonyShowing=true;
  currentCeremonyType=next.type;
  if(next.type==='win') renderWinCeremony(next);
  else if(next.type==='promotion') renderPromotionCeremony(next);
  else if(next.type==='achievement') renderAchievementCeremony(next);
  else if(next.type==='lifetimegoal') renderLifetimeGoalCeremony(next);
  else if(next.type==='grandtour') renderGrandTourCeremony(next);
  spawnConfetti();
  document.getElementById('ceremony-overlay').style.display='flex';
}

function dismissCeremony(e){
  // Allow tapping the dim backdrop OR the explicit button to dismiss — EXCEPT
  // for achievement and lifetime-goal ceremonies, which must be collected via
  // their explicit "Collect Reward" button. This guarantees every reward is
  // actually claimed, never accidentally skipped by a stray backdrop tap.
  if(currentCeremonyType==='achievement'||currentCeremonyType==='lifetimegoal') return;
  document.getElementById('ceremony-overlay').style.display='none';
  document.getElementById('ceremony-confetti').innerHTML='';
  ceremonyShowing=false;
  currentCeremonyType=null;
  processCeremonyQueue(); // show the next queued ceremony, if any
}

// Generates ~36 falling confetti rectangles in randomised colours, positions,
// rotation and timing. Rebuilt fresh on every ceremony so it never looks stale.
function spawnConfetti(){
  const wrap=document.getElementById('ceremony-confetti');
  const colors=['var(--gold)','var(--green-txt)','var(--blue-txt)','var(--red-txt)','var(--purple-txt)','var(--amber-txt)'];
  let html='';
  for(let i=0;i<36;i++){
    const left=Math.random()*100;
    const delay=(Math.random()*0.5).toFixed(2);
    const duration=(2.2+Math.random()*1.4).toFixed(2);
    const color=colors[Math.floor(Math.random()*colors.length)];
    const rotate=Math.random()<0.5?'2px':'6px';
    html+=`<span class="confetti-piece" style="left:${left}%;background:${color};animation-delay:${delay}s;animation-duration:${duration}s;border-radius:${rotate}"></span>`;
  }
  wrap.innerHTML=html;
}

// Animates a number counting up from 0 to `target` over `durationMs`,
// writing the formatted result into the element with id `elId` each frame.
// Uses an ease-out curve so it starts fast and settles gently on the final value.
function animateCountUp(elId, target, durationMs, formatFn){
  const el=document.getElementById(elId); if(!el) return;
  const start=performance.now();
  function tick(now){
    const t=Math.min(1,(now-start)/durationMs);
    const eased=1-Math.pow(1-t,3); // ease-out cubic
    const val=Math.round(target*eased);
    el.textContent=formatFn(val);
    if(t<1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

// Grants the achievement's reward (money or a kit colour unlock), removes it
// from the uncollected set, then force-dismisses the ceremony and advances
// the queue. This is the ONLY path that both grants an achievement reward and
// closes its ceremony — the backdrop tap is deliberately blocked for this type.
function collectAchievementReward(achId){
  const ach=ACHIEVEMENTS.find(a=>a.id===achId); if(!ach) return;
  if(!state.uncollectedAchievements.has(achId)) return; // already collected — guard against double-tap
  if(ach.reward.type==='color') state.unlockedKitColors.add(ach.reward.val);
  if(ach.reward.type==='money') earnMoney(ach.reward.val);
  state.uncollectedAchievements.delete(achId);
  saveGame();
  showToast(`🏅 ${ach.reward.label} collected!`);
  updateHeader();
  if(currentTab==='growth'){ renderAchievements(); }
  // Force-dismiss (bypassing the achievement backdrop-tap guard) and move on
  document.getElementById('ceremony-overlay').style.display='none';
  document.getElementById('ceremony-confetti').innerHTML='';
  ceremonyShowing=false;
  currentCeremonyType=null;
  processCeremonyQueue();
}

      const done=streak>=m.day, active=streak===m.day;
      const sep=i>0?`<div style="flex:1;height:2px;background:${done?'var(--green-bd)':'var(--border)'};margin-top:12px"></div>`:'';

    const bonusHtml=pmr.reward&&pmr.reward.type!=='none'
      ? `<div style="background:rgba(59,109,17,.12);border:.5px solid var(--green-bd);border-radius:var(--radius);padding:9px 14px;margin:10px 0;text-align:center">

      ? `<div style="font-size:11px;color:var(--txt3);text-align:center;margin-bottom:10px">Next milestone: <strong>Day ${next.day} ${next.icon}</strong></div>`
      : `<div style="font-size:11px;color:var(--green-txt);font-weight:600;text-align:center;margin-bottom:10px">🏆 Max streak — top reward every day!</div>`;
    wrap.innerHTML=`<div class="collect-ready" onclick="collectMorningReward()" style="background:var(--green-bg);border:2px solid var(--green-txt);padding:1.25rem;cursor:pointer;margin-bottom:.75rem">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <span style="font-size:13px;font-weight:600;color:var(--green-txt)">🔥 ${streak} day${streak!==1?'s':''} in a row</span>

      </div>

      ${bonusHtml}
      <div style="text-align:center;margin-bottom:10px">
        <div style="font-size:28px;font-weight:800;color:var(--green-txt)">⚡ ${pmr.energy}</div>
        <div style="font-size:11px;color:var(--green-txt);opacity:.7">energy ready</div>
      </div>
      ${nextHtml}
      <div style="background:var(--green-txt);color:#fff;border-radius:var(--radius);padding:11px;text-align:center;font-size:13px;font-weight:700;letter-spacing:.05em">TAP TO START YOUR DAY</div>
    </div>`;
    return;
  }

  // ── NORMAL ENERGY CARD ────────────────────────────────────────
  const e=Math.floor(state.energy);
  const barCls=e<=15?'critical':e<=35?'low':'';
  // Group inventory instances by item type for compact pill display. The pill shows
  // the OLDEST instance's locked-in energy value, since FIFO means that's exactly
  // what tapping it will grant — and flags items expiring within 2 days.
  const inv=state.energyInventory||[];
  const grouped={};
  inv.forEach(entry=>{
    if(!grouped[entry.itemType]) grouped[entry.itemType]={count:0, oldest:entry, minExpiryDays:Infinity};
    const g=grouped[entry.itemType];
    g.count++;
    if(entry.purchasedAt<g.oldest.purchasedAt) g.oldest=entry;
    const daysLeft=Math.max(0,Math.ceil((ITEM_SHELF_LIFE_MS-(Date.now()-entry.purchasedAt))/(24*60*60*1000)));
    if(daysLeft<g.minExpiryDays) g.minExpiryDays=daysLeft;
  });
  const hasItems=Object.keys(grouped).length>0;
  const invRowHtml=hasItems
    ? `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:.5rem;align-items:center">
        <span style="font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.06em;margin-right:2px">Inventory</span>

            ${i.icon} <span style="color:var(--blue-txt)">+${g.oldest.energy}⚡</span> ×${g.count} ${expiryHtml}
          </button>`;
        }).join('')}
      </div>`
    : `<div style="font-size:11px;color:var(--txt3);margin-top:.4rem">No energy items — buy some in Gear → Energy</div>`;
  const dailyHtml=canClaimDailyBar()
    ? `<div style="display:flex;align-items:center;justify-content:space-between;background:var(--amber-bg);border:.5px solid var(--amber-bd);border-radius:var(--radius);padding:7px 10px;margin-top:.5rem">
        <span style="font-size:12px;font-weight:600;color:var(--amber-txt)">🍫 Free daily bar ready!</span>
        <button onclick="claimDailyBar()" style="background:var(--amber-txt);color:#fff;border:none;border-radius:var(--radius);padding:5px 12px;font-size:11px;font-weight:700;cursor:pointer">Claim</button>
      </div>`
    : '';
  // Recovery preview — shows tomorrow's starting energy based on today's training load
  const tmr=getTomorrowEnergy(), tmrPct=Math.min(100,Math.round(tmr/state.maxEnergy*100));
  const tmrCol = tmr>=state.maxEnergy*0.85 ? 'var(--green-txt)' : tmr>=state.maxEnergy*0.6 ? 'var(--amber-txt)' : 'var(--red-txt)';
  const spent=state.energySpentToday||0;
  const recoveryHtml=`<div style="margin-top:.6rem;padding-top:.6rem;border-top:.5px solid var(--border)">
    <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:.3rem">
      <span style="font-size:12px;font-weight:600;color:var(--txt2)">💤 Recovery — tomorrow you'll wake with</span>
      <span style="font-size:14px;font-weight:700;color:${tmrCol}">${tmr} / ${state.maxEnergy}</span>
    </div>
    <div class="energy-bar-outer" style="height:6px"><div class="energy-bar-inner" style="width:${tmrPct}%;background:${tmrCol}"></div></div>
    <div style="font-size:10px;color:var(--txt3);margin-top:3px">${spent>0?`${spent} energy spent today → fatigue carries over. Use Gels, Carb Drinks or Recovery Shakes to recover faster overnight.`:'No training yet today — full recovery expected.'}</div>
  </div>`;
  wrap.innerHTML=`<div class="energy-card">
    <div class="energy-head"><span class="energy-label">⚡ Daily Training Energy</span><span class="energy-amount">${e} / ${Math.max(state.maxEnergy,e)}</span></div>
    <div class="energy-bar-outer"><div class="energy-bar-inner ${barCls}" style="width:${Math.min(100,Math.round(e/state.maxEnergy*100))}%"></div></div>
    <div class="energy-meta"><span>Recovers each morning · <span style="color:var(--green-txt)">↑ +6/hr idle regen</span></span><span>~${timeToReset()} remaining</span></div>
    ${(()=>{ const {condition,intensity}=getDailyWeather(); const fb=Math.round((condition.fatigueBonus||0)*WEATHER_INTENSITY_MULTS[intensity]); return fb>0?`<div style="font-size:10px;color:var(--amber-txt);font-weight:600;margin-top:.3rem">${condition.icon} ${WEATHER_INTENSITY_LABELS[intensity]} ${condition.name.toLowerCase()}: +${fb} extra fatigue per race today</div>`:''; })()}
    ${dailyHtml}${invRowHtml}${recoveryHtml}
  </div>`;
}

      <div style="font-size:18px;font-weight:800;color:var(--green-txt);margin-bottom:12px">${t.name} Complete!</div>

      <div style="font-size:12px;font-weight:700;color:var(--green-txt);opacity:.7;text-transform:uppercase;letter-spacing:.08em">Tap to collect</div>
    </div>`;
    return;
  }

  // ── RUNNING STATE: live countdown ──
  const now=Date.now(), elapsed=now-state.session.startTime;
  const progress=Math.min(1,elapsed/state.session.duration);
  const remaining=Math.max(0,Math.ceil((state.session.duration-elapsed)/1000));
  const cv=t.colorVar;
  const gainPills=Object.entries(t.xpGains).map(([a,x])=>{
    const acv=ATTR_DEFS[a].colorVar;
    return `<span class="active-gain-pill" style="background:var(--${acv}-bg);color:var(--${acv}-txt)">${ATTR_DEFS[a].icon} +${Math.round(x*D.sessionMult)} xp</span>`;
  }).join('');
  wrap.innerHTML=`<div class="active-session" style="background:var(--${cv}-bg);border:1.5px solid var(--${cv}-bd)">
    <div class="active-head">
      <span class="zone-badge" style="background:var(--${cv}-txt)">Z${t.zone}</span>
      <span class="active-name" style="color:var(--${cv}-txt)">${t.name}</span>
      <span class="active-timer" style="color:var(--${cv}-txt)">${remaining}s</span>
    </div>
    <div class="active-bar-wrap"><div class="active-bar" style="width:${Math.round(progress*100)}%;background:var(--${cv}-txt)"></div></div>
    <div class="active-flavour" style="color:var(--${cv}-txt)">${t.flavour}</div>
    <div class="active-gains-label" style="color:var(--${cv}-txt)">On completion</div>
    <div class="active-gains">${gainPills}</div>
  </div>`;
}

function renderSessionList(){
  const list=document.getElementById('training-list'); list.innerHTML='';
  const now=Date.now();
  TRAINING.forEach(t=>{
    if(state.session.active&&state.session.typeId===t.id) return;
    const cdEnd=state.trainCooldowns[t.id]||0, onCd=cdEnd>now;
    const locked=t.unlock&&state.attributes[t.unlock.attr].level<t.unlock.level;
    const noEnergy=!locked&&!onCd&&state.energy<t.energyCost;
    const available=!onCd&&!locked&&!noEnergy&&!state.session.active&&!state.raceActive;
    const cv=t.colorVar;
    let statusHtml;
    if(locked){ const ud=ATTR_DEFS[t.unlock.attr]; statusHtml=`<span class="session-status" style="color:var(--txt3)">🔒 ${ud.name} Lv${t.unlock.level}</span>`; }
    else if(onCd) statusHtml=`<span class="session-status" style="color:var(--txt2)">⏳ ${fmtTime(cdEnd-now)}</span>`;
    else if(state.session.active||state.raceActive) statusHtml=`<span class="session-status" style="color:var(--txt3)">Busy</span>`;
    else if(noEnergy) statusHtml=`<span class="session-status" style="color:var(--red-txt)">⚡ ${Math.floor(state.energy)}/${t.energyCost}</span>`;
    else statusHtml=`<span class="session-status" style="color:var(--${cv}-txt)">▶ ${t.duration}s</span>`;
    const xpBadges=Object.entries(t.xpGains).map(([a,x])=>`<span class="gain-badge">${ATTR_DEFS[a].icon} +${Math.round(x*D.sessionMult)}xp</span>`).join('');
    const eBadge=`<span class="energy-cost-badge${noEnergy?' unaffordable':''}">⚡ ${t.energyCost}</span>`;
    const cdBarHtml=onCd?(()=>{ const pct=Math.round((1-(cdEnd-now)/(t.cooldown*1000))*100); return `<div class="cooldown-bar-wrap"><div class="cooldown-bar" style="width:${pct}%"></div></div>`; })():'';
    const div=document.createElement('div'); div.className='session-card'+(available?' available':'');
    if(!available) div.style.opacity=locked?'0.5':'0.65';
    div.innerHTML=`<div class="session-card-head">
        <span class="zone-badge" style="background:var(--${cv}-txt)">Z${t.zone}</span>
        <div class="session-card-text"><div class="session-card-name">${t.name}</div><div class="session-card-sub">${t.subtitle}</div></div>
        ${statusHtml}
      </div>
      <div class="session-gains">${eBadge}${xpBadges}</div>${cdBarHtml}`;
    if(available) div.addEventListener('click',()=>startSession(t.id));
    list.appendChild(div);
  });
}

function renderWeatherBanner(){
  const wrap=document.getElementById('weather-banner-wrap'); if(!wrap) return;
  const {condition,intensity}=getDailyWeather();
  const intensityLabel=WEATHER_INTENSITY_LABELS[intensity];
  const intMult=WEATHER_INTENSITY_MULTS[intensity];
  const desc=condition.intensityDesc[intensity];

  // Per-race-type effect badges — show the player clearly which events today's
  // weather helps or hurts so they can make an informed choice before committing energy.
  const raceTypeBadges=RACE_TYPES.map(rt=>{
    const base=condition.scoreEffect[rt.id]||0;
    const effective=base*intMult;
    if(Math.abs(effective)<0.005) return `<span class="wx-badge wx-neutral">${rt.icon} ${rt.name}: neutral</span>`;
    const pct=Math.round(effective*100);
    const col=pct>0?'var(--green-txt)':'var(--red-txt)';
    const bg=pct>0?'var(--green-bg)':'var(--red-bg)';
    const bd=pct>0?'var(--green-bd)':'var(--red-bd)';
    return `<span class="wx-badge" style="color:${col};background:${bg};border-color:${bd}">${rt.icon} ${rt.name}: ${pct>0?'+':''}${pct}%</span>`;
  }).join('');

  // Energy cost note — only show when weather actually increases it
  const energyNote=(condition.energyMult>1 && intMult>0)
    ? `<div class="wx-energy-note">⚡ ${intensityLabel} ${condition.name.toLowerCase()} increases race energy cost and fatigue</div>`
    : '';

  // Banner colour matches condition severity
  const isNeutral=condition.id==='sunny'||condition.id==='overcast';
  const bannerStyle=isNeutral
    ? 'background:var(--bg);border-color:var(--border)'
    : intensity===2
      ? 'background:var(--amber-bg);border-color:var(--amber-bd)'
      : 'background:var(--bg);border-color:var(--border)';

  wrap.innerHTML=`<div class="wx-banner" style="${bannerStyle}">
    <div class="wx-banner-head">
      <span class="wx-icon">${condition.icon}</span>
      <div>
        <div class="wx-name">${intensityLabel} ${condition.name}</div>
        <div class="wx-desc">${desc}</div>
      </div>
    </div>
    <div class="wx-badges-row">${raceTypeBadges}</div>
    ${energyNote}
  </div>`;
}

// ─── COURSE PROFILE VISUALIZATION ────────────────────────────
// Draws the race's elevation profile as a filled mountain-silhouette SVG, with
// a rider marker that climbs/descends along the actual terrain shape as the
// race progresses, and small stage-decision flags planted at their trigger
// points. Reads purely from rt.profile (data) — never hardcodes a shape — so
// adding more named courses later is just adding more profile arrays, no
// changes needed here.
function smoothTerrainPath(pts){
  let d=`M ${pts[0].x} ${pts[0].y}`;
  for(let i=1;i<pts.length-1;i++){
    const mx=(pts[i].x+pts[i+1].x)/2, my=(pts[i].y+pts[i+1].y)/2;
    d+=` Q ${pts[i].x} ${pts[i].y} ${mx} ${my}`;
  }
  const last=pts[pts.length-1];
  d+=` L ${last.x} ${last.y}`;
  return d;
}

function buildCourseProfileSVG(rt, progress, stages, windowMode=false){
  const profile=rt.profile||[20,20,20,20];
  const N=profile.length;
  const VB_W=320, VB_H=84;
  const CHART_TOP=16, CHART_BOTTOM=66, CHART_LEFT=4, CHART_RIGHT=316;
  const CHART_H=CHART_BOTTOM-CHART_TOP, CHART_W=CHART_RIGHT-CHART_LEFT;
  const cv=rt.colorVar||'blue';

  const svgY=val=>CHART_BOTTOM-(val/100)*CHART_H;
  const pts=profile.map((val,i)=>({x:CHART_LEFT+(i/(N-1))*CHART_W, y:svgY(val)}));
  const lineD=smoothTerrainPath(pts);
  const fillD=`${lineD} L ${CHART_RIGHT} ${CHART_BOTTOM} L ${CHART_LEFT} ${CHART_BOTTOM} Z`;

  // Interpolate rider's y-position on the terrain curve at the current x fraction,
  // so the marker visually sits ON the climb/descent rather than floating in space.
  const idxF=Math.max(0,Math.min(N-1,progress*(N-1)));
  const idxLow=Math.floor(idxF), idxHigh=Math.min(N-1,idxLow+1), frac=idxF-idxLow;
  const riderVal=profile[idxLow]+(profile[idxHigh]-profile[idxLow])*frac;
  const riderX=CHART_LEFT+progress*CHART_W, riderY=svgY(riderVal);

  // Traveled portion gets a brighter fill via a clip rect — gives a clear "distance
  // covered" read at a glance, similar to a Strava/Zwift route completion visual.
  const clipId=`cp-clip-${rt.id}`;
  const gradId=`cp-grad-${rt.id}`;

  // Fading trail behind the rider — last ~5% of traveled progress, sampled along
  // the same terrain curve the marker rides on. Pure arithmetic from the profile
  // data, re-derived every render; no persisted state.
  const trailSpan=0.05;
  const trailStart=Math.max(0,progress-trailSpan);
  let trailHtml='';
  if(progress>0.001){
    const TRAIL_STEPS=8;
    const trailPts=[];
    for(let i=0;i<=TRAIL_STEPS;i++){
      const p=trailStart+(progress-trailStart)*(i/TRAIL_STEPS);
      const pIdxF=Math.max(0,Math.min(N-1,p*(N-1)));
      const pLow=Math.floor(pIdxF), pHigh=Math.min(N-1,pLow+1), pFrac=pIdxF-pLow;
      const pVal=profile[pLow]+(profile[pHigh]-profile[pLow])*pFrac;
      trailPts.push({x:CHART_LEFT+p*CHART_W, y:svgY(pVal)});
    }
    trailHtml=trailPts.slice(0,-1).map((pt,i)=>{
      const nxt=trailPts[i+1];
      const op=(0.05+ (i/(TRAIL_STEPS-1))*0.35).toFixed(2);
      return `<line x1="${pt.x}" y1="${pt.y}" x2="${nxt.x}" y2="${nxt.y}" stroke="var(--${cv}-txt)" stroke-width="3" stroke-linecap="round" stroke-opacity="${op}"/>`;
    }).join('');
  }

  // Gradient readout — slope between the two profile points bracketing the
  // rider's current position, converted to an approximate % grade. Clamped to
  // a sane display range; flat (|grade|<1%) shows nothing.
  let gradientHtml='';
  if(idxHigh>idxLow){
    const riseUnits=profile[idxHigh]-profile[idxLow]; // profile units, 0-100 scale
    const gradePct=Math.max(-20,Math.min(20,Math.round(riseUnits*0.9)));
    if(Math.abs(gradePct)>=1){
      const climbing=gradePct>0;
      const labelText=climbing?`▲ ${gradePct}% climbing`:`▼ ${Math.abs(gradePct)}% descending`;
      const labelY=Math.max(CHART_TOP+8,riderY-14);
      gradientHtml=`<text x="${riderX}" y="${labelY}" class="cp-grad-label ${climbing?'cp-grad-climb':'cp-grad-descent'}">${labelText}</text>`;
    }
  }

  // Stage decision flags — small pennant markers planted at each trigger point,
  // sitting just above the terrain line, coloured amber once fired (matches the
  // existing pip convention used elsewhere in the race UI). The nearest
  // not-yet-fired flag ahead of the rider gets a small "NEXT" hint.
  const upcoming=(stages||[]).filter(s=>!s.fired && s.triggerPct>=progress-0.001);
  const nextTriggerPct=upcoming.length?Math.min(...upcoming.map(s=>s.triggerPct)):null;

  // Window mode (camera-follow): the viewBox crops to ~30% of the course width
  // centered on the rider, clamped so it never scrolls past the course start
  // or end. This is purely a viewBox change — path data, flag coordinates and
  // rider coordinates below are computed exactly as in non-window mode, so
  // when windowMode is false the returned markup is unaffected (regression
  // guarantee: byte-for-byte identical to the pre-Phase-D render).
  let vbX=0, vbW=VB_W;
  if(windowMode){
    vbW=VB_W*0.3;
    vbX=riderX-vbW/2;
    vbX=Math.max(0,Math.min(VB_W-vbW,vbX));
  }
  const vbXEnd=vbX+vbW;

  const flagsHtml=(stages||[]).map(s=>{
    const idxFS=Math.max(0,Math.min(N-1,s.triggerPct*(N-1)));
    const iLow=Math.floor(idxFS), iHigh=Math.min(N-1,iLow+1), fr=idxFS-iLow;
    const val=profile[iLow]+(profile[iHigh]-profile[iLow])*fr;
    const fx=CHART_LEFT+s.triggerPct*CHART_W, fy=svgY(val);
    const col=s.fired?'var(--amber-txt)':'var(--txt3)';
    const isNext=!s.fired && s.triggerPct===nextTriggerPct;
    const r=isNext?4:3, flagH=isNext?13:10;
    const nextLabel=isNext?`<text x="${fx}" y="${fy-flagH-4}" class="cp-flag-next">NEXT</text>`:'';
    // "decision ahead" hint — only meaningful (and only shown) in window mode,
    // for the nearest unfired flag once it's actually inside the cropped view.
    const showDecisionHint=windowMode && isNext && fx>=vbX && fx<=vbXEnd;
    const decisionHint=showDecisionHint?`<text x="${fx}" y="${fy-flagH-14}" class="cp-flag-ahead">decision ahead</text>`:'';
    return `<line x1="${fx}" y1="${fy}" x2="${fx}" y2="${fy-flagH}" stroke="${col}" stroke-width="${isNext?2:1.5}"/>
      <circle cx="${fx}" cy="${fy-flagH}" r="${r}" fill="${col}"/>
      ${nextLabel}
      ${decisionHint}`;
  }).join('');

  return `<svg viewBox="${vbX} 0 ${vbW} ${VB_H}" class="course-profile-svg" preserveAspectRatio="${windowMode?'xMidYMid meet':'none'}">
    <defs>
      <linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(--${cv}-txt)" stop-opacity="0.55"/>
        <stop offset="100%" stop-color="var(--${cv}-txt)" stop-opacity="0.08"/>
      </linearGradient>
      <clipPath id="${clipId}"><rect x="0" y="0" width="${riderX}" height="${VB_H}"/></clipPath>
    </defs>
    <line x1="${CHART_LEFT}" y1="${CHART_BOTTOM}" x2="${CHART_RIGHT}" y2="${CHART_BOTTOM}" stroke="var(--border)" stroke-width="1"/>
    <path d="${fillD}" fill="url(#${gradId})"/>
    <path d="${lineD}" fill="none" stroke="var(--${cv}-txt)" stroke-width="2" stroke-opacity="0.35"/>
    <g clip-path="url(#${clipId})">
      <path d="${fillD}" fill="var(--${cv}-txt)" fill-opacity="0.30"/>
      <path d="${lineD}" fill="none" stroke="var(--${cv}-txt)" stroke-width="2.5"/>
    </g>
    ${flagsHtml}
    ${trailHtml}
    <g class="rider-marker-pulse">
      <circle cx="${riderX}" cy="${riderY}" r="7" fill="var(--bg)" stroke="var(--${cv}-txt)" stroke-width="2.5"/>
      <text x="${riderX}" y="${riderY+3.2}" font-size="8" text-anchor="middle">🚴</text>
    </g>
    ${gradientHtml}
  </svg>`;
}

// Course mini-map (Phase D) — thin full-course strip shown alongside the
// windowed camera profile so the rider always has "where am I in the whole
// race" context. Render-only: re-derives everything from the same profile/
// stages/progress inputs already passed to buildCourseProfileSVG, does not
// read or write any race state itself. Reuses the exact same terrain path
// generator (smoothTerrainPath) at a smaller scale — not a different model
// of the course, just a shrunk render of the same geometry.
function buildCourseMiniMapSVG(rt, progress, stages){
  const profile=rt.profile||[20,20,20,20];
  const N=profile.length;
  const VB_W=320, VB_H=20;
  const CHART_TOP=3, CHART_BOTTOM=17, CHART_LEFT=2, CHART_RIGHT=318;
  const CHART_H=CHART_BOTTOM-CHART_TOP, CHART_W=CHART_RIGHT-CHART_LEFT;
  const cv=rt.colorVar||'blue';

  const svgY=val=>CHART_BOTTOM-(val/100)*CHART_H;
  const pts=profile.map((val,i)=>({x:CHART_LEFT+(i/(N-1))*CHART_W, y:svgY(val)}));
  const lineD=smoothTerrainPath(pts);
  const fillD=`${lineD} L ${CHART_RIGHT} ${CHART_BOTTOM} L ${CHART_LEFT} ${CHART_BOTTOM} Z`;

  const riderX=CHART_LEFT+progress*CHART_W;

  // All flags shown here (mini-map is the "whole course" reference, unlike
  // the windowed profile which only hints at the nearest upcoming one).
  const flagsHtml=(stages||[]).map(s=>{
    const fx=CHART_LEFT+s.triggerPct*CHART_W;
    const col=s.fired?'var(--amber-txt)':'var(--txt3)';
    return `<circle cx="${fx}" cy="${CHART_TOP-1}" r="1.6" fill="${col}"/>`;
  }).join('');

  // Camera window rectangle — same 30%-of-course-width math used in
  // buildCourseProfileSVG's windowMode, kept in sync here so the rectangle
  // always matches what the profile above is actually showing.
  const winW=CHART_W*0.3;
  let winX=CHART_LEFT+progress*CHART_W-winW/2;
  winX=Math.max(CHART_LEFT,Math.min(CHART_RIGHT-winW,winX));

  return `<svg viewBox="0 0 ${VB_W} ${VB_H}" class="course-minimap-svg" preserveAspectRatio="none">
    <path d="${fillD}" fill="var(--${cv}-txt)" fill-opacity="0.18"/>
    <path d="${lineD}" fill="none" stroke="var(--${cv}-txt)" stroke-width="1" stroke-opacity="0.5"/>
    ${flagsHtml}
    <rect x="${winX.toFixed(1)}" y="0" width="${winW.toFixed(1)}" height="${VB_H}" fill="none" stroke="var(--${cv}-txt)" stroke-width="1" stroke-opacity="0.85"/>
    <circle cx="${riderX.toFixed(1)}" cy="${CHART_BOTTOM}" r="2.2" fill="var(--bg)" stroke="var(--${cv}-txt)" stroke-width="1.4"/>
  </svg>`;
}

// Peloton strip (Phase C) — render-only visual field of rider dots derived
// entirely from existing race state (rd). Never stores per-NPC positions;
// every dot's placement is recomputed each call from virtualPos, fieldSize,
// rider index and the current timestamp (for cosmetic bobbing only). Does
// NOT read or write virtualPos itself beyond the read already needed to
// place the player dot — no randomness affects outcomes.
function buildPelotonStripSVG(rd){
  const VB_W=320, VB_H=72;
  const TRACK_TOP=14, TRACK_BOTTOM=58;
  const LEFT=10, RIGHT=310; // back edge (left) -> front edge (right)
  const fieldSize=Math.max(1,rd.result.fieldSize||1);
  const vp=Math.max(1,Math.min(fieldSize,rd.virtualPos||1));
  const now=Date.now();

  // progress fraction 0..1 of the whole race, used only to tighten/speed the
  // cluster near the finish (sprint feel) — pure math on elapsed/animMs.
  const elapsed=getEffectiveElapsed(rd,now);
  const raceProgress=Math.max(0,Math.min(1,elapsed/rd.animMs));
  const finalStretch=raceProgress>=0.95;
  const bobSpeed=finalStretch?900:1400;
  const bobAmp=finalStretch?3:5;

  // Player's front-to-back fraction: 1st place = right edge, last = left edge.
  const posFrac=fieldSize<=1?1:1-((vp-1)/(fieldSize-1));
  const playerX=LEFT+posFrac*(RIGHT-LEFT);
  const midY=(TRACK_TOP+TRACK_BOTTOM)/2;

  const isBreakaway=vp<=Math.max(3,fieldSize*0.1);
  const isDropped=vp>=fieldSize*0.8;

  const N=Math.min(fieldSize,18);
  const kitHex=(KIT_COLORS.find(c=>c.id===state.equippedKitColor)||KIT_COLORS[0]).hex;

  // Deterministic per-rider jitter — seeded from rider index + a slow sine of
  // wall-clock time, so dots bob gently without touching any RNG/game state.
  const jitterY=i=>Math.sin(now/bobSpeed+i*1.7)*bobAmp;
  const jitterX=i=>Math.cos(now/(bobSpeed*1.3)+i*2.3)*3;

  let npcHtml='';
  const npcCount=N-1; // remaining dots after the player's own
  for(let i=0;i<npcCount;i++){
    let cx, cy;
    if(isBreakaway && i<Math.min(2,npcCount)){
      // 1-3 companions (player + up to 2 here) just ahead/around the player,
      // slightly detached from the main cluster with a visible gap.
      cx=playerX-10-i*9+jitterX(i);
      cy=midY+jitterY(i);
    } else if(isBreakaway){
      // rest of the field trails as the "peloton" cluster, dropped further back
      const clusterFrac=0.05+((i%9)/9)*0.35;
      cx=LEFT+clusterFrac*(RIGHT-LEFT)+jitterX(i);
      cy=midY+jitterY(i);
    } else if(isDropped && i<Math.min(2,npcCount)){
      // a couple of stragglers behind the dropped player
      cx=playerX+10+i*9+jitterX(i);
      cy=midY+jitterY(i);
    } else if(isDropped){
      const clusterFrac=0.55+((i%9)/9)*0.4;
      cx=LEFT+clusterFrac*(RIGHT-LEFT)+jitterX(i);
      cy=midY+jitterY(i);
    } else {
      // main cluster: loosely distributed 2-3 sub-groups around the player,
      // width tightens in the final stretch for a "sprint" look.
      const spread=finalStretch?26:46;
      const groupOffset=[-1,0,1][i%3]*spread*0.5;
      const withinGroup=((i*37)%23-11)*(finalStretch?0.6:1);
      cx=playerX+groupOffset+withinGroup+jitterX(i);
      cy=midY+jitterY(i);
    }
    cx=Math.max(LEFT-6,Math.min(RIGHT+6,cx));
    npcHtml+=`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="3.4" fill="var(--txt3)" fill-opacity="0.75"/>`;
  }

  const playerY=midY+Math.sin(now/bobSpeed)*(bobAmp*0.5);
  const gapNote=(isBreakaway||isDropped)
    ? `<text x="${playerX}" y="${TRACK_TOP-4}" class="peloton-gap-label">${isBreakaway?'⚡ Off the front':'⏳ Off the back'}</text>`
    : '';

  return `<svg viewBox="0 0 ${VB_W} ${VB_H}" class="peloton-strip-svg" preserveAspectRatio="none">
    <line x1="${LEFT}" y1="${midY}" x2="${RIGHT}" y2="${midY}" stroke="var(--border)" stroke-width="1" stroke-dasharray="2,3"/>
    ${gapNote}
    ${npcHtml}
    <circle cx="${playerX.toFixed(1)}" cy="${playerY.toFixed(1)}" r="5.5" fill="${kitHex}" stroke="var(--bg)" stroke-width="1.5"/>
    <circle cx="${playerX.toFixed(1)}" cy="${playerY.toFixed(1)}" r="8" fill="none" stroke="${kitHex}" stroke-width="1.5" stroke-opacity="0.55"/>
  </svg>`;
}

// ═══════════════════════════════════════════════════════════
// RACE OVERLAY — fullscreen takeover (Phase A)
// ═══════════════════════════════════════════════════════════
// Render-only rAF loop — runs ONLY while the race overlay is open, and ONLY
// re-renders the active-race visuals (profile SVG, timers). It never reads or
// writes race state beyond what renderActiveRaceBlock already does on its own
// 1s tick; this just makes the marker motion between those ticks look smooth
// instead of steppy. Counter exposed for a quick sanity check that it isn't
// running with the overlay closed.
let _raceOverlayRafId=null;
window._raceOverlayRafRunning=false; // debug flag: false when loop is stopped
function _raceOverlayRafLoop(){
  if(!window._raceOverlayRafRunning) return;
  if(state.raceActive && state.raceData && !state.raceData.pendingDecision){
    renderActiveRaceBlock();
  }
  _raceOverlayRafId=requestAnimationFrame(_raceOverlayRafLoop);
}
function openRaceOverlay(){
  const ov=document.getElementById('race-overlay');
  if(ov.style.display==='block') return;
  ov.style.display='block';
  document.body.style.overflow='hidden';
  window._raceOverlayRafRunning=true;
  cancelAnimationFrame(_raceOverlayRafId);
  _raceOverlayRafId=requestAnimationFrame(_raceOverlayRafLoop);
}
function closeRaceOverlay(){
  const ov=document.getElementById('race-overlay');
  ov.style.display='none';
  document.body.style.overflow='';
  _raceAbandonArmed=false;
  const btn=document.getElementById('race-overlay-abandon-btn');
  if(btn){ btn.textContent='Abandon'; btn.classList.remove('armed'); }
  window._raceOverlayRafRunning=false;
  cancelAnimationFrame(_raceOverlayRafId);
  _raceOverlayRafId=null;
}
let _raceAbandonArmed=false, _raceAbandonTimer=null;
function requestAbandonRace(){
  if(!state.raceActive) return;
  const btn=document.getElementById('race-overlay-abandon-btn');
  if(!_raceAbandonArmed){
    _raceAbandonArmed=true;
    if(btn){ btn.textContent='Tap again to abandon — no refund'; btn.classList.add('armed'); }
    clearTimeout(_raceAbandonTimer);
    _raceAbandonTimer=setTimeout(()=>{
      _raceAbandonArmed=false;
      if(btn){ btn.textContent='Abandon'; btn.classList.remove('armed'); }
    },4000);
    return;
  }
  clearTimeout(_raceAbandonTimer);
  _raceAbandonArmed=false;
  abandonRace();
}
// Ends the current race with no prize/points and no energy refund. Cooldown
// for the race type still applies (already set nowhere yet — abandon doesn't
// grant one either, matching "abandon gives you nothing, costs you nothing extra").
function abandonRace(){
  if(!state.raceActive) return;
  state.raceActive=false; state.raceData=null;
  closeRaceOverlay();
  updateActivityDots(); saveGame();
  if(currentTab==='race') renderRaceTab();
  showToast('🏳️ Race abandoned — no prize, energy not refunded');
}
function renderActiveRaceBlock(){
  const wrap=document.getElementById('race-overlay-body');
  if(!state.raceActive||!state.raceData){ wrap.innerHTML=''; return; }
  const rd=state.raceData, rt=RACE_TYPES.find(r=>r.id===rd.typeId); if(!rt){ wrap.innerHTML=''; return; }
  const now=Date.now();
  const elapsed=getEffectiveElapsed(rd,now); // paused during decision cards
  const progress=Math.min(1,elapsed/rd.animMs);
  const remaining=Math.max(0,Math.ceil((rd.animMs-elapsed)/1000));

  // Header — Grand Tour stages show their own stage name/place/icon; regular
  // calendar events show the event name; normal races show the race type plus
  // this hour's rotating course name (same one shown on the race card).
  const gtStage=getGrandTourStage(rd);
  const course=getRaceCourse(rd);
  let headIcon=rt.icon, headName=`${rt.name} — ${RACE_CATEGORIES[state.raceCategory].shortName}`;
  if(gtStage){
    const tourEv=CALENDAR_EVENTS.find(e=>e.id===rd.calendarEventId);
    headIcon=gtStage.icon;
    headName=`${tourEv?tourEv.name+' — ':''}${gtStage.name}: ${gtStage.place}`;
  } else if(rd.isCalendarEvent){
    const ev=CALENDAR_EVENTS.find(e=>e.id===rd.calendarEventId);
    if(ev){ headIcon=ev.icon; headName=ev.name; }
  } else if(course){
    headIcon=course.icon;
    headName=`${course.name} — ${RACE_CATEGORIES[state.raceCategory].shortName}`;
  }

  // Stage decision trigger points — now drawn as flags directly on the course
  // profile SVG (see buildCourseProfileSVG) rather than as pips on a plain bar.
  // Terrain shape and colour come from the rolled course when present; calendar
  // events (no course) fall back to the base race-type profile. Grand Tour
  // stages override everything with their own authored profile/commentary.
  const stages=rd.stages||[];
  const profileSrc=gtStage ? {id:gtStage.id, profile:gtStage.profile, colorVar:'red'}
                    : course ? {id:course.id, profile:course.profile, colorVar:rt.colorVar} : rt;
  const courseProfileSvg=buildCourseProfileSVG(profileSrc, progress, stages, true);
  const courseMiniMapSvg=buildCourseMiniMapSVG(profileSrc, progress, stages);
  const commentarySrc=gtStage ? gtStage.commentary : course ? course.commentary : rt.commentary;

  // Race Legs bar
  const legs=rd.raceLegs??100;
  const legsPct=Math.round(legs);
  const legsCol=legs>60?'var(--green-txt)':legs>30?'var(--amber-txt)':'var(--red-txt)';

  // PHASE E — final 5% of the race gets sprint-finish presentation: gold timer,
  // a subtle shake on the profile/strip, and (when no decision card/result is
  // showing) a swapped-in sprint commentary line instead of the normal rotation.
  const isFinalSprint=progress>=0.95 && progress<1;

  // Decision card (if pending) OR last decision result (brief feedback) OR commentary
  let middleHtml='';
  if(rd.pendingDecision){
    const {event, startedAt}=rd.pendingDecision;
    const decisionAge=Date.now()-startedAt;
    const timerPct=Math.max(0,Math.round((1-decisionAge/30000)*100));
    const timerSec=Math.max(0,Math.ceil((30000-decisionAge)/1000));

    const timerHtml=rd.pendingDecision.selectedChoiceId?''
      :`<div class="decision-timer">
        <div class="decision-timer-bar"><div class="decision-timer-fill" style="width:${timerPct}%"></div></div>
        <div class="decision-timer-text">Auto in ${timerSec}s</div>
      </div>`;
    const choicesHtml=event.choices.map(c=>{
      const legsAfter=Math.max(0,legs-c.raceLegsConst);
      const legsTag=c.raceLegsConst>0
        ? `<span class="decision-btn-legs" style="color:${legsAfter<20?'var(--red-txt)':'var(--amber-txt)'}">🔥 -${c.raceLegsConst} legs</span>`
        : `<span class="decision-btn-legs" style="color:var(--green-txt)">🔥 No cost</span>`;
      const isSelected=rd.pendingDecision.selectedChoiceId===c.id;
      const selectedStyle=isSelected
        ?'border-color:var(--green-txt);background:var(--green-bg);'
        :rd.pendingDecision.selectedChoiceId?'opacity:0.45;pointer-events:none;':'' ;
      return `<button class="decision-btn" onclick="makeRaceDecision('${c.id}')"
          style="${selectedStyle}">
        <div style="flex:1">
          <div class="decision-btn-label">${isSelected?'✅ ':''} ${c.label}</div>
          <div class="decision-btn-detail">${isSelected?'<em>Committed — applying...</em>':c.detail}</div>
        </div>
        <div class="decision-btn-cost">${legsTag}</div>
      </button>`;
    }).join('');

    const sheetInCls=decisionAge<400?' sheet-in':'';
    middleHtml=`<div class="decision-card${sheetInCls}">
      <div class="decision-headline">${event.headline}</div>
      <div class="decision-situation">${event.situation}</div>
      <div class="decision-choices">${choicesHtml}</div>
      ${timerHtml}
    </div>`;
  } else if(rd.lastDecisionResult){
    // Show feedback from the last decision for a few seconds
    const r=rd.lastDecisionResult;
    middleHtml=`<div class="decision-result">
      <strong>${r.autoSelected?'⏱️ Auto-selected:':''} ${r.label}</strong><br>
      ${r.deltaStr} · Race legs remaining: <strong style="color:${r.legsCol}">${r.legsLeft}</strong>
    </div>`;
    // Clear the feedback after 4 seconds to return to normal commentary
    if(!rd._decisionResultShownAt) rd._decisionResultShownAt=Date.now();
    if(Date.now()-rd._decisionResultShownAt>4000){ rd.lastDecisionResult=null; rd._decisionResultShownAt=null; }
  } else if(isFinalSprint){
    middleHtml=`<div class="race-commentary sprint-line">🏁 It's flat out for the line!</div>`;
  } else {
    middleHtml=`<div class="race-commentary">${commentarySrc[rd.commentaryIdx]||commentarySrc[commentarySrc.length-1]}</div>`;
  }

  // PHASE E — position-change ticker chip. Fires once per resolved decision by
  // keying off rd.lastDecisionResult (already existing, transient) via a small
  // transient timestamp so it fades on its own and doesn't re-trigger every tick.
  let tickerHtml='';
  if(rd.lastDecisionResult){
    const r=rd.lastDecisionResult;
    if(!r._tickerShownAt) r._tickerShownAt=Date.now();
    const tickerAge=Date.now()-r._tickerShownAt;
    if(tickerAge<2200 && r.deltaStr && r.deltaStr.indexOf('No position change')===-1){
      const isGain=r.deltaStr.indexOf('📈')!==-1;
      const placesMatch=r.deltaStr.match(/(\d+)\s+position/);
      const places=placesMatch?placesMatch[1]:'';
      tickerHtml=`<div class="position-ticker ${isGain?'gain':'loss'}">${isGain?'📈 +':'📉 -'}${places} place${places==='1'?'':'s'}!</div>`;
    }
  }

  wrap.innerHTML=`<div class="active-race">
    ${tickerHtml}
    <div class="race-run-head"><span style="font-size:18px">${headIcon}</span><span class="race-run-name">${headName}</span><span class="race-run-timer${isFinalSprint?' sprint-gold':''}">${remaining}s</span></div>
    <div class="course-minimap-wrap">${courseMiniMapSvg}</div>
    <div class="course-profile-wrap${isFinalSprint?' sprint-shake':''}">${courseProfileSvg}</div>
    <div class="race-legs-row">
      <span class="race-legs-label">🔥 Race Legs</span>
      <div class="race-legs-track"><div class="race-legs-fill" style="width:${legsPct}%;background:${legsCol}"></div></div>
      <span class="race-legs-val" style="color:${legsCol}">${legsPct}</span>
    </div>
    ${middleHtml}
    <div class="peloton-strip-wrap${isFinalSprint?' sprint-shake':''}">${buildPelotonStripSVG(rd)}</div>
    <div class="race-pos-row"><span>🏃 Position: <strong>${ordinal(rd.virtualPos||1)} / ${rd.result.fieldSize}</strong></span><span>${rd.result.fieldSize} riders</span></div>
  </div>`;
}

// Shared markup for a single race-result card — used by both the Race tab's
// "recent result" slot and the fullscreen overlay's result mode, so the two
// never drift out of sync (single source of truth for how a result looks).
function buildRaceResultCardHtml(r){
  const posCls=r.position===1?'pos-1':r.position===2?'pos-2':r.position===3?'pos-3':'pos-other';
  const cat=RACE_CATEGORIES[state.raceCategory];
  const ptsPct=Math.min(100,Math.round(state.categoryPoints/cat.ptsToPromote*100));
  const isCalResult = !!r.isCalEvent;
  // Soft coaching hint — only fires outside the podium, and only for normal
  // category races (a fixed elite calendar field isn't representative enough
  // to draw a fair "you should train X" conclusion from). Picked once per
  // result and left stable (not re-rolled on every render) via a cache on
  // the result object itself.
  let hintHtml='';
  if(!isCalResult && r.position>3 && r.raceTypeId && RACE_STAT_HINTS[r.raceTypeId]){
    if(!r._hintText){
      const pool=RACE_STAT_HINTS[r.raceTypeId];
      r._hintText=pool[Math.floor(Math.random()*pool.length)];
    }
    hintHtml=`<div class="result-hint">💭 ${r._hintText}</div>`;
  }
  return `<div class="race-result-card">
    <div class="result-head">
      <div class="result-pos-badge ${posCls}">${ordinal(r.position)}</div>
      <div class="result-info"><div class="result-title">${r.raceTypeName} — ${r.catName}</div><div class="result-sub">${r.position} of ${r.fieldSize} riders · ${new Date(r.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div></div>
    </div>
    <div class="result-rewards">
      ${r.prize>0?`<span class="result-reward-pill result-reward-money">+${fmtMoney(r.prize)}</span>`:`<span class="result-reward-pill result-reward-none">No prize</span>`}
      ${r.points>0?`<span class="result-reward-pill result-reward-pts">+${r.points} pts</span>`:''}
    </div>
    ${isCalResult
      ? `<div class="result-cat-progress">📅 Calendar event — doesn't affect category points or cooldowns</div>`
      : `<div class="result-cat-progress">Category progress: <strong>${state.categoryPoints} / ${cat.ptsToPromote} pts</strong> — ${ptsPct}% to promotion</div>`}
    ${hintHtml}
  </div>`;
}
function renderRaceResultBlock(){
  const wrap=document.getElementById('race-result-wrap');
  if(!state.lastRaceResult||state.raceActive){ wrap.innerHTML=''; return; }
  wrap.innerHTML=buildRaceResultCardHtml(state.lastRaceResult);
}
// Overlay's result mode — shown after completeRace() while the overlay stays
// open. Single full-width Continue button closes the overlay and returns to
// the Race tab. Only renders when the overlay is actually in result mode
// (race finished, overlay still open) so it never fights renderActiveRaceBlock.
function renderRaceOverlayResult(){
  const wrap=document.getElementById('race-overlay-body');
  if(!state.lastRaceResult) return;
  wrap.innerHTML=buildRaceResultCardHtml(state.lastRaceResult)
    +`<button class="race-overlay-continue-btn" onclick="closeRaceOverlay();showTab('race')">Continue</button>`;
  // PHASE E — podium celebration (result mode only, top 3). Applied as a DOM
  // class toggle after the shared card markup renders, so buildRaceResultCardHtml
  // (also used by the small Race-tab result slot) stays untouched.
  if(state.lastRaceResult.position<=3){
    const card=wrap.querySelector('.race-result-card');
    const badge=wrap.querySelector('.result-pos-badge');
    if(card) card.classList.add('podium-card');
    if(badge) badge.classList.add('podium-celebrate');
  }
}

function renderRaceTypes(){
  const list=document.getElementById('race-list'); list.innerHTML='';
  const now=Date.now(), cat=RACE_CATEGORIES[state.raceCategory];
  RACE_TYPES.forEach(rt=>{
    const cdEnd=state.raceCooldowns[rt.id]||0, onCd=cdEnd>now;
    const actualCost=getWeatherEnergyCost(cat.energyCost);
    const noEnergy=state.energy<actualCost, busy=state.raceActive||state.session.active;
    const available=!onCd&&!noEnergy&&!busy;
    const equipBonus=getEquipmentBonusForRace(rt.id);
    const bonusCol=equipBonus>0?'var(--green-txt)':equipBonus<0?'var(--red-txt)':'var(--txt3)';
    const bonusBg=equipBonus>0?'var(--green-bg)':equipBonus<0?'var(--red-bg)':'var(--bg3)';
    const weightFactor=getWeightFactorForRace(rt.id);
    const weightPct=Math.round((weightFactor-1)*100);
    const showWeightBadge=(WEIGHT_SENSITIVITY[rt.id]||0)>0 && Math.abs(weightPct)>=1;
    const weightCol=weightPct>0?'var(--green-txt)':'var(--red-txt)';
    const weightBg=weightPct>0?'var(--green-bg)':'var(--red-bg)';
    // Weather score badge for this race type
    const {condition,intensity}=getDailyWeather();
    const wxBase=condition.scoreEffect[rt.id]||0;
    const wxPct=Math.round(wxBase*WEATHER_INTENSITY_MULTS[intensity]*100);
    const showWxBadge=Math.abs(wxPct)>=1;
    const wxCol=wxPct>0?'var(--green-txt)':'var(--red-txt)';
    const wxBg=wxPct>0?'var(--green-bg)':'var(--red-bg)';
    let statusHtml;
    if(onCd)      statusHtml=`<span class="race-status" style="color:var(--txt2)">⏳ ${fmtTime(cdEnd-now)}</span>`;
    else if(busy) statusHtml=`<span class="race-status" style="color:var(--txt3)">Busy</span>`;
    else if(noEnergy) statusHtml=`<span class="race-status" style="color:var(--red-txt)">⚡ ${Math.floor(state.energy)}/${actualCost}</span>`;
    else statusHtml=`<span class="race-status" style="color:var(--green-txt)">▶ Race</span>`;
    // Deliberately not shown to the player: which stat matters most per race
    // type is meant to be worked out from results, not read off a badge. See
    // the post-race hint in renderRaceResultBlock for the "soft" version of
    // this — a nudge only after a poor finish, not a permanent readout.
    // Show energy cost with weather suffix if it differs from base
    const energyDisplay=actualCost!==cat.energyCost
      ? `<span class="race-energy-badge${noEnergy?' unaffordable':''}">⚡ ${actualCost}<span style="font-size:9px;opacity:.7"> (wx)</span></span>`
      : `<span class="race-energy-badge${noEnergy?' unaffordable':''}">⚡ ${actualCost}</span>`;
    // Which specific named course is on offer this hour for this race type —
    // what's shown here is exactly what startRace will use if the player taps.
    const course=getHourlyCourse(rt.id);
    const courseLine=course?`<div class="race-course-line">${course.icon} <strong>${course.name}</strong></div>`:'';
    const div=document.createElement('div'); div.className='race-card'+(available?' available':'');
    if(!available) div.style.opacity='0.65';
    div.innerHTML=`<div class="race-card-head"><div class="race-type-icon">${rt.icon}</div><div class="race-card-text"><div class="race-card-name">${rt.name}</div><div class="race-card-desc">${rt.desc}</div></div>${statusHtml}</div>
      ${courseLine}
      <div class="race-meta">
        ${energyDisplay}
        <span class="race-meta-badge race-prize-badge">Prize: £${cat.prizes[cat.prizes.length-1]||0}–${fmtMoney(cat.prizes[0])}</span>
        <span class="race-equip-bonus" style="background:${bonusBg};color:${bonusCol};padding:2px 7px;border-radius:99px;font-weight:700;font-size:10px">⚙️ ${equipBonus>0?'+':''}${equipBonus}w</span>
        ${showWeightBadge?`<span class="race-equip-bonus" style="background:${weightBg};color:${weightCol};padding:2px 7px;border-radius:99px;font-weight:700;font-size:10px">⚖️ ${weightPct>0?'+':''}${weightPct}%</span>`:''}
        ${showWxBadge?`<span class="race-equip-bonus" style="background:${wxBg};color:${wxCol};padding:2px 7px;border-radius:99px;font-weight:700;font-size:10px">${condition.icon} ${wxPct>0?'+':''}${wxPct}%</span>`:''}
      </div>`;
    if(available) div.addEventListener('click',()=>startRace(rt.id));
    list.appendChild(div);
  });
  // Rotation countdown — makes the hourly course change read as a deliberate
  // mechanic ("new courses soon") rather than something that just happens.
  const msLeft=3600000-(Date.now()%3600000);
  const minLeft=Math.max(1,Math.ceil(msLeft/60000));
  const countdownDiv=document.createElement('div');
  countdownDiv.style.cssText='font-size:11px;color:var(--txt3);text-align:center;margin-top:6px';
  countdownDiv.textContent=`🔄 New courses in ${minLeft}m`;
  list.appendChild(countdownDiv);
}

function renderRaceHistory(){
  const wrap=document.getElementById('race-history');
  if(!state.raceHistory.length){ wrap.innerHTML=`<div style="font-size:13px;color:var(--txt3);text-align:center;padding:1rem">No races yet — start your first race above</div>`; return; }
  wrap.innerHTML=state.raceHistory.map(r=>`<div class="history-row">
    <div class="history-pos${r.position<=3?' top3':''}">${ordinal(r.position)}</div>
    <div class="history-detail"><strong>${r.raceTypeName}</strong><br>${r.catName} · ${r.fieldSize} riders</div>
    <div class="history-prize">${r.prize>0?'+'+fmtMoney(r.prize):'—'}</div>
  </div>`).join('');
}

function renderRiderTab(){ renderRiderStats(); renderFtpChart(); renderSpecialisation(); renderAttrCards(); renderPrestige(); renderStats(); }

// Chart.js instance — held in module scope so we can destroy and recreate cleanly
// when the tab re-renders (avoids the "canvas already in use" error).
let _ftpChartInstance = null;

function renderFtpChart(){
  const wrap=document.getElementById('ftp-chart-wrap'); if(!wrap) return;
  const history=state.ftpHistory||[];

  // Not enough data yet — show a friendly placeholder explaining what it tracks
  if(history.length<2){
    if(_ftpChartInstance){ _ftpChartInstance.destroy(); _ftpChartInstance=null; }
    wrap.innerHTML=`<div style="background:var(--bg);border:.5px solid var(--border);border-radius:var(--radius);padding:18px 16px;text-align:center;color:var(--txt3);font-size:12px;line-height:1.6">
      📈 Your FTP and W/kg chart will appear here as you train.<br>
      <span style="font-size:11px">Data points record every time your FTP or bodyweight changes.</span>
    </div>`;
    return;
  }

  // Format x-axis labels: if all points are from the same day, use HH:MM;
  // otherwise use short date (e.g. "19 Jun").
  const firstTs=history[0].ts, lastTs=history[history.length-1].ts;
  const spanDays=(lastTs-firstTs)/(1000*60*60*24);
  const labels=history.map(p=>{
    const d=new Date(p.ts);
    if(spanDays<1) return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    return d.toLocaleDateString([],{day:'numeric',month:'short'});
  });

  const ftpData  =history.map(p=>p.ftp);
  const pwkgData =history.map(p=>p.pwkg);
  const weightData=history.map(p=>p.weight);

  // Destroy old instance before rebuilding — avoids "canvas is already in use" errors
  if(_ftpChartInstance){ _ftpChartInstance.destroy(); _ftpChartInstance=null; }
  wrap.innerHTML=`<div style="background:var(--bg);border:.5px solid var(--border);border-radius:var(--radius);padding:10px 12px;">
    <canvas id="ftp-chart-canvas" height="200"></canvas>
    <div style="display:flex;gap:16px;justify-content:center;margin-top:8px;flex-wrap:wrap;font-size:10px;color:var(--txt3)">
      <span>🟡 FTP (watts, left axis)</span>
      <span>🟢 W/kg (right axis)</span>
      <span>🔵 Weight kg (right axis)</span>
    </div>
  </div>`;

  const canvas=document.getElementById('ftp-chart-canvas');
  if(!canvas||typeof Chart==='undefined') return;

  // Compute sensible axis mins so small FTP gains still look visually significant
  const ftpMin=Math.max(0,Math.min(...ftpData)-20);
  const ftpMax=Math.min(600,Math.max(...ftpData)+20);
  const pwkgMin=Math.max(0,Math.min(...pwkgData,Math.min(...weightData))-5);
  const pwkgMax=Math.max(...pwkgData,Math.max(...weightData))+5;

  _ftpChartInstance=new Chart(canvas,{
    type:'line',
    data:{
      labels,
      datasets:[
        {
          label:'FTP (w)',
          data:ftpData,
          borderColor:'#b8860b',
          backgroundColor:'rgba(184,134,11,0.08)',
          yAxisID:'yFtp',
          tension:0.35,
          pointRadius:ftpData.length>40?0:3,
          borderWidth:2,
          fill:true,
        },
        {
          label:'W/kg',
          data:pwkgData,
          borderColor:'#0f6e56',
          backgroundColor:'transparent',
          yAxisID:'yRight',
          tension:0.35,
          pointRadius:pwkgData.length>40?0:3,
          borderWidth:2,
          borderDash:[],
        },
        {
          label:'Weight (kg)',
          data:weightData,
          borderColor:'#185fa5',
          backgroundColor:'transparent',
          yAxisID:'yRight',
          tension:0.35,
          pointRadius:weightData.length>40?0:3,
          borderWidth:1.5,
          borderDash:[4,4],
        },
      ],
    },
    options:{
      responsive:true,
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{display:false},
        tooltip:{
          callbacks:{
            label:ctx=>{
              const labels={ftp:'FTP',pwkg:'W/kg',weight:'Weight'};
              const units={0:'w',1:'W/kg',2:'kg'};
              return ` ${ctx.dataset.label}: ${ctx.parsed.y}${units[ctx.datasetIndex]||''}`;
            },
          },
        },
      },
      scales:{
        x:{
          ticks:{font:{size:9},maxTicksLimit:8,maxRotation:0},
          grid:{color:'rgba(0,0,0,0.05)'},
        },
        yFtp:{
          position:'left',
          min:ftpMin,
          max:ftpMax,
          ticks:{font:{size:9},callback:v=>v+'w'},
          grid:{color:'rgba(0,0,0,0.05)'},
          title:{display:true,text:'FTP',font:{size:9},color:'#b8860b'},
        },
        yRight:{
          position:'right',
          min:pwkgMin,
          max:pwkgMax,
          ticks:{font:{size:9}},
          grid:{drawOnChartArea:false},
          title:{display:true,text:'W/kg · kg',font:{size:9},color:'#0f6e56'},
        },
      },
    },
  });
}

function renderRiderStats(){
  const container=document.getElementById('rider-stats'), rs=getRiderStats();
  const ftpPct=Math.round(rs.ftp/MAX_FTP*100);
  const ftpMaxed=rs.ftp>=MAX_FTP;

  // FTP is built from three attributes at different weights — show each one's XP
  // progress toward its next level, and exactly how many extra watts that level will add.
  const FTP_CONTRIBUTORS=[
    {attr:'endurance', base:14},
    {attr:'power',     base:16},
    {attr:'threshold', base:20},
  ];
  const rouleurMult = state.specialisation==='rouleur' ? 1.10 : 1;
  const ftpContribHtml = FTP_CONTRIBUTORS.map(c=>{
    const def=ATTR_DEFS[c.attr], a=state.attributes[c.attr], cv=def.colorVar;
    const needed=xpForLevel(a.level), pct=needed>0?Math.min(100,Math.round(a.xp/needed*100)):100;
    const gain=Math.round(c.base*rouleurMult);
    return `<div class="ftp-contrib-item">
      <span class="ftp-contrib-icon">${def.icon}</span>
      <span class="ftp-contrib-label">${def.name}</span>
      <div class="ftp-contrib-bar-wrap"><div class="ftp-contrib-bar" style="width:${pct}%;background:var(--${cv}-txt)"></div></div>
      <span class="ftp-contrib-gain" style="color:var(--${cv}-txt)">${ftpMaxed?'MAXED':'+'+gain+'w'}</span>
    </div>`;
  }).join('');

  // VO2 Max and Sprint Power are each driven by a single attribute — show progress
  // toward that attribute's next level (i.e. "how close to improving") rather than
  // progress toward the absolute elite cap, which wasn't actionable info.
  const vo2A=state.attributes.vo2, vo2Needed=xpForLevel(vo2A.level);
  const vo2Pct=vo2Needed>0?Math.min(100,Math.round(vo2A.xp/vo2Needed*100)):100;
  const vo2Maxed=rs.vo2max>=MAX_VO2;

  const sprA=state.attributes.sprint, sprNeeded=xpForLevel(sprA.level);
  const sprPct=sprNeeded>0?Math.min(100,Math.round(sprA.xp/sprNeeded*100)):100;
  const sprMaxed=rs.sprintPower>=MAX_SPRINT;

  const smallStats=[
    {label:'VO₂ Max',val:rs.vo2max,unit:'ml/kg',
     sublabel:vo2Maxed?'Elite cap reached':`Lv${vo2A.level} → +5.5 next lvl`,
     pct:vo2Pct,colorVar:'red',icon:'🔥'},
    {label:'Sprint Power',val:rs.sprintPower,unit:'w',
     sublabel:sprMaxed?'Elite cap reached':`Lv${sprA.level} → +170w next lvl`,
     pct:sprPct,colorVar:'purple',icon:'⚡'},
    {label:'Race Bonus',val:`+${getEquipmentBonusForRace('road')}w`,unit:'',sublabel:'Gear (road)',pct:Math.min(100,Math.round(getEquipmentBonusForRace('road')/80*100)),colorVar:'teal',icon:'⚙️'},
  ];

  // Power-to-weight — the headline real-world cycling metric. Shown as its own
  // secondary hero card since it matters as much as raw FTP, especially for climbing.
  const pw=getPowerToWeight();
  const weightDelta=state.riderWeight-DEFAULT_RIDER_WEIGHT;
  const pwDeltaHtml=weightDelta>0.05
    ? `<span style="color:var(--red-txt)">+${weightDelta.toFixed(1)}kg vs default — hurts climbs</span>`
    : weightDelta<-0.05
      ? `<span style="color:var(--green-txt)">${weightDelta.toFixed(1)}kg vs default — helps climbs</span>`
      : `<span style="color:var(--txt3)">at default weight</span>`;

  container.innerHTML=`<div class="rsc-ftp-hero">
      <div class="rsc-ftp-icon">🏆</div>
      <div class="rsc-ftp-body">
        <div class="rsc-ftp-num">${rs.ftp}<span style="font-size:18px;font-weight:500">w</span></div>
        <div class="rsc-ftp-sub">Functional Threshold Power · Target ${MAX_FTP}w</div>
        <div class="rsc-ftp-bar-wrap"><div class="rsc-ftp-bar" style="width:${ftpPct}%"></div></div>
      </div>
      <div style="font-size:13px;font-weight:700;color:var(--amber-txt)">${ftpPct}%</div>
    </div>
    <div class="pw-hero">
      <div class="pw-hero-icon">⚖️</div>
      <div class="pw-hero-body">
        <div class="pw-hero-num">${pw.toFixed(2)}<span style="font-size:14px;font-weight:500">W/kg</span></div>
        <div class="pw-hero-sub">Power-to-Weight · ${state.riderWeight.toFixed(1)}kg bodyweight · ${pwDeltaHtml}</div>
      </div>
    </div>
    <div class="ftp-contrib-wrap">
      <div class="ftp-contrib-title">Progress to next FTP increase</div>
      ${ftpContribHtml}
    </div>
    <div class="rider-stats-grid">
      ${smallStats.map(s=>`<div class="rider-stat-card" style="border-color:var(--${s.colorVar}-bd);background:var(--${s.colorVar}-bg)">
        <div class="rsc-icon">${s.icon}</div>
        <div class="rsc-val" style="color:var(--${s.colorVar}-txt)">${s.val}<span class="rsc-unit">${s.unit}</span></div>
        <div class="rsc-label">${s.label}</div>
        <div class="rsc-bar-wrap"><div class="rsc-bar" style="width:${Math.max(0,Math.min(100,s.pct))}%;background:var(--${s.colorVar}-txt)"></div></div>
        <div class="rsc-sublabel">${s.sublabel}</div>
      </div>`).join('')}
    </div>`;
}

function renderAchievements(){
  const area=document.getElementById('ach-area'); if(!area) return;
  const earned=state.earnedAchievements.size, total=ACHIEVEMENTS.length;
  // Only count money actually collected — an earned-but-uncollected achievement
  // hasn't paid out yet, so it shouldn't inflate this total.
  const totalPrize=ACHIEVEMENTS.filter(a=>a.reward.type==='money'&&state.earnedAchievements.has(a.id)&&!state.uncollectedAchievements.has(a.id)).reduce((s,a)=>s+a.reward.val,0);
  const headerHtml=`<div style="font-size:12px;color:var(--txt2);margin-bottom:.6rem"><strong>${earned}</strong> / ${total} unlocked${totalPrize>0?' · '+fmtMoney(totalPrize)+' earned in achievement prizes':''}</div>`;
  const cardsHtml=ACHIEVEMENTS.map(ach=>{
    const done=state.earnedAchievements.has(ach.id);
    const uncollected=state.uncollectedAchievements.has(ach.id);
    const prog=ach.progress?ach.progress(state):null;
    const collectedColor=ach.reward.type==='color'?'var(--purple-txt)':'var(--green-txt)';
    const rewardColor=uncollected?'var(--amber-txt)':done?collectedColor:'var(--txt3)';
    // Earned-but-uncollected cards are tappable — re-opens the collect ceremony,
    // covering the rare case where a player closed the app before tapping
    // Collect on the original popup (also auto-requeued at boot, see BOOT section).
    const clickAttr=uncollected?`onclick="enqueueCeremony({type:'achievement',achievementId:'${ach.id}'})" style="cursor:pointer"`:'';
    return `<div class="ach-card ${done?'earned':'locked'}" ${clickAttr}>
      <div class="ach-check">${uncollected?'🎁':done?'✅':''}</div>
      <div class="ach-icon">${ach.icon}</div>
      <div class="ach-name">${ach.name}</div>
      <div class="ach-desc">${ach.desc}</div>
      ${prog&&!done?`<div class="ach-prog">${prog}</div>`:''}
      ${uncollected?`<div class="ach-prog" style="color:var(--amber-txt);font-weight:700">Tap to collect!</div>`:''}
      <div class="ach-reward" style="color:${rewardColor}">${ach.reward.label}</div>
    </div>`;
  }).join('');
  area.innerHTML=headerHtml+`<div class="ach-grid">${cardsHtml}</div>`;
}

// FIX 1: buildEquipCard — removed spurious third stat-bar block that caused duplicate
// aero bars on kit items (fired when maxAero was defined AND maxClimb was undefined)
function buildEquipCard({icon,brand,model,name,tier,type,desc,price,aeroWatts,climbWatts,owned,equipped,onBuy,onEquip,maxAero,maxClimb}){
  const div=document.createElement('div');
  div.className='equip-card'+(equipped?' equipped':'')+(owned?' owned':price<=state.money?' affordable':' cant-afford');

  const tierCls=`tier-${tier}`, tierLabel=['','I','II','III','IV','V'][tier];
  const typeLabels={allrounder:'All-rounder',aero:'Aero',climbing:'Climbing',tt:'Time Trial',standard:'Standard',racing:'Racing',deep:'Deep Section',disc:'Disc',road:'Road',skinsuit:'Skinsuit'};
  const typeLabel=type?typeLabels[type]||type:'';
  const priceStr=price===0?'Free':fmtMoney(price);

  // Stat bars — each axis rendered independently, no overlap
  let statBarsHtml='';
  if(maxAero!==undefined){
    const aeroPct=Math.max(0,Math.min(100,Math.round((aeroWatts/maxAero)*100)));
    const aeroCol=aeroWatts<0?'var(--red-txt)':'var(--blue-txt)';
    statBarsHtml+=`<div class="stat-bar-row"><span class="stat-bar-lbl">Aero</span><div class="stat-bar-outer"><div class="stat-bar-inner" style="width:${Math.max(0,aeroPct)}%;background:${aeroCol}"></div></div><span class="stat-bar-val" style="color:${aeroCol}">${aeroWatts>0?'+':''}${aeroWatts}w</span></div>`;
  }
  if(maxClimb!==undefined){
    const climbPct=Math.max(0,Math.min(100,Math.round((climbWatts/maxClimb)*100)));
    const climbCol=climbWatts<0?'var(--red-txt)':'var(--teal-txt)';
    statBarsHtml+=`<div class="stat-bar-row"><span class="stat-bar-lbl">Climb</span><div class="stat-bar-outer"><div class="stat-bar-inner" style="width:${Math.max(0,climbPct)}%;background:${climbCol}"></div></div><span class="stat-bar-val" style="color:${climbCol}">${climbWatts>0?'+':''}${climbWatts}w</span></div>`;
  }
  // (removed duplicate aero block that was here — was firing on kits alongside block 1)

  let actionHtml='';
  if(equipped){
    actionHtml=`<div class="equip-price owned">${priceStr}</div><button class="equip-btn btn-equipped">✓ Equipped</button>`;
  } else if(owned){
    actionHtml=`<div class="equip-price owned">Owned</div><button class="equip-btn btn-equip" data-equip="1">Equip</button>`;
  } else if(price<=state.money){
    actionHtml=`<div class="equip-price affordable">${priceStr}</div><button class="equip-btn btn-buy" data-buy="1">Buy</button>`;
  } else {
    actionHtml=`<div class="equip-price">${priceStr}</div><button class="equip-btn btn-locked">🔒 Buy</button>`;
  }

  div.innerHTML=`<div class="equip-head">
    <div class="equip-main">
      ${brand?`<div class="equip-brand">${brand}</div>`:''}
      <div class="equip-model">${model||name}</div>
      <div class="equip-desc">${desc}</div>
      <div class="equip-badges"><span class="tier-badge ${tierCls}">Tier ${tierLabel}</span>${typeLabel?`<span class="type-badge">${typeLabel}</span>`:''}</div>
      ${statBarsHtml?`<div class="stat-bars">${statBarsHtml}</div>`:''}
    </div>
    <div class="equip-action-col">${actionHtml}</div>
  </div>`;

  if(!owned&&price<=state.money) div.querySelector('[data-buy]')?.addEventListener('click', onBuy);
  if(owned&&!equipped)           div.querySelector('[data-equip]')?.addEventListener('click', onEquip);
  return div;
}

function renderBikeShop(){
  const list=document.getElementById('gear-section-bikes'); list.innerHTML='';
  const maxAero=38, maxClimb=36;
  const h2=document.createElement('div'); h2.className='section-lbl'; h2.textContent='Bikes — '+BIKES.length+' frames';
  list.appendChild(h2);
  BIKES.forEach(b=>{
    const card=buildEquipCard({
      brand:b.brand, model:b.model, tier:b.tier, type:b.type, desc:b.desc, price:b.price,
      aeroWatts:b.aeroWatts, climbWatts:b.climbWatts, maxAero, maxClimb,

// Formats a remaining-time string for an active timed Extra, e.g. "1d 7h left"
// or "42m left" once under an hour. Rounds UP to the minute so it never shows
// 0 while genuinely still active.
function fmtBoostRemaining(ms){
  if(ms<=0) return '';
  const totalMin=Math.ceil(ms/60000);
  const days=Math.floor(totalMin/1440);
  const hours=Math.floor((totalMin%1440)/60);
  if(days>0) return `${days}d ${hours}h left`;
  if(hours>0) return `${hours}h ${totalMin%60}m left`;
  return `${totalMin}m left`;
}

function renderSponsorsTab(){
  const wrap=document.getElementById('sponsors-content'); if(!wrap) return;
  const tierIdx=getCurrentSponsorTierIndex();

  // ── Termination cooldown ──────────────────────────────────────
  const terminateMsLeft=getSponsorTerminateCooldownRemaining();
  if(terminateMsLeft>0){
    const daysLeft=Math.ceil(terminateMsLeft/(24*60*60*1000));
    const hrsLeft=Math.ceil(terminateMsLeft/(60*60*1000));
    const label=daysLeft>1?`${daysLeft} days`:`${hrsLeft} hours`;
    wrap.innerHTML=`<div class="lifetime-placeholder">
      <div class="lifetime-placeholder-icon">⏳</div>
      <strong style="color:var(--txt2)">Cooling-Off Period</strong><br><br>
      You terminated your last contract. No sponsor will sign you for another
      <strong style="color:var(--red-txt)">${label}</strong>.<br><br>
      <span style="font-size:11px;color:var(--txt3)">Use this time to keep racing and building your win count.</span>
    </div>`;
    return;
  }

  // ── Not yet eligible ────────────────────────────────────────
  if(tierIdx<0){
    const firstTierCat=RACE_CATEGORIES[SPONSOR_TIERS[0].minCategory];
    const curCat=RACE_CATEGORIES[state.raceCategory];
    wrap.innerHTML=`<div class="lifetime-placeholder">
      <div class="lifetime-placeholder-icon">🔒</div>
      <strong style="color:var(--txt2)">Sponsorship Locked</strong><br><br>
      Sponsors want to see you racing competitively first. Get promoted to <strong>${firstTierCat.name}</strong> to attract your first local sponsorship offers.
      <div style="margin-top:.75rem;font-size:12px;color:var(--txt3)">Currently racing: <strong style="color:var(--txt2)">${curCat.name}</strong></div>
    </div>`;
    return;
  }

  const activeInfo=getActiveSponsorDef();

  // ── No active sponsor — show sign-up choices ─────────────────
  if(!activeInfo){
    if(sponsorViewMode==='choosing') renderSponsorChoices(wrap, tierIdx, false);
    else wrap.innerHTML=sponsorReadyCardHtml(tierIdx);
    return;
  }

  // ── Upgrade available — show choosing screen if selected ─────
  const upgradeAvailable=canUpgradeSponsor();
  if(upgradeAvailable && sponsorViewMode==='choosing'){
    renderSponsorChoices(wrap, tierIdx, true);
    return;
  }

  renderActiveSponsorView(wrap, activeInfo, upgradeAvailable, tierIdx);
}

      : `<button class="spec-btn spec-btn-unlock" onclick="signSponsor(${tierIdx},'${s.id}')">Sign with ${s.name}</button>`;
    return `<div class="spec-choice-card unlocked" style="border-color:var(--${s.color}-bd)">
      <div class="spec-choice-head">
        <div class="spec-choice-icon">${s.icon}</div>
        <div class="spec-choice-info">
          <div class="spec-choice-name">${s.name}</div>
