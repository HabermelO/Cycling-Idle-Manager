// DERIVED STATS
// ═══════════════════════════════════════════════════════════
function getRiderStats(){
  const a=state.attributes;
  let ftp = Math.round(50+a.endurance.level*14+a.power.level*16+a.threshold.level*20);
  // Rouleur passive: all FTP contributions +10%
  if(state.specialisation==='rouleur') ftp = Math.round(ftp*1.10);
  return {
    ftp:         Math.min(MAX_FTP, ftp),
    vo2max:      Math.min(MAX_VO2,    Math.round(30+a.vo2.level*5.5)),
    sprintPower: Math.min(MAX_SPRINT, Math.round(300+a.sprint.level*170)),
  };
}

// The headline cycling performance metric: watts per kilogram of bodyweight.
function getPowerToWeight(){
  return getRiderStats().ftp / state.riderWeight;
}

// Records a snapshot only when FTP or W/kg has actually moved from the last stored
// value (±1w or ±0.05 W/kg), so the chart fills with meaningful data points rather
// than repeating rows during inactive stretches. Capped at 90 entries.
function recordFtpSnapshot(){
  const ftp=getRiderStats().ftp;
  const pwkg=parseFloat(getPowerToWeight().toFixed(2));
  const weight=parseFloat(state.riderWeight.toFixed(1));
  const last=state.ftpHistory[state.ftpHistory.length-1];
  if(last && Math.abs(last.ftp-ftp)<1 && Math.abs(last.pwkg-pwkg)<0.05) return;
  state.ftpHistory.push({ts:Date.now(), ftp, pwkg, weight});
  if(state.ftpHistory.length>90) state.ftpHistory.shift();
}

// How much today's bodyweight helps or hurts a given race type, relative to the
// DEFAULT_RIDER_WEIGHT baseline. >1 = lighter-than-default advantage, <1 = heavier penalty.
// Blended by WEIGHT_SENSITIVITY so flat/drafting races barely notice, climbs notice fully.
function getWeightFactorForRace(raceTypeId){
  const sensitivity=WEIGHT_SENSITIVITY[raceTypeId]??0;
  if(sensitivity<=0) return 1;
  const rawFactor=DEFAULT_RIDER_WEIGHT/state.riderWeight;
  return 1+(rawFactor-1)*sensitivity;
}

function getEquipmentBonusForRace(raceTypeId){
  const bike  = BIKES.find(b=>b.id===state.equippedBike)   || BIKES[0];
  const wheel = WHEELS.find(w=>w.id===state.equippedWheels) || WHEELS[0];
  const kit   = KITS.find(k=>k.id===state.equippedKit)     || KITS[0];
  const w = EQUIP_WEIGHTS[raceTypeId] || {aero:0.5,climb:0.5};
  const totalAero  = bike.aeroWatts  + wheel.aeroWatts  + kit.aeroWatts;
  const totalClimb = bike.climbWatts + wheel.climbWatts;
  let bonus = Math.round(totalAero * w.aero + totalClimb * w.climb);
  // Climber passive: +10w on hill climbs from better weight-distribution intuition
  if(state.specialisation==='climber' && raceTypeId==='hill') bonus += 10;
  // Extras (Accessories) that grant flat watts (e.g. Clipless Pedals, Bike Fit)
  // apply equally across every race type — added here, in the single function
  // every scoring AND display call site shares, so the Rider tab's "Race Bonus"
  // stat and the race-card preview always agree with what racing actually scores.
  bonus += (D.accessoryWatts||0);
  return bonus;
}

function recalc(){
  // Extras (Accessories) — sum bonuses from every accessory currently
  // "active": permanent ones the player owns (boughtUpgrades), plus timed
  // ones with a live, unexpired entry in state.activeBoosts. A timed item is
  // simply never added to boughtUpgrades, so one loop covers both cleanly.
  let trainPct=0, racePct=0, watts=0;
  const now=Date.now();
  ACCESSORIES.forEach(u=>{
    const active = u.durationDays ? (state.activeBoosts[u.id]||0) > now : state.boughtUpgrades.has(u.id);
    if(!active) return;
    trainPct += (u.trainPct||0);
    racePct  += (u.racePct||0);
    watts    += (u.watts||0);
  });
  D.trainingBoostPct = trainPct;
  D.raceDayPct = racePct;
  D.accessoryWatts = watts;
  // Retired — no accessory ever actually granted passive sponsor income
  // (every entry was sponsorPerSec:0), so this always evaluated to 0 despite
  // the misleading comment that used to sit here. D.sponsorPerSec stays
  // defined at 0 since the offline-earnings tick still reads it.
  D.sponsorPerSec = 0;
  D.sessionMult   = (1 + state.attributes.threshold.level * 0.08) * (1 + trainPct);
  // Lifetime Goal perks — each track's tier-3 grants a small permanent boost to
  // race prize money, stacking across tracks. Read from claimedGoalTiers so it
  // survives prestige and reload with no separate state needed. Max +12% if
  // every track's perk tier has been claimed (6 tracks × 2%).
  let legacyPct=0;
  LIFETIME_GOALS.forEach(track=>{
    track.tiers.forEach((tier,idx)=>{
      if(tier.reward.type==='perk' && state.claimedGoalTiers.has(track.id+':'+idx)) legacyPct+=tier.reward.pct;
    });
  });
  D.legacyPrizeMult = 1+legacyPct;
}

// ═══════════════════════════════════════════════════════════
// XP
// ═══════════════════════════════════════════════════════════
function addXP(attrId, amount){
  const attr=state.attributes[attrId], def=ATTR_DEFS[attrId]; if(!attr||!def) return;
  const ftpBefore=getRiderStats().ftp;
  attr.xp += amount;
  let needed=xpForLevel(attr.level), leveled=false, maxLv=0;
  while(attr.xp>=needed){ attr.xp-=needed; attr.level++; leveled=true; maxLv=attr.level; recalc(); needed=xpForLevel(attr.level); }
  if(leveled){
    const ftpAfter=getRiderStats().ftp;
    const ftpStr=(['endurance','power','threshold'].includes(attrId)&&ftpAfter>ftpBefore)?` · FTP ${ftpBefore}→${ftpAfter}w`:'';
    showToast(`${def.icon} ${def.name} Level ${maxLv}!${ftpStr}`);
    recordFtpSnapshot();
    // FTP milestones and all-attrs achievement checked on level-up
    checkAchievements();
    checkLifetimeGoals();
  }
}

function earnMoney(n){ state.money+=n; state.seasonMoney+=n; state.lifetimeMoney+=n; }

function updateActivityDots(){
  document.getElementById('tab-btn-train').classList.toggle('session-active',!!state.session.active);
  document.getElementById('tab-btn-race').classList.toggle('race-active',!!state.raceActive);
}

// How much energy you'll wake up with tomorrow based on today's training load
function getTomorrowEnergy(){
  const fatigue = Math.round((state.energySpentToday||0) * FATIGUE_RATE);
  return Math.max(MIN_ENERGY_START, state.maxEnergy - fatigue);
}

// Returns the streak-milestone bonus reward for a given day count.
// xpBonus: array of {attr, amount} processed in collectMorningReward().
function getStreakReward(day){
  if(day>=30) return {type:'cash',  value:5000, icon:'🏆', label:'£5,000 prize bonus!'};
  if(day>=14) return {type:'cash',  value:2000, icon:'💎', label:'£2,000 prize bonus!'};
  if(day>=7)  return {type:'cash',  value:500,  icon:'⭐', label:'£500 + XP all attributes',
    xpBonus:[{attr:'endurance',amount:20},{attr:'power',amount:20},{attr:'vo2',amount:20},{attr:'sprint',amount:20},{attr:'threshold',amount:20}]};
  if(day===6) return {type:'xp', icon:'💪', label:'+20 XP — all attributes',
    xpBonus:[{attr:'endurance',amount:20},{attr:'power',amount:20},{attr:'vo2',amount:20},{attr:'sprint',amount:20},{attr:'threshold',amount:20}]};
  if(day===5) return {type:'xp', icon:'⚡', label:'+30 Sprint XP',
    xpBonus:[{attr:'sprint',amount:30}]};
  if(day===4) return {type:'xp', icon:'🔥', label:'+30 VO₂ Max XP',
    xpBonus:[{attr:'vo2',amount:30}]};
  if(day===3) return {type:'item', value:'shake', icon:'🥤', label:'Free Shake + 25 Threshold XP',
    xpBonus:[{attr:'threshold',amount:25}]};
  if(day===2) return {type:'xp', icon:'💪', label:'+30 Power XP',
    xpBonus:[{attr:'power',amount:30}]};
  if(day===1) return {type:'xp', icon:'🫀', label:'+30 Endurance XP',
    xpBonus:[{attr:'endurance',amount:30}]};
  return       {type:'none', value:0, icon:'⚡', label:'Energy restored'};
}

// Returns the next streak milestone the player hasn't reached yet, or null at max.
function getNextStreakMilestone(streak){
  const milestones=[{day:3,icon:'🥤'},{day:7,icon:'⭐'},{day:14,icon:'💎'},{day:30,icon:'🏆'}];
  return milestones.find(m=>m.day>streak)||null;
}

function checkDailyReset(){
  const now=new Date(), last=new Date(state.lastEnergyReset||0);
  if(now.toDateString()!==last.toDateString()){
    const nextEnergy = getTomorrowEnergy();
    // ── LOGIN STREAK: track consecutive calendar days ──────────
    const todayStr = now.toDateString();
    const yesterday = new Date(now); yesterday.setDate(yesterday.getDate()-1);
    const yesterdayStr = yesterday.toDateString();
    if(!state.lastLoginDate){
      state.loginStreak = 1;                           // first ever login
    } else if(state.lastLoginDate === yesterdayStr){
      state.loginStreak = (state.loginStreak||0) + 1;  // consecutive day — extend streak
    } else if(state.lastLoginDate !== todayStr){
      state.loginStreak = 1;                           // missed a day — streak broken
    }
    state.lastLoginDate = todayStr;
    // ── WITHHOLD ENERGY: restore only when player taps collect ─
    // Energy resets to 0 at the day boundary — yesterday's leftover doesn't carry
    // over. todayEnergyAllocation is the fatigue-adjusted ceiling for ALL regen
    // sources today (idle tick, offline catch-up, visibilitychange) so the fatigue
    // penalty can no longer be erased by leaving the app open/closed overnight.
    state.energy = 0;
    state.todayEnergyAllocation = nextEnergy;
    state.energySpentToday = 0;     // reset daily spend counter
    state.lastEnergyReset = Date.now();
    // Reset daily tasks alongside energy — same calendar-day boundary
    DAILY_TASKS.forEach(t=>{ state.dailyTasks.progress[t.id]=false; state.dailyTasks.claimed[t.id]=false; });
    state.dailyTasks.resetDate=Date.now();
    // Roll fresh prices/offers/benefits for the energy market
    ensureDailyMarket();
    // Weight dynamic: yesterday's excess carbs (if any) convert to weight gain now,
    // before today's counter resets to zero.
    let weightGainMsg=null;
    if(state.carbsToday>CARB_DAILY_LIMIT){
      const excess=state.carbsToday-CARB_DAILY_LIMIT;
      const gain=Math.round(excess*WEIGHT_GAIN_PER_EXCESS_CARB*100)/100;
      const before=state.riderWeight;
      state.riderWeight=Math.min(MAX_RIDER_WEIGHT, state.riderWeight+gain);
      if(state.riderWeight>before) weightGainMsg=`⚠️ Overate yesterday — gained ${(state.riderWeight-before).toFixed(2)}kg (now ${state.riderWeight.toFixed(1)}kg)`;
    }
    state.carbsToday=0;
    state.carbWarningShownToday=false;
    // Record today's FTP/W/kg snapshot before saving — weight may have just changed
    recordFtpSnapshot();
    // Set pending morning reward — energy withheld until player taps
    state.pendingMorningReward={
      energy:   nextEnergy,
      streak:   state.loginStreak,
      reward:   getStreakReward(state.loginStreak),
      weightGainMsg,
    };
    saveGame();
    updateUI();
    updateGrowthBadge();
  }
  // Sponsor weekly window is a rolling 7 days, independent of the calendar-day boundary
  // above, so this check runs unconditionally every time this function ticks.
  checkSponsorWeeklyReset();
  // Perishing is also independent of the calendar-day boundary — an item bought
  // mid-afternoon spoils exactly 7 days later, mid-afternoon, not at midnight.
  expirePerishedItems();
  // Calendar season is a rolling 30-day window, also independent of the calendar-day
  // boundary above — checked every tick once activated.
  checkCalendarSeasonReset();
  // Grand Tour hard lockout — forfeit any tour where a full stage-day was skipped.
  checkGrandTourLockouts();
}

// Called when the player taps the morning collect card.
// Grants the withheld energy + any streak milestone reward.
function collectMorningReward(){
  const pmr=state.pendingMorningReward; if(!pmr) return;
  // Set energy to exactly today's fatigue-adjusted allocation. state.energy was
  // already zeroed at the daily reset boundary, but we assign rather than add here
  // as a safety net in case any idle regen ticked between reset and this tap.
  state.energy=pmr.energy;
  state.pendingMorningReward=null;
  // Apply streak milestone reward
  const r=pmr.reward||{type:'none'};
  let rewardMsg='';
  if(r.type==='cash'){
    earnMoney(r.value);
    rewardMsg=` + ${r.icon} ${r.label}`;
  } else if(r.type==='item'){
    // Add a free recovery shake to the player's energy inventory
    const baseItem=ENERGY_ITEMS.find(i=>i.id==='shake');
    if(baseItem){
      state.energyInventory=state.energyInventory||[];
      state.energyInventory.push({
        id:'streak_shake_'+Date.now(),
        itemType:'shake',
        energy: baseItem.energy,
        fatigueRecovery: baseItem.fatigueRecovery||0,
        purchasedAt: Date.now(),
      });
      rewardMsg=` + 🥤 Free Shake in inventory!`;
    }
  }
  // XP bonus — present on days 1–7 and the Day 7 cash milestone
  if(r.xpBonus && r.xpBonus.length){
    r.xpBonus.forEach(({attr,amount})=>addXP(attr,amount));
    const allSame=r.xpBonus.length===5 && new Set(r.xpBonus.map(x=>x.amount)).size===1;
    const xpStr=allSame
      ? `+${r.xpBonus[0].amount} XP all attributes`
      : r.xpBonus.map(({attr,amount})=>`+${amount} ${ATTR_DEFS[attr]?.name||attr}`).join(' · ');
    rewardMsg+=(rewardMsg?' · ':' · ')+xpStr;
  }
  // Show weight gain warning (from overnight carb conversion) after a short delay
  if(pmr.weightGainMsg) setTimeout(()=>showToast(pmr.weightGainMsg),2800);
  saveGame();
  showToast(`🌅 Day ${pmr.streak} streak! ⚡ ${pmr.energy} energy restored${rewardMsg}`);
  renderTrainTab();
}

// ═══════════════════════════════════════════════════════════
// TRAINING
// ═══════════════════════════════════════════════════════════
function startSession(id){
  if(state.session.active||state.raceActive) return;
  const t=TRAINING.find(t=>t.id===id); if(!t) return;
  if(state.trainCooldowns[id]&&Date.now()<state.trainCooldowns[id]) return;
  if(t.unlock&&state.attributes[t.unlock.attr].level<t.unlock.level) return;
  if(state.energy<t.energyCost){ showToast(`⚡ Need ${t.energyCost} energy`); return; }
  state.energy=Math.max(0,state.energy-t.energyCost);
  state.energySpentToday=(state.energySpentToday||0)+t.energyCost;
  state.session={active:true,typeId:id,startTime:Date.now(),duration:t.duration*1000};
  // FIX 5a: Save immediately so energy deduction persists if page closes mid-session
  saveGame(); updateActivityDots(); renderTrainTab();
  notifyOnboardingAction('started_session');
}

function completeSession(){
  const t=TRAINING.find(t=>t.id===state.session.typeId); if(!t) return;
  // Build session multiplier: threshold base × any specialisation bonus
  let sessMult = D.sessionMult;
  if(state.specialisation==='climber' && (t.id==='z2'||t.id==='z5')) sessMult*=1.25;
  else if(state.specialisation==='sprinter' && t.id==='z6') sessMult*=1.30;
  else if(state.specialisation==='rouleur') sessMult*=1.15;
  for(const [attr,base] of Object.entries(t.xpGains)) addXP(attr,Math.round(base*sessMult));
  if(t.cooldown>0) state.trainCooldowns[t.id]=Date.now()+t.cooldown*1000;
  state.session={active:false};
  markTaskProgress('train_session');
  incrementSponsorProgress('sessions',1);
  // Fat-burning sessions (currently only Z1) nudge bodyweight down, clamped to the floor
  let weightMsg='';
  if(t.weightEffect){
    const before=state.riderWeight;
    state.riderWeight=Math.max(MIN_RIDER_WEIGHT,Math.min(MAX_RIDER_WEIGHT,state.riderWeight+t.weightEffect));
    if(state.riderWeight!==before){ weightMsg=` · ⚖️ ${state.riderWeight.toFixed(1)}kg`; recordFtpSnapshot(); }
  }
  updateActivityDots(); recalc(); saveGame(); showToast(`✅ ${t.name} complete!${weightMsg}`);
}

function collectSessionReward(){
  if(!state.session.active||!state.session.awaitingCollection) return;
  const t=TRAINING.find(t=>t.id===state.session.typeId);
  const wasCritical=!!state.session.isCritical; // read before session state is cleared below
  // Award all pre-calculated XP
  for(const {attr,amount} of (state.session.pendingXP||[])) addXP(attr,amount);
  if(t&&t.cooldown>0) state.trainCooldowns[t.id]=Date.now()+t.cooldown*1000;
  markTaskProgress('train_session');
  incrementSponsorProgress('sessions',1);
  // Weight effect (e.g. Z1 fat-burn)
  let weightMsg='';
  if(t&&t.weightEffect){
    const before=state.riderWeight;
    state.riderWeight=Math.max(MIN_RIDER_WEIGHT,Math.min(MAX_RIDER_WEIGHT,state.riderWeight+t.weightEffect));
    if(state.riderWeight!==before){ weightMsg=` · ⚖️ ${state.riderWeight.toFixed(1)}kg`; recordFtpSnapshot(); }
  }
  state.session={active:false};
  updateActivityDots(); recalc(); saveGame();
  showToast(wasCritical
    ? `🌟 CRITICAL! ${t?t.name:'Session'} banked at 2× XP!${weightMsg}`
    : `✅ ${t?t.name:'Session'} banked!${weightMsg}`);
  renderTrainTab();
}

// ═══════════════════════════════════════════════════════════
// RACE
// ═══════════════════════════════════════════════════════════
// ─── INTERACTIVE RACE ENGINE ─────────────────────────────────
// Returns the race clock time that actually counts toward animMs —
// raw wall-clock elapsed minus any time spent showing decision cards.
// If a decision is currently pending, its duration is excluded too,
// so completeRace() can never fire while the card is visible.
function getEffectiveElapsed(rd, now){
  let paused = rd.totalPausedMs || 0;
  if(rd.pendingDecision) paused += now - rd.pendingDecision.startedAt;
  return Math.max(0, (now - rd.startTime) - paused);
}

// Builds the list of decision-point stages for a given race type.
// Each stage has a triggerPct (0-1) and fires once as the race progress bar passes it.
function buildRaceStages(raceTypeId){
  const events = RACE_EVENTS[raceTypeId] || [];
  return buildStagesFromEvents(events);
}

// Shared by both the legacy RACE_EVENTS path (calendar events) and the new
// COURSES path (normal category racing) — turns a flat events array into the
// {triggerPct, event, fired} stage objects the race engine actually consumes.
function buildStagesFromEvents(events){
  return (events||[]).map(ev=>({ triggerPct:ev.triggerPct, event:ev, fired:false }));
}

// DEPRECATED — replaced by getHourlyCourse (hourly rotation); kept for reference.
// Picks a random named course for the given race type. Every normal race start
// (not calendar events) rolls a fresh course, so the same race type reads
// differently — different terrain, different commentary, different decisions —
// almost every time the player races it. Falls back to null if no courses are
// defined for that race type yet (shouldn't happen once all 4 types are covered).
function pickRandomCourse(raceTypeId){
  const pool = COURSES[raceTypeId];
  if (!pool || pool.length===0) return null;
  return pool[Math.floor(Math.random()*pool.length)];
}

// Hour index since epoch — increments exactly on the hour, every hour. Pure
// function of the wall clock, so the rotation needs no save-state field, can't
// drift, and stays in sync across reloads/devices sharing the same save.
function getCourseRotationHour(){ return Math.floor(Date.now()/3600000); }

// Integer avalanche hash (Chris Wellons' "triple32" finalizer). Used instead
// of a simple xorshift because xorshift's low bits (the ones x%4 actually
// reads, since pools are 4 courses) don't avalanche well on SEQUENTIAL inputs
// like consecutive hours — an earlier version of this hash left the 4 race
// types ~87% correlated (they all changed course on the same hour almost every
// time), defeating the point of rotating them independently. This mixer gives
// each (hour, type) pair a well-spread, independent-looking result.
function hash32(x){
  x = x>>>0;
  x ^= x>>>16; x = Math.imul(x,0x7feb352d)>>>0;
  x ^= x>>>15; x = Math.imul(x,0x846ca68b)>>>0;
  x ^= x>>>16;
  return x>>>0;
}

// Deterministic course pick for THIS hour, for the given race type. This is
// what both the race card (what's on offer) and startRace (what you actually
// race) call, so what the player sees is exactly what they get. Hour and a
// per-type salt are combined into one key BEFORE hashing, so each race type
// gets a genuinely distinct, independently-rotating sequence rather than a
// fixed offset into the same weak stream — measured at ~33% of hours moving
// all four types together, matching the ~32% expected for truly independent
// 4-way choices (vs ~87% with the naive approach).
function getHourlyCourse(raceTypeId){
  const pool = COURSES[raceTypeId];
  if (!pool || pool.length===0) return null;
  const salt = {road:0,crit:1,tt:2,hill:3}[raceTypeId] || 0;
  const h = getCourseRotationHour();
  const combined = ((h>>>0) * 4 + salt) >>> 0;
  return pool[hash32(combined) % pool.length];
}

// Looks up the full course object a race is currently using, from its stored
// courseId. Returns null for calendar events (which never set courseId) or
// old in-progress races from before this feature existed.
function getRaceCourse(rd){
  if(!rd||!rd.courseId||rd.isCalendarEvent) return null;
  const pool=COURSES[rd.typeId];
  return pool ? (pool.find(c=>c.id===rd.courseId)||null) : null;
}

// Returns the full stage object for a Grand Tour stage race, or null.
function getGrandTourStage(rd){
  if(!rd||!rd.isGrandTourStage) return null;
  const stages=GRAND_TOUR_STAGES[rd.calendarEventId];
  return stages ? (stages[rd.stageIndex]||null) : null;
}

// Called when the player taps a choice button in the decision card.
// Race Legs are reduced immediately; positionDelta accumulates.
// Phase 1 — called immediately when player taps a choice button.
// Just records which choice was made and the timestamp; gameTick handles resolution
// after the 1-second highlight delay. The race clock stays paused throughout.
function makeRaceDecision(choiceId){
  const rd=state.raceData; if(!rd||!rd.pendingDecision) return;
  if(rd.pendingDecision.selectedChoiceId) return; // already tapped, ignore double-tap
  const event=rd.pendingDecision.event;
  const choice=event.choices.find(c=>c.id===choiceId); if(!choice) return;
  // Mark the selection — gameTick will call resolveRaceDecision after 1 second
  rd.pendingDecision.selectedChoiceId=choiceId;
  rd.pendingDecision.selectedAt=Date.now();
  // Re-render immediately so the highlight shows before the delay
  if(currentTab==='race') renderActiveRaceBlock();
}

// Phase 2 — called by gameTick 1 second after the player taps.
// Applies legs cost, position delta, builds the result card, and resumes the clock.
function resolveRaceDecision(){
  const rd=state.raceData; if(!rd||!rd.pendingDecision) return;
  const {event, selectedChoiceId}=rd.pendingDecision;
  const choice=event.choices.find(c=>c.id===selectedChoiceId); if(!choice) return;
  const legs=rd.raceLegs;
  const spec=state.specialisation;
  rd.raceLegs=Math.max(0, legs-choice.raceLegsConst);
  const delta=choice.deltaFn?choice.deltaFn(legs,spec):0;
  rd.positionDelta=(rd.positionDelta||0)+delta;
  const legsLeft=rd.raceLegs;
  const legsCol=legsLeft>60?'var(--green-txt)':legsLeft>30?'var(--amber-txt)':'var(--red-txt)';
  const deltaStr=delta<0
    ?`<span style="color:var(--green-txt)">📈 +${Math.abs(delta)} position${Math.abs(delta)!==1?'s':''} gained</span>`
    :delta>0
      ?`<span style="color:var(--red-txt)">📉 ${delta} position${delta!==1?'s':''} lost</span>`
      :`<span style="color:var(--txt3)">↔️ No position change</span>`;
  rd.lastDecisionResult={label:choice.label,deltaStr,legsLeft,legsCol,autoSelected:!!rd.pendingDecision?.wasAutoSelected};
  // Accumulate full decision time (from card shown to resolution) into totalPausedMs
  rd.totalPausedMs=(rd.totalPausedMs||0)+(Date.now()-rd.pendingDecision.startedAt);
  rd.pendingDecision=null;
  saveGame();
  if(currentTab==='race') renderActiveRaceBlock();
}

// Assigns the rival's name once (career start) and recalibrates their FTP to
// 10–15% above the player's CURRENT FTP whenever the category index has changed
// since the last calibration — covers normal promotion, and also prestige resets
// since those drop raceCategory back to 0 (and the player's FTP resets alongside it,
// so the rival correctly recalibrates down to match the fresh season rather than
// staying at an old, now-unbeatable number).
function recalibrateRivalIfNeeded(){
  if(!state.rival.name){
    state.rival.name = RIVAL_NAMES[Math.floor(Math.random()*RIVAL_NAMES.length)];
  }
  if(state.rival.categoryIndexAtAssignment !== state.raceCategory){
    const playerFtp = getRiderStats().ftp;
    const multiplier = 1.10 + Math.random()*0.05; // 10–15% stronger, randomised within the range
    state.rival.ftp = Math.max(1, Math.round(playerFtp * multiplier));
    state.rival.categoryIndexAtAssignment = state.raceCategory;
  }
}

function simulateRaceResult(raceTypeId){
  const rt=RACE_TYPES.find(r=>r.id===raceTypeId);
  const cat=RACE_CATEGORIES[state.raceCategory];
  const rs=getRiderStats();
  const normVO2   =Math.max(0,(rs.vo2max    -30)/55  *100);
  // Sprinter passive: sprint power effectively +20% for score calculation
  const sprintPowerEff = state.specialisation==='sprinter' ? rs.sprintPower*1.20 : rs.sprintPower;
  const normSprint=Math.max(0,(sprintPowerEff-300)/1700*100);
  const playerBase=rt.weights.ftp*rs.ftp+rt.weights.vo2*normVO2+rt.weights.sprint*normSprint;
  const vo2Mult   =1+state.attributes.vo2.level*0.04;
  const sprintMult=rt.id==='crit'?(1+state.attributes.sprint.level*0.10):1;
  const equipBonus=getEquipmentBonusForRace(raceTypeId);
  const variance  =Math.max(10,playerBase*0.12);
  let playerScore =playerBase*vo2Mult*sprintMult+equipBonus+(Math.random()-0.5)*variance*2;
  // Apply specialisation race multipliers
  if(state.specialisation==='climber'){
    if(raceTypeId==='hill') playerScore*=1.5;
    else if(raceTypeId==='road') playerScore*=1.1;
  } else if(state.specialisation==='sprinter'){
    if(raceTypeId==='crit') playerScore*=1.5;
    else if(raceTypeId==='road') playerScore*=1.1;
  } else if(state.specialisation==='rouleur'){
    if(raceTypeId==='tt') playerScore*=1.35;
    else playerScore*=1.2;
  }
  // Power-to-weight dynamic: bodyweight away from the 70kg default helps or hurts
  // depending on race type — hill climbs feel it fully, flat crits barely at all.
  const weightFactor=getWeightFactorForRace(raceTypeId);
  playerScore*=weightFactor;
  // Weather applies equally to player and AI — it shifts which race types are
  // favourable today, not raw win probability. Applied AFTER weight so both modifiers
  // are transparent in the race card badges.
  const weatherMult=getWeatherScoreMult(raceTypeId);
  playerScore*=weatherMult;
  // Extras (Accessories) race-day % — Cycling Computer, Wind Tunnel Session,
  // Pro Team. Applied last, after weight and weather, so it's a clean overall
  // performance boost on top of everything else the race conditions already did.
  playerScore*=(1+(D.raceDayPct||0));
  recalibrateRivalIfNeeded();
  const fieldSize =Math.floor(Math.random()*(cat.fieldMax-cat.fieldMin+1))+cat.fieldMin;
  // Build the AI field. Slot 0 is always the named rival — a fixed FTP basis
  // (recalibrated only at category changes, see recalibrateRivalIfNeeded) instead
  // of a freshly randomised one each race, so "beating Hendricks" tracks a real,
  // consistent opponent rather than an anonymous face from the crowd. Everyone
  // still gets the same per-race performance variance so the rival isn't a
  // static checkpoint — they have good days and bad days like anyone else.
  const aiScores=[];
  let rivalScore=0;
  for(let i=0;i<fieldSize-1;i++){
    const isRival = (i===0);
    const aiFTP = isRival ? state.rival.ftp : (cat.ftpMin+Math.random()*(cat.ftpMax-cat.ftpMin));
    const aiVO2=30+(aiFTP-50)/500*55, aiSprint=300+(aiFTP-50)/500*1700;
    const aiBase=rt.weights.ftp*aiFTP+rt.weights.vo2*Math.max(0,(aiVO2-30)/55*100)+rt.weights.sprint*Math.max(0,(aiSprint-300)/1700*100);
    // AI also feels the weather — keeps the playing field level while still making
    // today's race type choice feel meaningful (some days favour certain disciplines)
    const aiScore=(aiBase+(Math.random()-0.5)*Math.max(10,aiBase*0.12)*2)*weatherMult;
    aiScores.push(aiScore);
    if(isRival) rivalScore=aiScore;
  }
  const beaten=aiScores.filter(s=>s>playerScore).length;
  const position=beaten+1;
  // Rival's own finishing position: ranked against every OTHER ai rider plus the player.
  const othersBeatingRival=aiScores.filter((s,idx)=>idx!==0&&s>rivalScore).length;
  const rivalPosition=othersBeatingRival+(playerScore>rivalScore?1:0)+1;
  const prize=Math.round((cat.prizes[Math.min(position-1,cat.prizes.length-1)]||0)*state.prestigeMult*D.legacyPrizeMult);
  return {position,fieldSize,prize,points:cat.ptsPerPos[Math.min(position-1,cat.ptsPerPos.length-1)]||0,equipBonus,weightFactor,weatherMult,
    rival:{name:state.rival.name, beat:playerScore>rivalScore, position:rivalPosition}};
}

function startRace(raceTypeId){
  if(state.raceActive||state.session.active) return;
  const rt=RACE_TYPES.find(r=>r.id===raceTypeId); if(!rt) return;
  if(state.raceCooldowns[raceTypeId]&&Date.now()<state.raceCooldowns[raceTypeId]) return;
  const cat=RACE_CATEGORIES[state.raceCategory];
  const actualCost=getWeatherEnergyCost(cat.energyCost);
  if(state.energy<actualCost){ showToast(`⚡ Need ${actualCost} energy (weather adds cost)`); return; }
  state.energy=Math.max(0,state.energy-actualCost);
  const fatBonus=getWeatherFatigueBonus();
  state.energySpentToday=(state.energySpentToday||0)+actualCost+fatBonus;
  const result=simulateRaceResult(raceTypeId);
  state.raceActive=true;
  // Use this hour's rotating course — same one the race card advertised, so
  // what the player saw before committing is exactly what they race.
  const course=getHourlyCourse(raceTypeId);
  state.raceData={typeId:raceTypeId,startTime:Date.now(),animMs:rt.animMs,result,
    virtualPos:Math.round(result.fieldSize*0.45),startVP:Math.round(result.fieldSize*0.45),commentaryIdx:0,
    courseId:course?course.id:null,
    // Interactive race system
    stages:course?buildStagesFromEvents(course.events):buildRaceStages(raceTypeId),
    raceLegs:100,          // in-race effort resource, 0-100, reset each race
    positionDelta:0,       // accumulated shift to base result from decisions
    pendingDecision:null,  // {event, startedAt} when player must choose
    lastDecisionResult:null,// shown briefly after a choice is made
    totalPausedMs:0,       // cumulative milliseconds spent showing decision cards
  };
  markTaskProgress('enter_race');
  incrementSponsorProgress('enter_races',1);
  // FIX 5b: Save immediately so energy deduction persists if page closes mid-race
  saveGame(); updateActivityDots();
  openRaceOverlay();
  if(currentTab==='race') renderRaceTab();
  renderActiveRaceBlock();
}

function completeRace(){
  try{ navigator.vibrate?.(30); }catch(e){}
  const rd=state.raceData, cat=RACE_CATEGORIES[state.raceCategory];
  const isCalEvent=!!rd.isCalendarEvent;
  const calEvent=isCalEvent ? CALENDAR_EVENTS.find(e=>e.id===rd.calendarEventId) : null;
  const gtStage=getGrandTourStage(rd);

  // Apply interactive decisions: positionDelta shifts the base result.
  // Clamped so decisions can't push you past 1st, and are meaningful but not all-powerful.
  // The cap (±40% of field) means a great set of decisions can swing ~8 places in a field
  // of 20, and a poor set can cost ~8 — significant but not the entire race.
  const rawDelta = rd.positionDelta || 0;
  const maxShift = Math.max(2, Math.floor(rd.result.fieldSize * 0.40));
  const clampedDelta = Math.max(-maxShift, Math.min(maxShift, rawDelta));
  const finalPos = Math.max(1, Math.min(rd.result.fieldSize, rd.result.position + clampedDelta));
  // Recalculate prize for final position — Grand Tour stages use the STAGE's
  // own prize table, regular calendar events use the event's, category races
  // use the category's.
  const prizeTable = gtStage ? gtStage.prizes : isCalEvent ? calEvent.prizes : cat.prizes;
  const finalPrize = Math.round((prizeTable[Math.min(finalPos-1, prizeTable.length-1)]||0) * state.prestigeMult);
  // Overwrite result with decision-adjusted values
  rd.result.position = finalPos;
  rd.result.prize    = finalPrize;

  if(finalPrize>0) earnMoney(finalPrize);

  // Calendar events run against a fixed invitational field, not the player's own
  // category — so they don't feed category points or set the normal race-type
  // cooldown. They DO still count as real races/wins/podiums for everything else
  // (achievements, sponsor objectives, lifetime totals) — winning the Tour de France
  // should matter just as much as winning a local crit, arguably more.
  const rt=RACE_TYPES.find(r=>r.id===rd.typeId);
  if(!isCalEvent){
    state.categoryPoints+=rd.result.points;
    if(rt) state.raceCooldowns[rd.typeId]=Date.now()+rt.cooldown*1000;
  }
  state.totalRaces++;
  incrementSponsorProgress('prize_money', rd.result.prize);
  if(rd.result.position<=3){ state.totalPodiums++; markTaskProgress('podium_race'); incrementSponsorProgress('podiums',1); }
  if(rd.result.position===1){ markTaskProgress('win_race'); if(rt) state.raceWinsByType[rt.id]=(state.raceWinsByType[rt.id]||0)+1; state.winsSincePrestige=(state.winsSincePrestige||0)+1; incrementSponsorProgress('win_races',1); }

  const raceTypeNameForDisplay = gtStage ? `${gtStage.icon} ${calEvent.name} — ${gtStage.name}` : isCalEvent ? `${calEvent.icon} ${calEvent.name}` : (rt?rt.name:rd.typeId);
  const catNameForDisplay = gtStage ? gtStage.place : isCalEvent ? (calEvent.tier==='pro'?'Pro Calendar':'Semi-Pro Calendar') : cat.shortName;

  const histEntry={
    raceTypeName: raceTypeNameForDisplay,
    raceTypeId: rd.typeId, isCalEvent,
    catName: catNameForDisplay,
    position:rd.result.position,fieldSize:rd.result.fieldSize,
    prize:rd.result.prize,points:isCalEvent?0:rd.result.points,ts:Date.now()};
  state.raceHistory.unshift(histEntry);
  if(state.raceHistory.length>8) state.raceHistory.pop();
  state.lastRaceResult=histEntry;

  if(gtStage){
    // Record this stage's result and GC points into the tour's running progress.
    const tp=state.calendar.tourProgress[rd.calendarEventId];
    tp.stageResults.push({stageIndex:rd.stageIndex, position:rd.result.position, fieldSize:rd.result.fieldSize, prize:rd.result.prize, gcPoints:rd.result.gcPoints, ts:Date.now()});
    tp.gcPoints += rd.result.gcPoints;
    tp.lastStageCompletedDate = new Date().toDateString();
    const stages=GRAND_TOUR_STAGES[rd.calendarEventId];
    if(tp.stageResults.length>=stages.length){
      // Final stage done — compute the overall GC result and award the big bonus.
      const tier=GC_TIERS.find(t=>tp.gcPoints>=t.minPoints) || GC_TIERS[GC_TIERS.length-1];
      const tierIdx=GC_TIERS.indexOf(tier);
      const gcBonus=(GC_BONUS_BY_TOUR[rd.calendarEventId]||[0,0,0,0])[tierIdx]||0;
      if(gcBonus>0) earnMoney(gcBonus);
      state.calendar.completed[rd.calendarEventId]={
        finished:true, gcPoints:tp.gcPoints, gcTier:tier.label, gcIcon:tier.icon, gcBonus,
        stageResults:tp.stageResults, ts:Date.now(),
      };
      enqueueCeremony({type:'grandtour', tourId:rd.calendarEventId, gcTier:tier.label, gcIcon:tier.icon, gcBonus, gcPoints:tp.gcPoints});
    }
  } else if(isCalEvent){
    state.calendar.completed[rd.calendarEventId]={
      position:rd.result.position, fieldSize:rd.result.fieldSize, prize:rd.result.prize, ts:Date.now(),
    };
  }

  state.raceActive=false; state.raceData=null;
  // Rival tracking — only for normal category races (not calendar events, which
  // use a fixed elite field with no rival slot). Compared against the ORIGINAL
  // simulated result (rd.result.rival), not the decision-adjusted finalPos, since
  // the rival race happened at the same instant as the base simulation and player
  // decisions during the race don't retroactively change what the rival did.
  let rivalMsg='';
  if(!isCalEvent && rd.result.rival){
    const riv=rd.result.rival;
    if(riv.beat){
      state.rival.wins=(state.rival.wins||0)+1;
      if(!state.rival.firstWinAchieved){
        state.rival.firstWinAchieved=true;
        rivalMsg=` · 🎯 You finally beat ${riv.name}!`;
      } else {
        rivalMsg=` · Beat ${riv.name} (${riv.position}${ordinal(riv.position)})`;
      }
    } else {
      state.rival.losses=(state.rival.losses||0)+1;
      rivalMsg=` · ${riv.name} finished ${riv.position}${ordinal(riv.position)}`;
    }
  }
  // Win ceremony — enqueued BEFORE checkCategoryPromotion() so if a single race
  // both wins AND triggers a promotion, the win celebration plays first and the
  // promotion celebration follows immediately after (FIFO ceremony queue).
  if(rd.result.position===1){
    enqueueCeremony({type:'win', raceTypeName:raceTypeNameForDisplay, catName:catNameForDisplay, prize:rd.result.prize,
      rivalBeatText: (!isCalEvent && rd.result.rival && rd.result.rival.beat) ? rivalMsg.replace(' · ','') : null});
  }
  updateActivityDots(); checkCategoryPromotion(); checkAchievements(); checkLifetimeGoals(); updateSponsorBadge(); updateCalendarBadge(); recalc(); saveGame();
  // The full-screen win ceremony already communicates position + prize, so the
  // small bottom toast is suppressed for 1st place to avoid showing the same
  // information twice in two different UI styles at once.
  if(rd.result.position!==1){
    showToast(`${rd.result.prize>0?'+'+fmtMoney(rd.result.prize):'No prize'} · ${rd.result.position}${ordinal(rd.result.position)} / ${rd.result.fieldSize}${rivalMsg}`);
  }
  // Overlay stays open — switches to result mode. Continue button closes it.
  renderRaceOverlayResult();
}

function checkCategoryPromotion(){
  const cat=RACE_CATEGORIES[state.raceCategory];
  if(state.categoryPoints>=cat.ptsToPromote&&state.raceCategory<RACE_CATEGORIES.length-1){
    const oldCat=cat;
    state.raceCategory++; state.categoryPoints=0;
    // Career-best category, tracked independently of state.raceCategory since
    // THAT resets to 0 every prestige. This is what feeds the "Climbing the
    // Ranks" Lifetime Goal — it only ever goes up, across the whole career.
    state.highestCategoryReached=Math.max(state.highestCategoryReached||0, state.raceCategory);
    const newCat=RACE_CATEGORIES[state.raceCategory];
    // Does this promotion cross a sponsor-tier boundary? Every promotion does
    // under the current 1:1 mapping (minCategory 1-6 vs RACE_CATEGORIES 1-6),
    // but this stays a real lookup rather than an assumption, so the ceremony
    // stays correct even if the tier ladder is ever rebalanced later.
    const unlockedTier=SPONSOR_TIERS.find(t=>t.minCategory===state.raceCategory);
    enqueueCeremony({type:'promotion', oldCat, newCat, sponsorTierUnlocked: unlockedTier?unlockedTier.label:null});
    ensureCalendarSeasonStarted();
    updateCalendarBadge();
  }
}

function chooseSpecialisation(id){
  if(state.specialisation) return; // already chosen — permanent
  const spec=SPECIALISATIONS.find(s=>s.id===id); if(!spec) return;
  const canUnlock=Object.entries(spec.requirements).every(([attr,lvl])=>state.attributes[attr]?.level>=lvl);
  if(!canUnlock){ showToast('Requirements not met'); return; }
  state.specialisation=id;
  recalc(); saveGame();
  showToast(`${spec.icon} ${spec.name} unlocked!`);
  if(currentTab==='rider') renderSpecialisation();
}

let _achToastQueue=[];
function checkAchievements(){
  const newlyEarned=[];
  for(const ach of ACHIEVEMENTS){
    if(!state.earnedAchievements.has(ach.id) && achUnlocked(state,ach.id)){
      state.earnedAchievements.add(ach.id);
      state.uncollectedAchievements.add(ach.id);
      newlyEarned.push(ach);
    }
  }
  if(newlyEarned.length){
    // Reward is granted only when the player taps "Collect Reward" on the
    // full-screen ceremony (see collectAchievementReward) — never here. This
    // makes every achievement a deliberate, felt moment rather than a silent
    // background credit. Multiple simultaneous unlocks queue and show one at
    // a time via the same FIFO ceremony queue used for wins/promotions.
    newlyEarned.forEach(ach=>enqueueCeremony({type:'achievement', achievementId:ach.id}));
    saveGame();
    if(currentTab==='growth') renderGrowthTab();
  }
}

// Lifetime Goals — parallel system to checkAchievements, but tiered: a single
// track can cross multiple tiers in one call (e.g. a huge prize payout jumping
// lifetimeMoney past two thresholds at once), so every tier is checked every
// time rather than stopping at the first newly-met one.
function checkLifetimeGoals(){
  const newlyEarned=[];
  LIFETIME_GOALS.forEach(track=>{
    const val=track.statFn(state);
    track.tiers.forEach((tier,idx)=>{
      const key=track.id+':'+idx;
      if(val>=tier.threshold && !state.claimedGoalTiers.has(key) && !state.uncollectedGoalTiers.has(key)){
        state.uncollectedGoalTiers.add(key);
        newlyEarned.push({trackId:track.id, tierIndex:idx});
      }
    });
  });
  if(newlyEarned.length){
    newlyEarned.forEach(e=>enqueueCeremony({type:'lifetimegoal', trackId:e.trackId, tierIndex:e.tierIndex}));
    saveGame();
    if(currentTab==='growth') renderGrowthTab();
  }
}

// Grants a Lifetime Goal tier's reward, mirroring collectAchievementReward.
// Same forced-collect pattern — the ceremony backdrop is blocked for this
// type too (see dismissCeremony), so nothing is ever silently skipped.
function collectGoalTierReward(trackId, tierIndex){
  const track=LIFETIME_GOALS.find(t=>t.id===trackId); if(!track) return;
  const tier=track.tiers[tierIndex]; if(!tier) return;
  const key=trackId+':'+tierIndex;
  if(!state.uncollectedGoalTiers.has(key)) return; // guard against double-tap
  const r=tier.reward;
  if(r.type==='cashxp'){ earnMoney(r.cash); ATTR_ORDER.forEach(a=>addXP(a,r.xp)); }
  else if(r.type==='color'){ state.unlockedKitColors.add(r.colorId); }
  else if(r.type==='title'){
    state.unlockedTitles.add(r.titleId);
    if(!state.equippedTitle) state.equippedTitle=r.titleId; // auto-equip the first title ever earned
  }
  // 'perk' rewards need no direct action here — recalc() reads claimedGoalTiers
  // directly, so simply marking this tier as claimed (below) activates it.
  state.uncollectedGoalTiers.delete(key);
  state.claimedGoalTiers.add(key);
  recalc();
  saveGame();
  showToast(`🏆 ${r.label} collected!`);
  updateHeader();
  if(currentTab==='growth') renderGrowthTab();
  // Force-dismiss (bypassing the lifetimegoal backdrop-tap guard) and advance
  document.getElementById('ceremony-overlay').style.display='none';
  document.getElementById('ceremony-confetti').innerHTML='';
  ceremonyShowing=false;
  currentCeremonyType=null;
  processCeremonyQueue();
}

// Switches the player's currently displayed title. Only unlocked titles are
// selectable — see the title chip row in renderLifetimeTasks.
function equipTitle(titleId){
  if(titleId!==null && !state.unlockedTitles.has(titleId)) return;
  state.equippedTitle=titleId;
  saveGame();
  if(currentTab==='growth') renderGrowthTab();
}

function ordinal(n){ const s=['th','st','nd','rd'],v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }

// ═══════════════════════════════════════════════════════════
// SPONSORSHIP
// ═══════════════════════════════════════════════════════════
function totalWins(){ return Object.values(state.raceWinsByType).reduce((a,b)=>a+b,0); }

// Highest tier index the player's CATEGORY qualifies for, or -1 if none yet.
// Deliberately uses state.raceCategory, which resets to 0 every prestige, so
// sponsor access re-locks each season — same spirit the old winsSincePrestige
// gate had, now driven by category instead of win count.
function getCurrentSponsorTierIndex(){
  let idx=-1;
  SPONSOR_TIERS.forEach((t,i)=>{ if(state.raceCategory>=t.minCategory) idx=i; });
  return idx;
}

function getActiveSponsorDef(){
  if(!state.sponsor.activeId) return null;
  for(const tierObj of SPONSOR_TIERS){
    const s=tierObj.sponsors.find(s=>s.id===state.sponsor.activeId);
    if(s) return {sponsor:s, tier:tierObj};
  }
  return null;
}

// Called from the relevant game action the moment it happens (session complete, race
// entered, race result). No-ops if the player has no active sponsor.
function incrementSponsorProgress(type, amount=1){
  if(!state.sponsor.activeId) return;
  state.sponsor.progress[type]=(state.sponsor.progress[type]||0)+amount;
  if(currentTab==='sponsors') renderSponsorsTab();
  updateSponsorBadge();
}

const SPONSOR_TERMINATE_COOLDOWN_MS = 3 * 24 * 60 * 60 * 1000; // 3 days
const SPONSOR_LATERAL_COOLDOWN_MS  = 24 * 60 * 60 * 1000;      // 24 hrs after same-tier switch

// How many ms remain on the termination cooldown (0 if none active)
function getSponsorTerminateCooldownRemaining(){
  if(!state.sponsor.terminatedAt) return 0;
  return Math.max(0, state.sponsor.terminatedAt + SPONSOR_TERMINATE_COOLDOWN_MS - Date.now());
}

function getSponsorLateralCooldownRemaining(){
  if(!state.sponsor.lateralCooldownUntil) return 0;
  return Math.max(0, state.sponsor.lateralCooldownUntil - Date.now());
}

// Can the player upgrade to a higher tier than their current signed tier?
function canUpgradeSponsor(){
  const qualified=getCurrentSponsorTierIndex();
  return qualified > state.sponsor.activeTierIdx && qualified >= 0;
}

// The other sponsor within the same tier (for lateral switch)
function getLateralSponsor(){
  if(state.sponsor.activeTierIdx < 0) return null;
  const tierObj=SPONSOR_TIERS[state.sponsor.activeTierIdx]; if(!tierObj) return null;
  return tierObj.sponsors.find(s=>s.id!==state.sponsor.activeId)||null;
}

// Voluntary termination — wipes active sponsor, sets 3-day cooldown
function terminateSponsor(){
  const active=getActiveSponsorDef(); if(!active) return;
  if(sponsorActionPending!=='terminate'){
    sponsorActionPending='terminate';
    clearTimeout(sponsorActionTimer);
    sponsorActionTimer=setTimeout(()=>{ sponsorActionPending=null; if(currentTab==='sponsors') renderSponsorsTab(); },4000);
    if(currentTab==='sponsors') renderSponsorsTab();
    return;
  }
  clearTimeout(sponsorActionTimer);
  sponsorActionPending=null;
  state.sponsor.activeId=null;
  state.sponsor.activeTierIdx=-1;
  state.sponsor.terminatedAt=Date.now();
  state.sponsor.weekStart=0;
  state.sponsor.progress={win_races:0,enter_races:0,podiums:0,sessions:0,prize_money:0};
  state.sponsor.claimed={};
  state.sponsor.bonusClaimed=false;
  sponsorViewMode='active';
  saveGame();
  showToast('📋 Contract terminated — 3 day cooling-off period begins now');
  if(currentTab==='sponsors') renderSponsorsTab();
  updateSponsorBadge();
}

// Lateral switch — same tier, different sponsor. 24hr cooldown, progress resets.
function lateralSwitchSponsor(sponsorId){
  const lateral=getLateralSponsor();
  if(!lateral||lateral.id!==sponsorId) return;
  if(getSponsorLateralCooldownRemaining()>0) return;
  const key='lateral:'+sponsorId;
  if(sponsorActionPending!==key){
    sponsorActionPending=key;
    clearTimeout(sponsorActionTimer);
    sponsorActionTimer=setTimeout(()=>{ sponsorActionPending=null; if(currentTab==='sponsors') renderSponsorsTab(); },4000);
    if(currentTab==='sponsors') renderSponsorsTab();
    return;
  }
  clearTimeout(sponsorActionTimer);
  sponsorActionPending=null;
  state.sponsor.activeId=sponsorId;
  state.sponsor.weekStart=Date.now();
  state.sponsor.progress={win_races:0,enter_races:0,podiums:0,sessions:0,prize_money:0};
  state.sponsor.claimed={};
  state.sponsor.bonusClaimed=false;
  state.sponsor.lateralCooldownUntil=Date.now()+SPONSOR_LATERAL_COOLDOWN_MS;
  sponsorViewMode='active';
  saveGame();
  showToast(`🤝 Switched to ${lateral.name}`);
  if(currentTab==='sponsors') renderSponsorsTab();
  updateSponsorBadge();
}

function signSponsor(tierIdx, sponsorId){
  const tierObj=SPONSOR_TIERS[tierIdx]; if(!tierObj) return;
  const sponsorDef=tierObj.sponsors.find(s=>s.id===sponsorId); if(!sponsorDef) return;
  if(getSponsorTerminateCooldownRemaining()>0){
    showToast('⏳ Cooling-off period active — wait 3 days after termination');
    return;
  }
  if(state.sponsor.activeId && state.sponsor.activeTierIdx===tierIdx){
    // Same-tier lateral switch — handled separately via lateralSwitchSponsor
    return;
  }
  if(state.sponsor.activeId){
    // Upgrading to a new tier — two-tap so player sees the cooldown warning first
    const key='sign:'+tierIdx+':'+sponsorId;
    if(sponsorActionPending!==key){
      sponsorActionPending=key;
      clearTimeout(sponsorActionTimer);
      sponsorActionTimer=setTimeout(()=>{ sponsorActionPending=null; if(currentTab==='sponsors') renderSponsorsTab(); },4000);
      if(currentTab==='sponsors') renderSponsorsTab();
      return;
    }
    clearTimeout(sponsorActionTimer);
    sponsorActionPending=null;
  }
  state.sponsor.activeId=sponsorId;
  state.sponsor.activeTierIdx=tierIdx;
  state.sponsor.weekStart=Date.now();
  state.sponsor.progress={win_races:0,enter_races:0,podiums:0,sessions:0,prize_money:0};
  state.sponsor.claimed={};
  state.sponsor.bonusClaimed=false;
  state.sponsor.terminatedAt=0;
  // Signing (including upgrades) starts a 24hr cooldown on lateral switching
  // so the player can't immediately hop to the other sponsor in the new tier.
  state.sponsor.lateralCooldownUntil=Date.now()+SPONSOR_LATERAL_COOLDOWN_MS;
  sponsorViewMode='active';
  saveGame();
  showToast(`🤝 Signed with ${sponsorDef.name}! 24hr cooldown on switching`);
  if(currentTab==='sponsors') renderSponsorsTab();
  updateSponsorBadge();
}

function claimSponsorObjective(objId){
  const active=getActiveSponsorDef(); if(!active) return;
  const obj=active.sponsor.objectives.find(o=>o.id===objId); if(!obj) return;
  if(state.sponsor.claimed[objId]) return;
  const cur=state.sponsor.progress[obj.type]||0;
  if(cur<obj.target) return;
  state.sponsor.claimed[objId]=true;
  earnMoney(obj.reward);
  state.sponsor.totalEarned=(state.sponsor.totalEarned||0)+obj.reward;
  saveGame();
  showToast(`💰 ${obj.label} complete: +${fmtMoney(obj.reward)}!`);
  if(currentTab==='sponsors') renderSponsorsTab();
  updateSponsorBadge();
}

function claimSponsorBonus(){
  const active=getActiveSponsorDef(); if(!active) return;
  if(state.sponsor.bonusClaimed) return;
  const allClaimed=active.sponsor.objectives.every(o=>state.sponsor.claimed[o.id]);
  if(!allClaimed) return;
  state.sponsor.bonusClaimed=true;
  earnMoney(active.sponsor.weeklyBonus);
  state.sponsor.totalEarned=(state.sponsor.totalEarned||0)+active.sponsor.weeklyBonus;
  saveGame();
  showToast(`🎉 Weekly Bonus: +${fmtMoney(active.sponsor.weeklyBonus)}!`);
  if(currentTab==='sponsors') renderSponsorsTab();
  updateSponsorBadge();
}

// Rolling 7-day window from when the current sponsor was signed (or last reset),
// independent of the calendar-day energy/task reset. Checked every time checkDailyReset
// ticks (every 60s + at boot) so it doesn't need its own interval.
function checkSponsorWeeklyReset(){
  if(!state.sponsor.activeId) {
    // Re-render sponsors tab live if a cooldown just expired
    if(state.sponsor.terminatedAt > 0 && getSponsorTerminateCooldownRemaining()===0){
      state.sponsor.terminatedAt=0;
      saveGame();
      if(currentTab==='sponsors') renderSponsorsTab();
      updateSponsorBadge();
    }
    if(state.sponsor.lateralCooldownUntil > 0 && getSponsorLateralCooldownRemaining()===0){
      state.sponsor.lateralCooldownUntil=0;
      saveGame();
      if(currentTab==='sponsors') renderSponsorsTab();
    }
    return;
  }
  const WEEK_MS=7*24*60*60*1000;
  if(Date.now()-state.sponsor.weekStart>=WEEK_MS){
    state.sponsor.weekStart=Date.now();
    state.sponsor.progress={win_races:0,enter_races:0,podiums:0,sessions:0,prize_money:0};
    state.sponsor.claimed={};
    state.sponsor.bonusClaimed=false;
    saveGame();
    showToast('📅 New sponsorship week! Objectives have reset.');
    if(currentTab==='sponsors') renderSponsorsTab();
    updateSponsorBadge();
  }
}

// Lights up the Sponsors tab when there's something ready to claim, or when a tier is
// unlocked and waiting to be picked for the first time.
function updateSponsorBadge(){
  const btn=document.getElementById('tab-btn-sponsors'); if(!btn) return;
  const active=getActiveSponsorDef();
  let ready=false;
  if(active){
    // Claimable objectives or bonus
    ready = active.sponsor.objectives.some(o=>!state.sponsor.claimed[o.id] && (state.sponsor.progress[o.type]||0)>=o.target);
    if(!ready && !state.sponsor.bonusClaimed && active.sponsor.objectives.every(o=>state.sponsor.claimed[o.id])) ready=true;
    // Upgrade available
    if(!ready && canUpgradeSponsor()) ready=true;
  } else if(getSponsorTerminateCooldownRemaining()<=0){
    // No sponsor, no cooldown — something to act on
    ready = getCurrentSponsorTierIndex()>=0;
  }
  btn.classList.toggle('sponsor-ready', ready);
}

// CALENDAR (Major Events)
// ═══════════════════════════════════════════════════════════
const CALENDAR_TIER_UNLOCK_CAT = { semipro: 5, pro: 6 }; // RACE_CATEGORIES index: 5=Cat1 (Semi-Pro), 6=Pro

function isCalendarUnlocked(){ return state.raceCategory>=CALENDAR_TIER_UNLOCK_CAT.semipro; }
function isProTierUnlocked(){ return state.raceCategory>=CALENDAR_TIER_UNLOCK_CAT.pro; }

// Events the player is currently eligible to see/sign up for, given their category.
function getAvailableCalendarEvents(){
  return CALENDAR_EVENTS.filter(e=> e.tier==='semipro' || (e.tier==='pro' && isProTierUnlocked()) );
}

// How many calendar slots the player gets this season, based on prestige (Season) level.
// Season 1-2: 1 slot. Season 3-6: 2 slots. Then +1 slot every 4 seasons beyond that.
// Always capped at however many events the player can actually see.
function getCalendarSlotLimit(){
  let raw;
  if(state.season<=2) raw=1;
  else raw=2+Math.floor((state.season-3)/4);
  return Math.max(1, Math.min(raw, getAvailableCalendarEvents().length));
}

// Lazily starts the 30-day calendar clock the first time the player reaches Semi-Pro,
// so the feature doesn't silently burn through real-world time before it's relevant.
function ensureCalendarSeasonStarted(){
  if(!isCalendarUnlocked()) return;
  if(state.calendar.seasonStartDate===0){
    state.calendar.seasonStartDate=Date.now();
    saveGame();
  }
}

function getCalendarDaysRemaining(){
  if(state.calendar.seasonStartDate===0) return CALENDAR_SEASON_DAYS;
  const elapsedMs=Date.now()-state.calendar.seasonStartDate;
  const remainingMs=Math.max(0, CALENDAR_SEASON_DAYS*24*60*60*1000 - elapsedMs);
  return Math.ceil(remainingMs/(24*60*60*1000));
}

// Rolling 30-day window. Archives this season's results, forfeits any signed-up-but-
// unraced events (no refund — that was the commitment made at sign-up), and restarts
// the clock. Checked from the existing checkDailyReset tick, so no separate interval.
function checkCalendarSeasonReset(){
  if(state.calendar.seasonStartDate===0) return;
  const elapsedMs=Date.now()-state.calendar.seasonStartDate;
  if(elapsedMs < CALENDAR_SEASON_DAYS*24*60*60*1000) return;

  const completedResults=Object.entries(state.calendar.completed).map(([eventId,result])=>{
    const ev=CALENDAR_EVENTS.find(e=>e.id===eventId);
    return {eventName:ev?ev.name:eventId, eventIcon:ev?ev.icon:'🏁', ...result};
  });
  const forfeitedIds=state.calendar.signups.filter(id=>!state.calendar.completed[id]);

  state.calendar.history.unshift({
    seasonEndedAt:Date.now(),
    results:completedResults,
    forfeitedCount:forfeitedIds.length,
  });
  if(state.calendar.history.length>12) state.calendar.history.pop();

  state.calendar.signups=[];
  state.calendar.completed={};
  state.calendar.seasonStartDate=Date.now();
  saveGame();

  const msg = forfeitedIds.length>0
    ? `📅 New Calendar season! ${forfeitedIds.length} unraced event${forfeitedIds.length>1?'s were':' was'} forfeited.`
    : '📅 New Calendar season has begun!';
  showToast(msg);
  if(currentTab==='calendar') renderCalendarTab();
  updateCalendarBadge();
}

// HARD LOCKOUT for Grand Tours. A Grand Tour must be raced one stage per day.
// Stage 1 has no deadline — the clock only starts once the Tour is underway.
// After that, each stage has a one-calendar-day window: skip a full day and the
// whole Tour is forfeited (no partial GC payout), matching the promise in the
// event description. Runs on the same checkDailyReset tick (boot + every 60s) as
// the season reset, so a forfeit is detected the moment the player reopens the app.
function checkGrandTourLockouts(){
  if(!state.calendar || !state.calendar.tourProgress) return;
  const todayMs = new Date(new Date().toDateString()).getTime(); // local midnight today
  const forfeited=[];
  Object.keys(state.calendar.tourProgress).forEach(tourId=>{
    const tp=state.calendar.tourProgress[tourId];
    if(!tp || tp.forfeited) return;
    const stages=GRAND_TOUR_STAGES[tourId]; if(!stages) return;
    if(tp.stageResults.length===0) return;             // Stage 1 not raced yet — no deadline
    if(tp.stageResults.length>=stages.length) return;  // already finished
    if(!tp.lastStageCompletedDate) return;
    const lastMs=new Date(tp.lastStageCompletedDate).getTime();
    if(isNaN(lastMs)) return;
    const dayDiff=Math.round((todayMs-lastMs)/86400000);
    if(dayDiff>=2){                                     // a full calendar day was skipped
      tp.forfeited=true;
      const ev=CALENDAR_EVENTS.find(e=>e.id===tourId);
      forfeited.push(ev?ev.name:tourId);
    }
  });
  if(forfeited.length){
    saveGame();
    forfeited.forEach(n=>showToast(`💔 Missed a stage — ${n} forfeited`));
    if(currentTab==='calendar') renderCalendarTab();
    if(typeof updateCalendarBadge==='function') updateCalendarBadge();
  }
}

function signUpForCalendarEvent(eventId){
  const ev=CALENDAR_EVENTS.find(e=>e.id===eventId); if(!ev) return;
  if(ev.tier==='pro' && !isProTierUnlocked()){ showToast('🔒 Reach Pro category to enter this event'); return; }
  if(state.calendar.signups.includes(eventId)){ showToast('Already signed up for this event'); return; }
  if(state.calendar.signups.length>=getCalendarSlotLimit()){ showToast(`Only ${getCalendarSlotLimit()} event slot${getCalendarSlotLimit()>1?'s':''} this season`); return; }
  if(state.money<ev.entryFee){ showToast('Not enough prize money for entry fee'); return; }

  // Two-tap confirmation — replaces confirm() which is suppressed on iOS PWA.
  // First tap: highlight button amber and wait for a second tap within 4 seconds.
  if(calendarSignupPending!==eventId){
    calendarSignupPending=eventId;
    clearTimeout(calendarSignupTimer);
    calendarSignupTimer=setTimeout(()=>{
      calendarSignupPending=null;
      if(currentTab==='calendar') renderCalendarTab();
    }, 4000);
    if(currentTab==='calendar') renderCalendarTab();
    return;
  }

  // Second tap within 4s — execute the signup.
  clearTimeout(calendarSignupTimer);
  calendarSignupPending=null;
  state.money-=ev.entryFee;
  state.calendar.signups.push(eventId);
  if(ev.isGrandTour){
    state.calendar.tourProgress[eventId]={
      stageResults:[], gcPoints:0, lastStageCompletedDate:null, forfeited:false,
    };
  }
  saveGame();
  showToast(ev.isGrandTour ? `📝 Entered ${ev.name}! Race Stage 1 whenever you're ready.` : `📝 Signed up for ${ev.name}!`);
  if(currentTab==='calendar') renderCalendarTab();
  updateHeader();
}

// Mirrors simulateRaceResult, but uses the event's own fixed elite-AI FTP band
// (independent of the player's category) and its own field size / prize table.
function simulateCalendarEventResult(eventId){
  const ev=CALENDAR_EVENTS.find(e=>e.id===eventId); if(!ev) return null;
  const rt=RACE_TYPES.find(r=>r.id===ev.raceTypeId);
  const rs=getRiderStats();
  const normVO2   =Math.max(0,(rs.vo2max    -30)/55  *100);
  const sprintPowerEff = state.specialisation==='sprinter' ? rs.sprintPower*1.20 : rs.sprintPower;
  const normSprint=Math.max(0,(sprintPowerEff-300)/1700*100);
  const playerBase=rt.weights.ftp*rs.ftp+rt.weights.vo2*normVO2+rt.weights.sprint*normSprint;
  const vo2Mult   =1+state.attributes.vo2.level*0.04;
  const sprintMult=rt.id==='crit'?(1+state.attributes.sprint.level*0.10):1;
  const equipBonus=getEquipmentBonusForRace(ev.raceTypeId);
  const variance  =Math.max(10,playerBase*0.12);
  let playerScore=playerBase*vo2Mult*sprintMult+equipBonus+(Math.random()-0.5)*variance*2;
  if(state.specialisation==='climber'){
    if(ev.raceTypeId==='hill') playerScore*=1.5;
    else if(ev.raceTypeId==='road') playerScore*=1.1;
  } else if(state.specialisation==='sprinter'){
    if(ev.raceTypeId==='crit') playerScore*=1.5;
    else if(ev.raceTypeId==='road') playerScore*=1.1;
  } else if(state.specialisation==='rouleur'){
    if(ev.raceTypeId==='tt') playerScore*=1.35;
    else playerScore*=1.2;
  }
  const weightFactor=getWeightFactorForRace(ev.raceTypeId);
  playerScore*=weightFactor;
  // Extras (Accessories) race-day % — same bonus as normal races.
  playerScore*=(1+(D.raceDayPct||0));

  // Fixed elite AI band per tier, independent of the player's own race category —
  // these are invitational fields of specialists, not a reflection of player rank.
  const ftpBand = ev.tier==='pro' ? [430,560] : [360,470];
  let beaten=0;
  for(let i=0;i<ev.fieldSize-1;i++){
    const aiFTP=ftpBand[0]+Math.random()*(ftpBand[1]-ftpBand[0]);
    const aiVO2=30+(aiFTP-50)/500*55, aiSprint=300+(aiFTP-50)/500*1700;
    const aiBase=rt.weights.ftp*aiFTP+rt.weights.vo2*Math.max(0,(aiVO2-30)/55*100)+rt.weights.sprint*Math.max(0,(aiSprint-300)/1700*100);
    const aiScore=aiBase+(Math.random()-0.5)*Math.max(10,aiBase*0.12)*2;
    if(aiScore>playerScore) beaten++;
  }
  const position=beaten+1;
  const prize=ev.prizes[Math.min(position-1,ev.prizes.length-1)]||0;
  return {position,fieldSize:ev.fieldSize,prize,equipBonus,weightFactor};
}

function startCalendarEvent(eventId){
  if(state.raceActive||state.session.active) return;
  const ev=CALENDAR_EVENTS.find(e=>e.id===eventId); if(!ev) return;
  // Grand Tours are multi-day stage events — dispatch to the stage runner, which
  // handles per-stage progression, the once-per-day gate and the forfeit rule.
  if(ev.isGrandTour){ startGrandTourStage(eventId); return; }
  if(!state.calendar.signups.includes(eventId)){ showToast('Not signed up for this event'); return; }
  if(state.calendar.completed[eventId]){ showToast('Already raced this event this season'); return; }
  if(state.energy<ev.energyCost){ showToast(`⚡ Need ${ev.energyCost} energy`); return; }
  state.energy=Math.max(0,state.energy-ev.energyCost);
  state.energySpentToday=(state.energySpentToday||0)+ev.energyCost;
  const result=simulateCalendarEventResult(eventId);
  const rt=RACE_TYPES.find(r=>r.id===ev.raceTypeId);
  state.raceActive=true;
  state.raceData={typeId:ev.raceTypeId,startTime:Date.now(),animMs:rt.animMs,result,
    virtualPos:Math.round(result.fieldSize*0.45),startVP:Math.round(result.fieldSize*0.45),commentaryIdx:0,
    isCalendarEvent:true, calendarEventId:eventId,
    stages:buildRaceStages(ev.raceTypeId),
    raceLegs:100, positionDelta:0, pendingDecision:null, lastDecisionResult:null,
    totalPausedMs:0,
  };
  markTaskProgress('enter_race');
  incrementSponsorProgress('enter_races',1);
  saveGame(); updateActivityDots();
  // Switch to the Race tab to watch the animation — reuses the existing race engine/UI
  // wholesale rather than duplicating a second live-race renderer inside Calendar.
  showTab('race');
  openRaceOverlay();
  renderActiveRaceBlock();
}

// Scores a single Grand Tour stage using the STAGE's own weights and weight-
// sensitivity (deliberately separate from the 4 category RACE_TYPES, so a
// real high-mountain stage can be more extreme than a regular Hill Climb).
// Specialisation bonuses are matched by stage TERRAIN SHAPE rather than a
// fixed race-type id, since stages aren't one of the 4 category types:
//   sprint-heavy weights    → sprinter bonus (flat/sprint stages)
//   full weight-sensitivity → climber bonus (high-mountain stages)
//   near-pure FTP, no weight-sensitivity → rouleur bonus (time trial stages)
function simulateGrandTourStageResult(tourId, stageIndex){
  const ev=CALENDAR_EVENTS.find(e=>e.id===tourId); if(!ev) return null;
  const stage=GRAND_TOUR_STAGES[tourId]?.[stageIndex]; if(!stage) return null;
  const rs=getRiderStats();
  const normVO2   =Math.max(0,(rs.vo2max    -30)/55  *100);
  const sprintPowerEff = state.specialisation==='sprinter' ? rs.sprintPower*1.20 : rs.sprintPower;
  const normSprint=Math.max(0,(sprintPowerEff-300)/1700*100);
  const playerBase=stage.weights.ftp*rs.ftp+stage.weights.vo2*normVO2+stage.weights.sprint*normSprint;
  const vo2Mult   =1+state.attributes.vo2.level*0.04;
  const isSprintStage = stage.weights.sprint>=0.3;
  const isMountainStage = stage.weightSensitivity>=1.0;
  const isTTStage = stage.weights.ftp>=0.9 && stage.weightSensitivity===0;
  const sprintMult=isSprintStage?(1+state.attributes.sprint.level*0.10):1;
  const equipBonus=getEquipmentBonusForRace(isMountainStage?'hill':isTTStage?'tt':isSprintStage?'crit':'road');
  const variance  =Math.max(10,playerBase*0.12);
  let playerScore=playerBase*vo2Mult*sprintMult+equipBonus+(Math.random()-0.5)*variance*2;
  if(state.specialisation==='climber'){
    if(isMountainStage) playerScore*=1.5; else playerScore*=1.05;
  } else if(state.specialisation==='sprinter'){
    if(isSprintStage) playerScore*=1.5; else playerScore*=1.05;
  } else if(state.specialisation==='rouleur'){
    if(isTTStage) playerScore*=1.35; else playerScore*=1.15;
  }
  // Bodyweight matters via the stage's own weightSensitivity — a mountain
  // stage like Zoncolan (1.15) punishes excess weight harder than a regular
  // Hill Climb category race (1.0) ever does.
  const pwr=getRiderStats().ftp/state.riderWeight;
  const idealPwr=4.5;
  const weightFactor=1+((pwr-idealPwr)/idealPwr)*stage.weightSensitivity*0.5;
  playerScore*=Math.max(0.5,Math.min(1.5,weightFactor));
  // Extras (Accessories) race-day % — same bonus as normal races and calendar events.
  playerScore*=(1+(D.raceDayPct||0));

  // Fixed elite AI band, same tier convention as other Pro calendar events —
  // Grand Tours are all 'pro' tier invitational fields of specialists.
  const ftpBand=[430,560];
  let beaten=0;
  for(let i=0;i<ev.fieldSize-1;i++){
    const aiFTP=ftpBand[0]+Math.random()*(ftpBand[1]-ftpBand[0]);
    const aiVO2=30+(aiFTP-50)/500*55, aiSprint=300+(aiFTP-50)/500*1700;
    const aiBase=stage.weights.ftp*aiFTP+stage.weights.vo2*Math.max(0,(aiVO2-30)/55*100)+stage.weights.sprint*Math.max(0,(aiSprint-300)/1700*100);
    const aiScore=aiBase+(Math.random()-0.5)*Math.max(10,aiBase*0.12)*2;
    if(aiScore>playerScore) beaten++;
  }
  const position=beaten+1;
  const prize=stage.prizes[Math.min(position-1,stage.prizes.length-1)]||0;
  const gcPoints=stage.gcPoints[Math.min(position-1,stage.gcPoints.length-1)]||0;
  return {position,fieldSize:ev.fieldSize,prize,gcPoints,equipBonus,weightFactor};
}

// Starts the NEXT unraced stage of a signed-up Grand Tour. Stage 1 is
// immediately available on signup; stages 2-5 enforce the hard same-day
// lockout (see checkGrandTourLockouts for the forfeit side of this rule).
function startGrandTourStage(tourId){
  if(state.raceActive||state.session.active) return;
  const ev=CALENDAR_EVENTS.find(e=>e.id===tourId); if(!ev||!ev.isGrandTour) return;
  if(!state.calendar.signups.includes(tourId)){ showToast('Not signed up for this Grand Tour'); return; }
  const stages=GRAND_TOUR_STAGES[tourId]; if(!stages) return;
  const tp=state.calendar.tourProgress[tourId];
  if(!tp || tp.forfeited){ showToast('This Grand Tour has been forfeited'); return; }
  const stageIndex=tp.stageResults.length;
  if(stageIndex>=stages.length){ showToast('Grand Tour already completed this season'); return; }

  const today=new Date().toDateString();
  if(tp.lastStageCompletedDate===today){
    showToast('⏳ Come back tomorrow for the next stage'); return;
  }
  if(state.energy<ev.energyCost){ showToast(`⚡ Need ${ev.energyCost} energy`); return; }

  state.energy=Math.max(0,state.energy-ev.energyCost);
  state.energySpentToday=(state.energySpentToday||0)+ev.energyCost;
  const stage=stages[stageIndex];
  const result=simulateGrandTourStageResult(tourId, stageIndex);
  state.raceActive=true;
  state.raceData={typeId:'road',startTime:Date.now(),animMs:55000,result,
    virtualPos:Math.round(result.fieldSize*0.45),startVP:Math.round(result.fieldSize*0.45),commentaryIdx:0,
    isCalendarEvent:true, calendarEventId:tourId, isGrandTourStage:true, stageIndex,
    stages:buildRaceStages('road'),
    raceLegs:100, positionDelta:0, pendingDecision:null, lastDecisionResult:null,
    totalPausedMs:0,
  };
  markTaskProgress('enter_race');
  incrementSponsorProgress('enter_races',1);
  saveGame(); updateActivityDots();
  showTab('race');
  openRaceOverlay();
  renderActiveRaceBlock();
}

// Lights up the Calendar tab whenever there's a signed-up event ready to race,
// or the player has just become eligible and hasn't signed up for anything yet.
function updateCalendarBadge(){
  const btn=document.getElementById('tab-btn-calendar'); if(!btn) return;
  if(!isCalendarUnlocked()){ btn.classList.remove('calendar-ready'); return; }
  const hasUnracedSignup = state.calendar.signups.some(id=>!state.calendar.completed[id]);
  const hasOpenSlot = state.calendar.signups.length<getCalendarSlotLimit();
  btn.classList.toggle('calendar-ready', hasUnracedSignup||hasOpenSlot);
}

function buyAccessory(id){
  const u=ACCESSORIES.find(u=>u.id===id);
  if(!u||state.money<u.cost) return;
  if(u.durationDays){
    // Timed, repeatable extras: buying again while still active EXTENDS from
    // the current expiry (not from now), so an early top-up never wastes any
    // already-paid-for time.
    const base=Math.max(Date.now(), state.activeBoosts[id]||0);
    state.activeBoosts[id]=base+u.durationDays*86400000;
    state.money-=u.cost;
  } else {
    if(state.boughtUpgrades.has(id)) return; // permanent — one-time only
    state.money-=u.cost; state.boughtUpgrades.add(id);
    // maxEnergy items (e.g. Recovery Suite) permanently raise the daily cap,
    // same mechanism prestige uses — plus a capped immediate top-up so the
    // purchase feels like something rather than only paying off tomorrow.
    if(u.maxEnergy){
      state.maxEnergy+=u.maxEnergy;
      state.energy=Math.min(MAX_ENERGY_CAP, state.energy+u.maxEnergy);
    }
  }
  recalc(); updateUI(); saveGame();
  const b=[];
  if(u.watts) b.push(`+${u.watts}w`);
  if(u.trainPct) b.push(`+${Math.round(u.trainPct*100)}% training${u.durationDays?` (${u.durationDays}d)`:''}`);
  if(u.racePct) b.push(`+${Math.round(u.racePct*100)}% race day${u.durationDays?` (${u.durationDays}d)`:''}`);
  if(u.maxEnergy) b.push(`+${u.maxEnergy} max energy`);
  showToast(`${u.icon} ${u.name}${b.length?' · '+b.join(', '):''}`);
}
// Regenerates today's price/offer/benefit rolls if the stored market is from a
// previous day. Cheap to call defensively from anywhere that reads market data.
function ensureDailyMarket(){
  const dayKey=getDayKey();
  if(state.dailyMarket && state.dailyMarket.dayKey===dayKey) return;
  const items={};
  ENERGY_ITEMS.forEach(item=>{
    const rng=mulberry32(hashStr(dayKey+'_'+item.id));
    items[item.id]={ priceMult: 0.8+rng()*0.5, benefitMult: 0.85+rng()*0.35, onOffer:false };
  });
  // Pick 1-2 items to feature "on offer" today (extra discount on top of the price roll)
  const offerRng=mulberry32(hashStr(dayKey+'_offer'));
  const offerCount=1+Math.floor(offerRng()*2);
  const shuffled=[...ENERGY_ITEMS.map(i=>i.id)];
  for(let i=shuffled.length-1;i>0;i--){ const j=Math.floor(offerRng()*(i+1)); [shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]]; }
  shuffled.slice(0,offerCount).forEach(id=>{ items[id].onOffer=true; items[id].priceMult*=0.65; });
  state.dailyMarket={dayKey, items};
}

function getMarketPrice(item){
  ensureDailyMarket();
  const m=state.dailyMarket.items[item.id];
  return Math.max(1, Math.round(item.cost*m.priceMult));
}

function getMarketBenefit(item){
  ensureDailyMarket();
  const m=state.dailyMarket.items[item.id];
  return {
    energy: Math.max(1, Math.round(item.energy*m.benefitMult)),
    fatigueRecovery: item.fatigueRecovery>0 ? Math.round(item.fatigueRecovery*m.benefitMult) : 0,
  };
}

function isOnOffer(itemId){ ensureDailyMarket(); return !!state.dailyMarket.items[itemId]?.onOffer; }

// Removes any inventory instance older than its 1-week shelf life. Run on every
// checkDailyReset tick (every 60s + at boot), independent of the calendar-day boundary,
// since an item bought mid-day perishes mid-day exactly a week later.
function expirePerishedItems(){
  const now=Date.now();
  const fresh=state.energyInventory.filter(e=>now-e.purchasedAt<ITEM_SHELF_LIFE_MS);
  const expiredCount=state.energyInventory.length-fresh.length;
  if(expiredCount>0){
    state.energyInventory=fresh;
    saveGame();
    showToast(`🗑️ ${expiredCount} item${expiredCount>1?'s':''} spoiled and were discarded`);
    if(currentTab==='train') renderEnergyCard();
    if(currentTab==='gear') renderEnergyItems();
  }
}

function buyEnergyItem(id){
  const item=ENERGY_ITEMS.find(e=>e.id===id); if(!item) return;
  const price=getMarketPrice(item);
  if(state.money<price){ showToast('Not enough prize money'); return; }
  const benefit=getMarketBenefit(item);
  state.money-=price;
  state.energyInventory.push({
    id:'inv_'+Date.now()+'_'+Math.floor(Math.random()*100000),
    itemType:id, energy:benefit.energy, fatigueRecovery:benefit.fatigueRecovery, purchasedAt:Date.now(),
  });
  markTaskProgress('purchase_item');
  updateHeader();
  if(currentTab==='gear') renderEnergyItems();
  if(currentTab==='train') renderEnergyCard();
  saveGame();
  showToast(`${item.icon} ${item.name} added to inventory! (+${benefit.energy} energy when used)`);
  notifyOnboardingAction('bought_item');
}

function useEnergyItem(id){
  const item=ENERGY_ITEMS.find(e=>e.id===id); if(!item) return;
  // FIFO — use the oldest instance of this item type first, so freshness is spent down naturally
  const candidates=state.energyInventory.filter(e=>e.itemType===id).sort((a,b)=>a.purchasedAt-b.purchasedAt);
  if(!candidates.length){ showToast('None in inventory'); return; }
  if(state.energy>=MAX_ENERGY_CAP){ showToast('⚡ Already at max energy!'); return; }
  const instance=candidates[0];
  state.energyInventory.splice(state.energyInventory.indexOf(instance),1);
  state.energy=Math.min(MAX_ENERGY_CAP, state.energy+instance.energy);
  // Recovery items also reduce today's fatigue, improving tomorrow's starting energy
  if(instance.fatigueRecovery>0){
    state.energySpentToday=Math.max(0,(state.energySpentToday||0)-instance.fatigueRecovery);
  }
  // Weight dynamic: every item eaten counts toward today's carb load. Crossing the
  // daily limit doesn't gain weight immediately — the excess converts to weight at
  // tonight's reset — but we warn once per day on approach so it's never a surprise.
  state.carbsToday=(state.carbsToday||0)+instance.energy;
  const overLimit=state.carbsToday>=CARB_DAILY_LIMIT;
  const nearLimit=state.carbsToday>=CARB_DAILY_LIMIT*0.8;
  let carbWarning='';
  if(!state.carbWarningShownToday && (nearLimit||overLimit)){
    state.carbWarningShownToday=true;
    carbWarning=overLimit
      ? ` · ⚠️ Over today's carb limit — excess adds weight tonight`
      : ` · ⚠️ Approaching today's carb limit (${state.carbsToday}/${CARB_DAILY_LIMIT})`;
  }
  markTaskProgress('use_item');
  updateHeader();
  if(currentTab==='train') renderEnergyCard();
  if(currentTab==='gear') renderEnergyItems();
  saveGame();
  const recovMsg=instance.fatigueRecovery>0?` · 💤 tmr: ${getTomorrowEnergy()}/${state.maxEnergy}`:'';
  showToast(`${item.icon} +${instance.energy} energy!${recovMsg}${carbWarning}`);
}

function canClaimDailyBar(){
  const now=new Date(), last=new Date(state.lastDailyBar||0);
  return now.toDateString()!==last.toDateString();
}

function claimDailyBar(){
  if(!canClaimDailyBar()){ showToast('Already claimed today — come back tomorrow!'); return; }
  // The free daily bar is a flat, reliable freebie — it always uses the base stats,
  // not today's fluctuating market benefit, so the daily gift never feels like a bad roll.
  const item=ENERGY_ITEMS.find(e=>e.id==='bar');
  state.energyInventory.push({
    id:'inv_'+Date.now()+'_'+Math.floor(Math.random()*100000),
    itemType:'bar', energy:item.energy, fatigueRecovery:item.fatigueRecovery, purchasedAt:Date.now(),
  });
  state.lastDailyBar=Date.now();
  saveGame();
  showToast('🍫 Free daily Energy Bar added to your inventory!');
  if(currentTab==='gear') renderEnergyItems();
  if(currentTab==='train') renderEnergyCard();
}

// ─── DAILY TASKS (Growth tab) ───────────────────────────────
// markTaskProgress is called from the relevant action (session complete, race start,
// race result, item purchase, item use) the moment that action happens. It only ever
// flips false→true — completing the same task twice in one day has no extra effect.
function markTaskProgress(id){
  if(!state.dailyTasks.progress[id]){
    state.dailyTasks.progress[id]=true;
    saveGame();
    if(currentTab==='growth') renderGrowthTab();
    updateGrowthBadge();
  }
}

function claimDailyTask(id){
  const task=DAILY_TASKS.find(t=>t.id===id); if(!task) return;
  if(!state.dailyTasks.progress[id]||state.dailyTasks.claimed[id]) return;
  state.dailyTasks.claimed[id]=true;
  ATTR_ORDER.forEach(attr=>addXP(attr,task.xpReward));
  recalc(); saveGame();
  showToast(`✅ ${task.name}: +${task.xpReward} XP to all attributes!`);
  if(currentTab==='growth') renderGrowthTab();
  updateGrowthBadge();
}

function claimAllDailyTasks(){
  const claimable=DAILY_TASKS.filter(t=>state.dailyTasks.progress[t.id]&&!state.dailyTasks.claimed[t.id]);
  if(!claimable.length) return;
  claimable.forEach(t=>{
    state.dailyTasks.claimed[t.id]=true;
    ATTR_ORDER.forEach(attr=>addXP(attr,t.xpReward));
  });
  recalc(); saveGame();
  showToast(`✅ Claimed ${claimable.length} task${claimable.length>1?'s':''}!`);
  if(currentTab==='growth') renderGrowthTab();
  updateGrowthBadge();
}

// Lights up the Growth tab with a pulsing dot whenever a completed task is waiting to be claimed
function updateGrowthBadge(){
  const hasClaimable=DAILY_TASKS.some(t=>state.dailyTasks.progress[t.id]&&!state.dailyTasks.claimed[t.id]);
  const btn=document.getElementById('tab-btn-growth');
  if(btn) btn.classList.toggle('growth-ready',hasClaimable);
}
