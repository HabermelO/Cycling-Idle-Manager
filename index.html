function renderActiveSponsorView(wrap, activeInfo, upgradeAvailable, qualifiedTierIdx){
  const {sponsor,tier}=activeInfo, cv=sponsor.color;

  // ── Upgrade banner ──────────────────────────────────────────
  const upgradeBannerHtml = upgradeAvailable
    ? `<div class="alert-banner">
        <span class="alert-banner-text">🎉 ${SPONSOR_TIERS[qualifiedTierIdx].label} sponsors are now interested in you!</span>
        <button class="claim-all-btn" onclick="setSponsorViewMode('choosing')">🔍 View Options</button>
      </div>`
    : '';

  // ── Weekly objectives ───────────────────────────────────────
  const objCardsHtml=sponsor.objectives.map(o=>{
    const cur=Math.min(o.target, state.sponsor.progress[o.type]||0);
    const pct=Math.round(cur/o.target*100);
    const claimed=state.sponsor.claimed[o.id];
    const ready=!claimed && cur>=o.target;
    let statusHtml;
    if(claimed)    statusHtml=`<span class="task-check" style="color:var(--green-txt)">✅</span>`;
    else if(ready) statusHtml=`<button class="task-claim-btn" onclick="claimSponsorObjective('${o.id}')">Claim</button>`;
    else           statusHtml=`<span style="font-size:12px;color:var(--txt3);font-weight:600">${cur} / ${o.target}</span>`;
    return `<div class="task-card ${claimed?'claimed':ready?'done-unclaimed':''}">
      <div class="task-icon">${o.icon}</div>
      <div class="task-info">
        <div class="task-name">${o.label}</div>
        <div class="rsc-bar-wrap" style="margin-top:6px"><div class="rsc-bar" style="width:${pct}%;background:var(--${cv}-txt)"></div></div>
        <div class="task-reward">Reward: ${fmtMoney(o.reward)}</div>
      </div>
      <div class="task-status">${statusHtml}</div>
    </div>`;
  }).join('');

  // ── Weekly bonus ────────────────────────────────────────────
  const allClaimed=sponsor.objectives.every(o=>state.sponsor.claimed[o.id]);
  const bonusHtml=`<div class="growth-summary" style="margin-top:.5rem">
    <div>
      <div class="growth-summary-label">🎁 Weekly Bonus</div>
      <div class="growth-summary-sub">${state.sponsor.bonusClaimed?'Claimed this week':allClaimed?'All objectives complete — claim your bonus!':'Complete all 3 objectives to unlock'}</div>
    </div>
    <button class="claim-all-btn" onclick="claimSponsorBonus()" ${(allClaimed&&!state.sponsor.bonusClaimed)?'':'disabled'}>${state.sponsor.bonusClaimed?'Claimed':fmtMoney(sponsor.weeklyBonus)}</button>
  </div>`;

  const weekMsRemaining=Math.max(0,7*24*60*60*1000-(Date.now()-state.sponsor.weekStart));
  const daysRemaining=Math.max(0,Math.ceil(weekMsRemaining/(24*60*60*1000)));

  // ── Lateral switch panel — other sponsor at same tier ──────
  const lateralSponsor=getLateralSponsor();
  const lateralCdLeft=getSponsorLateralCooldownRemaining();
  const lateralHtml=lateralSponsor ? `
    <div style="border:.5px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-top:.75rem;background:var(--bg)">
      <div style="font-size:12px;font-weight:700;color:var(--txt2);margin-bottom:6px">🔄 Switch Sponsor (same tier)</div>
      <div style="font-size:11px;color:var(--txt3);line-height:1.5;margin-bottom:8px">
        Switch to <strong>${lateralSponsor.name}</strong> ${lateralSponsor.icon} within your current <strong>${tier.label}</strong> tier.
        Weekly progress resets and there's a 24-hour cooldown before switching again.
      </div>
      ${lateralCdLeft>0
        ? `<div style="font-size:11px;color:var(--amber-txt);font-weight:600">⏳ Can switch again in ${Math.ceil(lateralCdLeft/(60*60*1000))}h</div>`
        : sponsorActionPending===('lateral:'+lateralSponsor.id)
          ? `<button onclick="lateralSwitchSponsor('${lateralSponsor.id}')"
              class="cal-signup-confirm"
              style="font-size:11px;font-weight:700;padding:7px 14px;border-radius:var(--radius);cursor:pointer;width:100%">
              ✓ Confirm switch to ${lateralSponsor.name} — resets weekly progress · tap again
            </button>`
          : `<button onclick="lateralSwitchSponsor('${lateralSponsor.id}')"
              style="font-size:11px;font-weight:700;padding:7px 14px;border-radius:var(--radius);border:.5px solid var(--border);background:var(--bg2);cursor:pointer;color:var(--txt)">
              Switch to ${lateralSponsor.name}
            </button>`
      }
    </div>` : '';

  // ── Terminate contract ──────────────────────────────────────
  const terminatePending=sponsorActionPending==='terminate';
  const terminateHtml=`
    <div style="border:.5px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-top:.75rem;background:var(--bg)">
      <div style="font-size:12px;font-weight:700;color:var(--txt2);margin-bottom:4px">⚠️ Terminate Contract</div>
      <div style="font-size:11px;color:var(--txt3);line-height:1.5;margin-bottom:8px">
        Walk away from <strong>${sponsor.name}</strong>. You'll enter a <strong style="color:var(--red-txt)">3-day cooling-off period</strong>
        during which no sponsor will sign you. All unclaimed rewards are forfeited.
      </div>
      ${terminatePending
        ? `<button onclick="terminateSponsor()"
            style="font-size:11px;font-weight:700;padding:7px 14px;border-radius:var(--radius);cursor:pointer;width:100%;background:var(--red-txt);color:#fff;border:none">
            ⚠️ Confirm termination — 3-day lockout · tap again
          </button>`
        : `<button onclick="terminateSponsor()"
            style="font-size:11px;font-weight:700;padding:7px 14px;border-radius:var(--radius);border:.5px solid var(--red-bd);background:var(--red-bg);cursor:pointer;color:var(--red-txt)">
            Terminate Contract
          </button>`
      }
    </div>`;

  wrap.innerHTML=`
    ${upgradeBannerHtml}
    <div class="spec-banner" style="background:var(--${cv}-bg);border-color:var(--${cv}-bd);color:var(--${cv}-txt)">
      <div class="spec-banner-icon">${sponsor.icon}</div>

        <div class="spec-banner-label">${tier.label} Sponsor</div>

    </div>
    <div class="sponsor-week-remaining">~${daysRemaining}d until objectives reset</div>
    ${objCardsHtml}
    ${bonusHtml}
    ${lateralHtml}
    ${terminateHtml}
    <div style="text-align:center;margin-top:.75rem;font-size:11px;color:var(--txt3)">Lifetime sponsor earnings: <strong style="color:var(--green-txt)">${fmtMoney(state.sponsor.totalEarned||0)}</strong></div>
  `;
}

function toggleCalendarHistory(){ calendarShowHistory=!calendarShowHistory; renderCalendarTab(); }

function renderCalendarTab(){
  const wrap=document.getElementById('calendar-content'); if(!wrap) return;

  if(!isCalendarUnlocked()){
    const cat=RACE_CATEGORIES[state.raceCategory];

      <div class="lifetime-placeholder-icon">🔒</div>
      <strong style="color:var(--txt2)">Calendar Locked</strong><br><br>
      Major Events unlock once you reach <strong>${semiProCat.name} (Semi-Pro)</strong>.
      National championships and — once you turn fully Pro — the Grand Tours will appear here.
      <div style="margin-top:1rem;font-size:12px;color:var(--txt3)">Currently racing as: <strong>${cat.name}</strong></div>
    </div>`;
    return;
  }

  ensureCalendarSeasonStarted();

  const daysRemaining=getCalendarDaysRemaining();
  const slotLimit=getCalendarSlotLimit();
  const slotsUsed=state.calendar.signups.length;
  const events=getAvailableCalendarEvents();

  const signedUpUnraced = events.filter(e=>state.calendar.signups.includes(e.id) && !state.calendar.completed[e.id]);
  const signedUpAndRaced = events.filter(e=>state.calendar.signups.includes(e.id) && state.calendar.completed[e.id]);
  const notSignedUp = events.filter(e=>!state.calendar.signups.includes(e.id));

  const seasonHeaderHtml=`<div class="cal-season-header">
    <div>
      <div class="cal-season-title">📅 Calendar Season</div>
      <div class="cal-season-sub">${daysRemaining} day${daysRemaining!==1?'s':''} remaining this month</div>
    </div>
    <div class="cal-slots-badge">${slotsUsed} / ${slotLimit} slots used</div>
  </div>`;

  const scheduleHtml = signedUpUnraced.length ? `
    <div class="section-lbl">Your Season Schedule</div>
    ${signedUpUnraced.map(ev=>calendarEventCardHtml(ev,'scheduled')).join('')}
  ` : '';

  const completedHtml = signedUpAndRaced.length ? `
    <div class="section-lbl" style="margin-top:.75rem">Completed This Season</div>
    ${signedUpAndRaced.map(ev=>{
      const r=state.calendar.completed[ev.id];
      if(ev.isGrandTour){
        return `<div class="cal-result-row">
          <div class="result-pos-badge pos-1" style="width:40px;height:40px;font-size:18px">${r.gcIcon||'🏆'}</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:700">${ev.icon} ${ev.name}</div>
            <div style="font-size:11px;color:var(--txt2)">${r.gcTier||'GC Finisher'} · ${r.gcPoints||0} GC pts</div>
          </div>
          <div style="font-weight:700;color:${(r.gcBonus||0)>0?'var(--green-txt)':'var(--txt3)'};font-size:13px">${(r.gcBonus||0)>0?'+'+fmtMoney(r.gcBonus):'No bonus'}</div>
        </div>`;
      }
      const posCls=r.position===1?'pos-1':r.position===2?'pos-2':r.position===3?'pos-3':'pos-other';
      return `<div class="cal-result-row">
        <div class="result-pos-badge ${posCls}" style="width:40px;height:40px;font-size:14px">${ordinal(r.position)}</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:700">${ev.icon} ${ev.name}</div>
          <div style="font-size:11px;color:var(--txt2)">${r.position} of ${r.fieldSize} riders</div>
        </div>
        <div style="font-weight:700;color:${r.prize>0?'var(--green-txt)':'var(--txt3)'};font-size:13px">${r.prize>0?'+'+fmtMoney(r.prize):'No prize'}</div>
      </div>`;
    }).join('')}
  ` : '';

  const signupHtml = notSignedUp.length ? `
    <div class="section-lbl" style="margin-top:.75rem">Sign Up — ${slotsUsed>=slotLimit?'No slots remaining':`${slotLimit-slotsUsed} slot${slotLimit-slotsUsed!==1?'s':''} open`}</div>
    ${notSignedUp.map(ev=>calendarEventCardHtml(ev,'signup')).join('')}
  ` : '';

  const historyHtml = state.calendar.history.length ? `
    <div style="text-align:center;margin-top:1rem">
      <button class="gear-nav-btn" onclick="toggleCalendarHistory()">${calendarShowHistory?'Hide':'Show'} Event History (${state.calendar.history.length} past season${state.calendar.history.length!==1?'s':''})</button>
    </div>
    ${calendarShowHistory ? state.calendar.history.map((season,i)=>`
      <div style="margin-top:.6rem">
        <div class="section-lbl">Season ended ${new Date(season.seasonEndedAt).toLocaleDateString()}</div>
        ${season.results.length ? season.results.map(r=>{
          const posCls=r.position===1?'pos-1':r.position===2?'pos-2':r.position===3?'pos-3':'pos-other';
          return `<div class="cal-result-row">
            <div class="result-pos-badge ${posCls}" style="width:36px;height:36px;font-size:12px">${ordinal(r.position)}</div>

            <div style="font-weight:700;color:${r.prize>0?'var(--green-txt)':'var(--txt3)'};font-size:12px">${r.prize>0?'+'+fmtMoney(r.prize):'—'}</div>

        }).join('') : `<div style="font-size:11px;color:var(--txt3);padding:.5rem 0">No events raced this season.</div>`}
        ${season.forfeitedCount>0?`<div style="font-size:10px;color:var(--red-txt);margin-top:2px">${season.forfeitedCount} event${season.forfeitedCount!==1?'s':''} forfeited (signed up but not raced)</div>`:''}
      </div>
    `).join('') : ''}
  ` : '';

  wrap.innerHTML = seasonHeaderHtml + scheduleHtml + completedHtml + signupHtml + historyHtml;
}

// Dedicated card for Grand Tours — the generic card assumes a single-race event
// with an ev.prizes[] table and one raceTypeId, neither of which a Grand Tour has.
// This renders stage progress, the running GC total, and the correct daily action
// (race next stage / come back tomorrow / forfeited), routing to startGrandTourStage.
function grandTourCardHtml(ev, mode){
  if(!state.calendar.tourProgress) state.calendar.tourProgress = {};
  const stages = GRAND_TOUR_STAGES[ev.id] || [];
  const tp = state.calendar.tourProgress[ev.id];
  const doneCount = tp ? tp.stageResults.length : 0;
  const stagePips = stages.map((s,i)=>{
    const done = i < doneCount;
    const isNext = tp && !tp.forfeited && i === doneCount;
    return `<span title="${s.name}: ${s.place}" style="opacity:${done||isNext?1:.4};font-weight:${isNext?800:400}">${s.icon}</span>`;
  }).join(' ');

  let bodyHtml='', actionHtml='';

  if(mode==='signup'){
    const slotsFull=state.calendar.signups.length>=getCalendarSlotLimit();
    const cantAfford=state.money<ev.entryFee;
    const proLocked=!isProTierUnlocked();
    const disabled=proLocked||slotsFull||cantAfford;
    const isPending=calendarSignupPending===ev.id;
    if(isPending){
      actionHtml=`<button class="cal-signup-btn cal-signup-confirm" onclick="signUpForCalendarEvent('${ev.id}')">✓ Confirm — ${fmtMoney(ev.entryFee)} entry · tap again to lock in</button>`;
    } else {
      const label=proLocked?'🔒 Reach Pro to unlock':slotsFull?'No slots remaining':cantAfford?`Need ${fmtMoney(ev.entryFee)}`:`Enter — ${fmtMoney(ev.entryFee)}`;
      actionHtml=`<button class="cal-signup-btn" onclick="signUpForCalendarEvent('${ev.id}')" ${disabled?'disabled':''}>${label}</button>`;
    }
    bodyHtml=`<div class="cal-event-desc" style="margin-top:.25rem">${stages.length} stages · one per day · miss a day and the Tour is forfeited</div>`;
  } else {
    // scheduled — in progress, forfeited, or (guard) complete
    if(tp && tp.forfeited){
      actionHtml=`<button class="cal-start-btn" disabled style="opacity:.7;cursor:default;background:var(--red-bg,#3a1a1a);color:var(--red-txt)">💔 Tour forfeited — you missed a stage</button>`;
      bodyHtml=`<div class="cal-event-desc" style="color:var(--red-txt);margin-top:.25rem">Skipping a day ends the Tour. You reached ${doneCount}/${stages.length} stages (${tp.gcPoints} GC pts). Try again next season.</div>`;
    } else if(doneCount>=stages.length){
      actionHtml=`<button class="cal-start-btn" disabled style="opacity:.6;cursor:default">✅ Tour complete</button>`;
    } else {
      const stage=stages[doneCount];
      const racedToday = tp && tp.lastStageCompletedDate===new Date().toDateString();
      const busy=state.raceActive||state.session.active;
      const noEnergy=state.energy<ev.energyCost;
      const disabled=racedToday||busy||noEnergy;
      let label;
      if(racedToday) label='⏳ Come back tomorrow for the next stage';
      else if(noEnergy) label=`🏁 Stage ${doneCount+1} — need ${ev.energyCost}⚡`;
      else label=`🏁 Race Stage ${doneCount+1}: ${stage.place}`;
      actionHtml=`<button class="cal-start-btn" onclick="startGrandTourStage('${ev.id}')" ${disabled?'disabled':''} style="${disabled?'opacity:.6;cursor:default':''}">${label}</button>`;
      bodyHtml=`<div class="cal-event-desc" style="margin-top:.25rem">
        <strong>Stage ${doneCount+1}/${stages.length}</strong> — ${stage.terrain}<br>
        GC so far: <strong>${tp?tp.gcPoints:0} pts</strong>${doneCount>0?` · ${doneCount} stage${doneCount!==1?'s':''} done`:''}
      </div>`;
    }
  }

  return `<div class="cal-event-card">
    <div class="cal-event-head">
      <div class="cal-event-icon">${ev.icon}</div>
      <div class="cal-event-info">
        <div class="cal-event-name">${ev.name}<span class="cal-event-tierbadge" style="background:var(--amber-bg);color:var(--amber-txt);border:.5px solid var(--amber-bd)">GRAND TOUR</span></div>
        <div class="cal-event-desc">${ev.desc}</div>
      </div>
    </div>
    <div class="cal-event-meta">
      <div class="cal-event-meta-item">Entry: <span class="cal-event-meta-val">${fmtMoney(ev.entryFee)}</span></div>
      <div class="cal-event-meta-item">Energy/stage: <span class="cal-event-meta-val">${ev.energyCost}⚡</span></div>
      <div class="cal-event-meta-item">Stages: <span class="cal-event-meta-val" style="letter-spacing:2px">${stagePips}</span></div>
    </div>
    ${bodyHtml}
    ${actionHtml}
  </div>`;
}

function calendarEventCardHtml(ev, mode){
  if(ev.isGrandTour) return grandTourCardHtml(ev, mode);
  const tierColor = ev.tier==='pro' ? 'amber' : 'purple';
  const tierLabel = ev.tier==='pro' ? 'PRO' : 'SEMI-PRO';
  const proLocked = ev.tier==='pro' && !isProTierUnlocked();
  const prizeStr = `1st ${fmtMoney(ev.prizes[0])} · 2nd ${fmtMoney(ev.prizes[1])} · 3rd ${fmtMoney(ev.prizes[2])}`;

  let actionHtml;
  if(mode==='scheduled'){
    const busy=state.raceActive||state.session.active;
    const noEnergy=state.energy<ev.energyCost;
    actionHtml=`<button class="cal-start-btn" onclick="startCalendarEvent('${ev.id}')" ${(busy||noEnergy)?'disabled':''} style="${(busy||noEnergy)?'opacity:.5;cursor:default':''}">
      🏁 Start Event ${noEnergy?`(need ${ev.energyCost}⚡)`:''}
    </button>`;
  } else {
    const slotsFull=state.calendar.signups.length>=getCalendarSlotLimit();
    const cantAfford=state.money<ev.entryFee;
    const disabled=proLocked||slotsFull||cantAfford;
    const isPending=calendarSignupPending===ev.id;
    if(isPending){
      actionHtml=`<button class="cal-signup-btn cal-signup-confirm" onclick="signUpForCalendarEvent('${ev.id}')">✓ Confirm — ${fmtMoney(ev.entryFee)} entry · tap again to lock in</button>`;
    } else {
      const label=proLocked?'🔒 Reach Pro to unlock':slotsFull?'No slots remaining':cantAfford?`Need ${fmtMoney(ev.entryFee)}`:`Sign Up — ${fmtMoney(ev.entryFee)} entry`;
      actionHtml=`<button class="cal-signup-btn" onclick="signUpForCalendarEvent('${ev.id}')" ${disabled?'disabled':''}>${label}</button>`;
    }
  }

  return `<div class="cal-event-card">
    <div class="cal-event-head">
      <div class="cal-event-icon">${ev.icon}</div>
      <div class="cal-event-info">
        <div class="cal-event-name">${ev.name}<span class="cal-event-tierbadge" style="background:var(--${tierColor}-bg);color:var(--${tierColor}-txt);border:.5px solid var(--${tierColor}-bd)">${tierLabel}</span></div>
        <div class="cal-event-desc">${ev.desc}</div>
      </div>
    </div>
    <div class="cal-event-meta">
      <div class="cal-event-meta-item">Entry: <span class="cal-event-meta-val">${fmtMoney(ev.entryFee)}</span></div>
      <div class="cal-event-meta-item">Energy: <span class="cal-event-meta-val">${ev.energyCost}⚡</span></div>
      <div class="cal-event-meta-item">Field: <span class="cal-event-meta-val">${ev.fieldSize} riders</span></div>
    </div>
    <div class="cal-event-prizes">💰 ${prizeStr}</div>
    ${actionHtml}
  </div>`;
}

      equippedTitle:state.equippedTitle,
      totalRaces:state.totalRaces, totalPodiums:state.totalPodiums,
      raceWinsByType:state.raceWinsByType,
      winsSincePrestige:state.winsSincePrestige,
      specialisation:state.specialisation,
      energyInventory:state.energyInventory,
      lastDailyBar:state.lastDailyBar,
      dailyMarket:state.dailyMarket,
      energySpentToday:state.energySpentToday,
      todayEnergyAllocation:state.todayEnergyAllocation,
      riderWeight:state.riderWeight,
      carbsToday:state.carbsToday,
      carbWarningShownToday:state.carbWarningShownToday,
      dailyTasks:state.dailyTasks,
      sponsor:state.sponsor,
      calendar:state.calendar,
      ftpHistory:state.ftpHistory,
      loginStreak:state.loginStreak,
      lastLoginDate:state.lastLoginDate,
      pendingMorningReward:state.pendingMorningReward,
      pendingSession:state.session.awaitingCollection
        ? {typeId:state.session.typeId, pendingXP:state.session.pendingXP||[], isCritical:!!state.session.isCritical}
        : null,
      lastSavedAt:Date.now(),
    }));
  }catch(e){ console.warn('[CIM] Save failed:',e); }
}

function loadGame(){
  try{
    const raw=localStorage.getItem(SAVE_KEY); if(!raw) return;
    const d=JSON.parse(raw);
    state.money=d.money||0; state.seasonMoney=d.seasonMoney||0; state.lifetimeMoney=d.lifetimeMoney||0;
    // Saves that predate this feature (d.onboarding undefined) default to done:true —
    // only a genuinely brand-new player (no save file at all, loadGame returns early
    // above) keeps the fresh state default of done:false and sees the tutorial.
    state.onboarding = d.onboarding || {step:0, done:true};
    state.season=d.season||1; state.seasonsCompleted=d.seasonsCompleted||0; state.prestigeMult=d.prestigeMult||1;
    state.energy=d.energy??DAILY_ENERGY; state.maxEnergy=d.maxEnergy||DAILY_ENERGY; state.lastEnergyReset=d.lastEnergyReset||0;
    state.boughtUpgrades=new Set(d.bought||[]); state.activeBoosts=d.activeBoosts||{}; state.trainCooldowns=d.trainCooldowns||{}; state.raceCooldowns=d.raceCooldowns||{};
    state.raceCategory=d.raceCategory||0; state.categoryPoints=d.categoryPoints||0;
    state.rival = d.rival || { name:null, ftp:0, categoryIndexAtAssignment:-1, wins:0, losses:0, firstWinAchieved:false };
    state.raceHistory=d.raceHistory||[]; state.lastRaceResult=d.lastRaceResult||null; state._lastSavedAt=d.lastSavedAt||0;
    state.equippedBike   = d.equippedBike   || 'starter';
    state.ownedBikes     = new Set(d.ownedBikes   || ['starter']);
    state.equippedWheels = d.equippedWheels || 'training';
    state.ownedWheels    = new Set(d.ownedWheels  || ['training']);
    state.equippedKit    = d.equippedKit    || 'club_jersey';
    state.ownedKits      = new Set(d.ownedKits    || ['club_jersey']);
    state.equippedKitColor   = d.equippedKitColor   || 'default';
    state.unlockedKitColors  = new Set(d.unlockedKitColors || ['default']);
    state.earnedAchievements = new Set(d.earnedAchievements || []);
    state.uncollectedAchievements = new Set(d.uncollectedAchievements || []);
    // Fallback for saves predating this field: seed from current raceCategory
    // so an existing mid-career player doesn't lose credit for where they are.
    state.highestCategoryReached = Math.max(d.highestCategoryReached||0, state.raceCategory||0);
    state.claimedGoalTiers     = new Set(d.claimedGoalTiers || []);
    state.uncollectedGoalTiers = new Set(d.uncollectedGoalTiers || []);
    state.unlockedTitles       = new Set(d.unlockedTitles || []);
    state.equippedTitle        = d.equippedTitle || null;
    state.totalRaces    = d.totalRaces    || 0;
    state.totalPodiums  = d.totalPodiums  || 0;
    state.raceWinsByType= d.raceWinsByType|| {crit:0,road:0,tt:0,hill:0};
    // Fallback for saves predating this field: default to the player's lifetime
    // win count so an existing player with an active sponsor doesn't suddenly
    // find themselves locked out just from loading an old save.
    state.winsSincePrestige = d.winsSincePrestige ?? Object.values(state.raceWinsByType).reduce((a,b)=>a+b,0);
    state.specialisation= d.specialisation|| null;
    // energyInventory format changed from {itemId: count} to an array of purchased
    // instances (each with its own locked-in benefit + purchase date for perishing).
    // Old saves are migrated here: each old count becomes that many fresh instances
    // using the item's base stats, timestamped "now" so they don't immediately spoil.
    if(Array.isArray(d.energyInventory)){
      state.energyInventory = d.energyInventory;
    } else if(d.energyInventory && typeof d.energyInventory==='object'){
      const migrated=[];
      Object.entries(d.energyInventory).forEach(([itemType,count])=>{
        const baseItem=ENERGY_ITEMS.find(i=>i.id===itemType);
        if(baseItem) for(let i=0;i<(count||0);i++){
          migrated.push({id:'inv_migrated_'+itemType+'_'+i, itemType, energy:baseItem.energy, fatigueRecovery:baseItem.fatigueRecovery, purchasedAt:Date.now()});
        }
      });
      state.energyInventory = migrated;
    } else {
      state.energyInventory = [];
    }
    state.dailyMarket = d.dailyMarket || {dayKey:'', items:{}};
    state.lastDailyBar   = d.lastDailyBar   || 0;
    state.energySpentToday = d.energySpentToday || 0;
    // Fallback for saves predating this field: use maxEnergy so a returning player's
    // current energy isn't suddenly truncated mid-session. The fatigue-adjusted cap
    // takes effect correctly from their next daily reset onward.
    state.todayEnergyAllocation = d.todayEnergyAllocation ?? state.maxEnergy;
    state.riderWeight = d.riderWeight ?? DEFAULT_RIDER_WEIGHT;
    state.carbsToday = d.carbsToday || 0;
    state.carbWarningShownToday = d.carbWarningShownToday || false;
    // Defensive merge: if new task ids are added in a future update, fill in defaults
    // for any keys missing from an older save rather than crashing or losing state.
    const defaultProgress=Object.fromEntries(DAILY_TASKS.map(t=>[t.id,false]));
    const defaultClaimed =Object.fromEntries(DAILY_TASKS.map(t=>[t.id,false]));
    state.dailyTasks = {
      resetDate: d.dailyTasks?.resetDate || 0,
      progress:  {...defaultProgress, ...(d.dailyTasks?.progress||{})},
      claimed:   {...defaultClaimed,  ...(d.dailyTasks?.claimed ||{})},
    };
    state.sponsor = {
      activeId:      d.sponsor?.activeId ?? null,
      activeTierIdx: d.sponsor?.activeTierIdx ?? -1,
      weekStart:     d.sponsor?.weekStart || 0,
      progress:      d.sponsor?.progress || {win_races:0,enter_races:0,podiums:0,sessions:0,prize_money:0},
      claimed:       d.sponsor?.claimed || {},
      bonusClaimed:  d.sponsor?.bonusClaimed || false,
      totalEarned:   d.sponsor?.totalEarned || 0,
      terminatedAt:  d.sponsor?.terminatedAt || 0,
      lateralCooldownUntil: d.sponsor?.lateralCooldownUntil || 0,
    };
    state.calendar = {
      seasonStartDate: d.calendar?.seasonStartDate || 0,
      signups:          d.calendar?.signups   || [],
      completed:        d.calendar?.completed || {},
      history:          d.calendar?.history   || [],
      tourProgress:     d.calendar?.tourProgress || {},
    };
    state.ftpHistory = Array.isArray(d.ftpHistory) ? d.ftpHistory : [];
    state.loginStreak          = d.loginStreak          || 0;
    state.lastLoginDate        = d.lastLoginDate        || null;
    state.pendingMorningReward = d.pendingMorningReward || null;
    // Restore any session that completed but hadn't been collected before the page closed
    if(d.pendingSession){
      state.session={active:true, typeId:d.pendingSession.typeId,
        awaitingCollection:true, pendingXP:d.pendingSession.pendingXP||[],
        isCritical:!!d.pendingSession.isCritical,
        startTime:Date.now(), duration:0};
    }
    if(d.attributes) ATTR_ORDER.forEach(id=>{ if(d.attributes[id]){state.attributes[id].xp=d.attributes[id].xp||0;state.attributes[id].level=d.attributes[id].level||0;} });
  }catch(e){ console.warn('[CIM] Load failed:',e); }
}

function cleanupExpiredCooldowns(){
  const now=Date.now();
  for(const id of Object.keys(state.trainCooldowns)) if(state.trainCooldowns[id]<=now) delete state.trainCooldowns[id];
  for(const id of Object.keys(state.raceCooldowns))  if(state.raceCooldowns[id]<=now)  delete state.raceCooldowns[id];
}

function applyOfflineProgress(){
  if(!state._lastSavedAt) return;
  const awayMs=Date.now()-state._lastSavedAt;
  const awaySec=awayMs/1000;
  if(awaySec<5) return;

  // Sponsor passive income (capped at 5 minutes to avoid huge offline windfalls)
  if(D.sponsorPerSec>0){
    const gained=D.sponsorPerSec*Math.min(awaySec,300);
    earnMoney(gained);
    if(awayMs>30000) setTimeout(()=>showToast(`💤 +${fmtMoney(gained)} sponsorship while away`),600);
  }

  // Energy regen while closed: full offline time at ENERGY_REGEN_RATE, capped at
  // TODAY's fatigue-adjusted allocation — not state.maxEnergy. This is what stops
  // an overnight close-and-reopen from silently erasing the fatigue penalty.
  if(state.energy<state.todayEnergyAllocation){
    const regenGained=Math.min(state.todayEnergyAllocation-state.energy, ENERGY_REGEN_RATE*awaySec);
    if(regenGained>=1){
      state.energy=Math.min(state.todayEnergyAllocation, state.energy+regenGained);
      if(awayMs>60000) setTimeout(()=>showToast(`⚡ +${Math.floor(regenGained)} energy regenerated while away`),800);
    }
  }
}

// ═══════════════════════════════════════════════════════════
// GAME LOOP
// ═══════════════════════════════════════════════════════════
let lastTick=Date.now(), _lastRaceRender=0, _lastListRender=0, _lastSessionRender=0;
function gameTick(){
  const now=Date.now(), delta=(now-lastTick)/1000; lastTick=now;
  // FIX 3: Only earn passive income while tab is visible — the visibilitychange handler
  // covers the offline period, so earning here while hidden causes double-counting
  if(D.sponsorPerSec>0 && !document.hidden) earnMoney(D.sponsorPerSec*delta);
  // Idle energy regen: 1pt per 10min (6/hr), capped at TODAY's fatigue-adjusted
  // allocation (state.todayEnergyAllocation), not state.maxEnergy. This was the
  // root cause of the overnight-fatigue-reset bug — the comment always said
  // "today's allocation" but the code referenced the wrong variable.
  // MAX_ENERGY_CAP (item-boost ceiling) is deliberately excluded — regen only fills
  // your daily pot back up, it can't replace the benefit of energy items or exploit
  // the cap. Header updates only when the displayed integer changes to avoid DOM thrash.
  if(!document.hidden && state.energy<state.todayEnergyAllocation){
    const prevFloor=Math.floor(state.energy);
    state.energy=Math.min(state.todayEnergyAllocation, state.energy+ENERGY_REGEN_RATE*delta);
    if(Math.floor(state.energy)!==prevFloor) updateHeader();
  }
  if(state.session.active){
    const t=TRAINING.find(t=>t.id===state.session.typeId);
    // Timer done and not yet collected — switch to collect-reward state
    if(!state.session.awaitingCollection && t && now-state.session.startTime>=state.session.duration){
      let sessMult=D.sessionMult;
      if(state.specialisation==='climber'&&(t.id==='z2'||t.id==='z5')) sessMult*=1.25;
      else if(state.specialisation==='sprinter'&&t.id==='z6') sessMult*=1.30;
      else if(state.specialisation==='rouleur') sessMult*=1.15;
      // CRITICAL SESSION: 15% chance the whole session pays out at 2× XP.
      // Rolled once here, the instant the timer finishes — never re-rolled on
      // render — so the player can't refresh/reopen their way to a better roll.
      const isCritical = Math.random() < 0.15;
      if(isCritical) sessMult *= 2;
      state.session.awaitingCollection=true;
      state.session.isCritical=isCritical;
      state.session.pendingXP=Object.entries(t.xpGains).map(([attr,base])=>({attr,amount:Math.round(base*sessMult)}));
      saveGame();
      if(currentTab==='train') renderActiveSession();
      return;
    }
    if(currentTab==='train'&&now-_lastSessionRender>=200){ renderActiveSession(); _lastSessionRender=now; }
  }
  if(state.raceActive&&state.raceData){
    const rd=state.raceData;
    const elapsed=getEffectiveElapsed(rd,now); // excludes time spent showing decision cards
    const rt=RACE_TYPES.find(r=>r.id===rd.typeId);
    // Commentary length comes from the rolled course when present, matching
    // the same course-vs-base-type source used by renderActiveRaceBlock.
    const tickCourse=getRaceCourse(rd);
    const commentaryLen=tickCourse?tickCourse.commentary.length:(rt?rt.commentary.length:0);
    if(commentaryLen>0) rd.commentaryIdx=Math.min(Math.floor(elapsed/(rd.animMs/commentaryLen)),commentaryLen-1);
    const progress=elapsed/rd.animMs, fs=rd.result.fieldSize, fp=rd.result.position;
    if(progress<0.55){ if(Math.random()<0.15) rd.virtualPos=Math.max(1,Math.min(fs,rd.virtualPos+Math.round((Math.random()-0.5)*4))); }
    else{ rd.virtualPos=Math.max(1,Math.min(fs,Math.round(rd.startVP+(fp-rd.startVP)*((progress-0.55)/0.45)))); }
    // Fire decision stages as race progress crosses each triggerPct
    if(!rd.pendingDecision && rd.stages){
      for(const stage of rd.stages){
        if(!stage.fired && progress>=stage.triggerPct){
          stage.fired=true;
          rd.pendingDecision={event:stage.event, startedAt:Date.now()};
          rd.lastDecisionResult=null; // clear any previous result card
          try{ navigator.vibrate?.(30); }catch(e){}
          break; // one decision at a time
        }
      }
    }
    // Auto-select the default choice after 30 seconds
    // Drive decision state machine:
    // A) If a choice has been selected (tapped), wait 1s then resolve it
    // B) If no choice yet and 30s have elapsed, auto-select the default then highlight for 1s
    if(rd.pendingDecision){
      const {selectedChoiceId, selectedAt, startedAt}=rd.pendingDecision;
      if(selectedChoiceId){
        // Player tapped — wait 1s for highlight, then apply
        if(now-selectedAt>=1000) resolveRaceDecision();
      } else {
        // No tap yet — check auto-select timer (30s)
        const decisionAge=now-startedAt;
        if(decisionAge>=30000){
          const dflt=rd.pendingDecision.event.choices.find(c=>c.defaultChoice)||rd.pendingDecision.event.choices[0];
          showToast(`⏱️ Time up — auto: ${dflt.label}`);
          // Mark as selected so the 1s highlight path takes over
          rd.pendingDecision.selectedChoiceId=dflt.id;
          rd.pendingDecision.selectedAt=now;
          rd.pendingDecision.wasAutoSelected=true;
          if(document.getElementById('race-overlay').style.display==='block') renderActiveRaceBlock();
        }
      }
    }
    if(elapsed>=rd.animMs){ completeRace(); if(currentTab==='race') renderRaceTab(); return; }
    if(document.getElementById('race-overlay').style.display==='block'&&now-_lastRaceRender>=100){
      // While a decision card is showing and the player hasn't tapped yet, DON'T
      // rebuild the whole block — that destroys the button DOM every 100ms and
      // swallows clicks before they can register (especially on Mac and mobile).
      // Instead, surgically update only the countdown timer bar in-place.
      const pending=state.raceData?.pendingDecision;
      if(pending && !pending.selectedChoiceId){
        const timerFill=document.querySelector('.decision-timer-fill');
        const timerText=document.querySelector('.decision-timer-text');
        if(timerFill&&timerText){
          // Card is already in the DOM — just update the countdown numbers
          const age=now-pending.startedAt;
          timerFill.style.width=Math.max(0,Math.round((1-age/30000)*100))+'%';
          timerText.textContent=`Auto in ${Math.max(0,Math.ceil((30000-age)/1000))}s`;
        } else {
          // Decision just fired but the card hasn't been rendered yet —
          // must do a full render so the card actually appears
          renderActiveRaceBlock();
        }
      } else {
        renderActiveRaceBlock();
      }
      _lastRaceRender=now;
    }
  }
  updateHeader();
  if(now-_lastListRender>=1000){
    if(currentTab==='train'&&!state.session.active){ renderSessionList(); renderEnergyCard(); }
    if(currentTab==='race'&&!state.raceActive){ renderRaceTypes(); renderCategoryCard(); }
    _lastListRender=now;
  }
}
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden){
    const now=Date.now(), awayMs=now-lastTick;
    // Sponsor passive income for tab-hidden time (capped at 5 min to match boot logic)
    if(awayMs>5000&&D.sponsorPerSec>0){
      const gained=D.sponsorPerSec*Math.min(awayMs,300000)/1000;
      earnMoney(gained);
      if(awayMs>30000) showToast(`💤 +${fmtMoney(gained)} sponsorship while away`);
    }
    // Energy regen for tab-hidden time — capped at today's fatigue-adjusted
    // allocation, not state.maxEnergy (see applyOfflineProgress for full rationale).
    if(awayMs>0 && state.energy<state.todayEnergyAllocation){
      const regenGained=Math.min(state.todayEnergyAllocation-state.energy, ENERGY_REGEN_RATE*(awayMs/1000));
      if(regenGained>=1){
        state.energy=Math.min(state.todayEnergyAllocation, state.energy+regenGained);
        if(awayMs>60000) showToast(`⚡ +${Math.floor(regenGained)} energy regenerated while away`);
        updateHeader();
      }
    }
    lastTick=now;
  }
});

// ═══════════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════════
loadGame();
cleanupExpiredCooldowns();
recalc();
ensureDailyMarket();
ensureCalendarSeasonStarted();
checkDailyReset();
// If a morning reward is already pending (restored from save or daily reset
// just fired on load), show the collect card straight away.
if(state.pendingMorningReward && currentTab==='train') renderEnergyCard();
applyOfflineProgress();
recordFtpSnapshot(); // seed a baseline point for players loading an existing save
// Re-queue any achievements that were earned but never collected — e.g. the
// app was closed before the player tapped "Collect Reward" on the ceremony.
// Guarantees every achievement reward is always eventually claimable, never
// silently lost just because the tab closed at the wrong moment.
if(state.uncollectedAchievements && state.uncollectedAchievements.size>0){
  [...state.uncollectedAchievements].forEach(id=>enqueueCeremony({type:'achievement', achievementId:id}));
}
// Same guarantee for Lifetime Goal tiers.
if(state.uncollectedGoalTiers && state.uncollectedGoalTiers.size>0){
  [...state.uncollectedGoalTiers].forEach(key=>{
    const [trackId,tierIndex]=key.split(':');
    enqueueCeremony({type:'lifetimegoal', trackId, tierIndex:Number(tierIndex)});
  });
}
// A page reload mid-race must re-open the fullscreen overlay automatically —
// overlay visibility is state-driven, not just event-driven from startRace.
if(state.raceActive && state.raceData){ openRaceOverlay(); renderActiveRaceBlock(); }
updateUI();
updateActivityDots();
updateGrowthBadge();
updateSponsorBadge();
updateCalendarBadge();
// Onboarding tour — only ever fires for a genuinely brand-new player (see the
// done:true default applied to pre-existing saves in loadGame). Runs last so
// the real UI underneath is fully rendered before the spotlight appears.
// An interrupted REPLAY (app closed mid-tour) must NOT re-enter startOnboarding
// — that path grants the £20 welcome bonus and would be repeatable for free
// money. Resume the replay overlay directly instead.
if(!state.onboarding.done){
  if(state.onboarding.replay){
    document.getElementById('onboard-layer').style.display='block';
    renderOnboardingStep();
  } else {
    startOnboarding();
  }
}
setInterval(gameTick,100);
setInterval(saveGame,15000);
setInterval(()=>{
  checkDailyReset();
  // Timed Extras (coach/altitude/wind tunnel) are read live from
  // state.activeBoosts inside recalc() — without a periodic call here, a
  // boost's bonus would only actually disappear the next time SOME other
  // action happened to call recalc() (buying gear, levelling up, etc.),
  // which could be a long time after it truly expired.
  recalc();
  // Keep the Race tab's course cards + rotation countdown accurate to the
  // minute while the player is looking at it. Guarded on !raceActive so a
  // live race in progress is never re-rendered out from under the player.
  if(currentTab==='race' && !state.raceActive) renderRaceTypes();
},60000);

// ── PWA: register service worker for offline support ──
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js')
      .then(reg => console.log('[CIM] SW registered:', reg.scope))
      .catch(err => console.warn('[CIM] SW failed:', err));
  });
}
</script>
</body>
